<script>window.SNAPMON_ASSET_BASE = '/';</script><script src="/src/platform.js"></script><script src="/src/color.js">// GPU/CPU consistency: every photo through the full standard engine twice, first with GPU backends allowed
// (WebGL for the detector/classifier, WebGPU for TinyCLIP when the browser exposes an adapter), then forced to the CPU.
window.runEquivalence = async (labels, variant) => {
  ClipLens.CFG.variant = variant;
  const pass = async () => {
    const t = performance.now(); const ok = await Engine.load();
    const res = { load: { ok, ms: Math.round(performance.now() - t), error: Engine.status.error, backends: { ...Engine.status.backends } }, results: [] };
    if (!ok) return res;
    for (const L of labels) {
      try {
        const img = await loadImg('/lab/data/photos/' + L.file);
        const t0 = performance.now(), r = await Engine.recognize(img, { timeoutMs: 120000 });
        res.results.push({ file: L.file, ms: Math.round(performance.now() - t0), clipMs: r.clip.inferMs, decision: r.rec.decision, top: r.rec.candidates.map(c => c.obj),
          prod: r.prodOnly.candidates.map(c => [c.obj, +c.conf.toFixed(4)]), clip: r.clip.regions.map(g => ({ obj: g.best.obj, p: g.best.p, margin: g.margin, accepted: g.accepted })) });
      } catch (e) { res.results.push({ file: L.file, error: String(e.message || e) }); }
    }
    return res;
  };
  Engine.setClipGPU(true); // v0.4.1: players run TinyCLIP on WASM; the GPU pass opts into WebGPU explicitly
  const gpu = await pass();
  Engine.setClipGPU(false); Engine.setForceCPU(true);
  const cpu = await pass();
  return { gpu, cpu };
};
</script>

<script>
// Benchmark page: runs the production lens and the experimental lens on each labelled photo. Ground truth is
// only used by the scoring script afterwards; it never reaches either recogniser.
ClipLens.CFG.workerPath = '/src/workers/clip-worker.js'; // models and runtimes resolve from the site root via SNAPMON_ASSET_BASE
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
window.runBench = async (labels, variant) => {
  const out = { variant, prodLoad: null, clipLoad: null, results: [] };
  let t = performance.now(); await Lens.load(); out.prodLoad = { ms: Math.round(performance.now() - t), state: Lens.status.state, error: Lens.status.error, sources: Lens.status.sources, backend: Lens.status.backend };
  if (variant) { ClipLens.CFG.variant = variant; t = performance.now(); await ClipLens.load(); out.clipLoad = { ms: Math.round(performance.now() - t), state: ClipLens.status.state, error: ClipLens.status.error, info: ClipLens.status.info }; }
  for (const L of labels) {
    const r = { file: L.file };
    try {
      const img = await loadImg('/lab/data/photos/' + L.file);
      const rec = await Lens.recognize(img);
      r.prod = { decision: rec.decision, ms: rec.debug.times.total, cands: rec.candidates.map(c => ({ obj: c.obj, conf: +c.conf.toFixed(3), box: !!c.box })), boxes: rec.boxes.length,
                 full: rec.debug.full.slice(0, 3).map(f => f.map) };
      if (variant && ClipLens.status.state === 'ready') {
        const cr = await ClipLens.recognize(rec.image, rec);
        r.clip = { ms: cr.totalMs, infer: cr.inferMs, regions: cr.regions.map(g => ({ cls: g.cls, accepted: g.accepted, why: g.why, p: +g.best.p.toFixed(4), cos: g.best.cos, margin: +g.margin.toFixed(4), cal: g.calibrated,
                   top: g.ranked.map(x => ({ obj: x.obj, p: +x.p.toFixed(4) })) })) };
        const fused = ClipLens.fuse(rec, cr);
        r.hybrid = fused.map(c => ({ obj: c.obj, conf: +(c.conf || 0).toFixed(3), rule: c.rule }));
      }
    } catch (e) { r.error = String(e.message || e); }
    out.results.push(r);
  }
  return out;
};
