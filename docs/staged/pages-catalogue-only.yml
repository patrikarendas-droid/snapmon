# STAGED — NOT ACTIVE. This file is deliberately outside .github/workflows/, so GitHub never runs it.
# Proposal for the day the owner approves retiring the playable browser game (docs/CATALOGUE.md → "Keeping the
# catalogue online after the browser game"). To activate (owner approval required, on the production branch):
#   1. copy this file over .github/workflows/pages.yml (same workflow name, same Pages environment, same URL);
#   2. merge into claude/snapmon-game-dev-7o667u with a merge commit; the deploy replaces the game at /snapmon/ with
#      a notice page and keeps the catalogue at /snapmon/catalogue/ (same origin → same Firebase authorised domain,
#      same sign-in, same IndexedDB/localStorage review data in each browser).
# Rollback: `git revert -m 1 <that merge>` on the production branch (or re-run the previous successful Pages run's
# deploy) brings the full website, game included, back; nothing in Firebase or in browsers is touched either way.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main, master, claude/snapmon-game-dev-7o667u]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Catalogue data and writing checks
        run: |
          node tests/catalogue-model.js
          node tools/curated.js validate
      - name: Catalogue-only site, tested as served under /snapmon/
        run: |
          npm i --no-save --silent playwright@1.48.2
          npx playwright install --with-deps chromium > /dev/null
          mkdir -p shots
          node tools/catalogue/build-site.js _site
          node tests/e2e-catalogue-preview.js _site 8799 shots
          node tools/catalogue/serve.js _site 8798 &
          sleep 1
          node tests/e2e-catalogue-local.js http://localhost:8798/snapmon/ shots
          node tests/e2e-catalogue-ai.js http://localhost:8798/snapmon/ shots
          node tests/e2e-catalogue-sync.js http://localhost:8798/snapmon/
          node tests/e2e-catalogue-sprite.js http://localhost:8798/snapmon/ shots
          node tests/e2e-catalogue-storage.js http://localhost:8798/snapmon/
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/catalogue/build-site.js _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
