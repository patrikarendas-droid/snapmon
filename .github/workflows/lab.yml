name: Recognition lab
# Developer-only experiments (model probing, conversion, benchmarks). Runs when lab files change on a feature branch,
# or manually. Never deploys anything.
on:
  push:
    branches: ['feature/**']
    paths: ['lab/**', '.github/workflows/lab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe candidate models
        run: node lab/probe-models.mjs
