# GitHub Pages = the developer CATALOGUE only (activated 2026-11-25 with the owner's approval). The playable browser
# game was retired from the website (the game itself lives on as the mobile app). The site keeps the same origin and paths:
#   https://patrikarendas-droid.github.io/snapmon/catalogue/  the catalogue, unchanged (same Firebase authorised domain,
#                                                            sign-in and per-browser review data)
#   https://patrikarendas-droid.github.io/snapmon/            a notice page with a READ-ONLY "show my backup code" for
#                                                            old browser-game progress (it never writes or deletes)
# Contents: tools/catalogue/build-site.js (the catalogue + only the files its page loads), nothing else.
# Rollback to the full old website (game included): `git revert -m 1 <the merge that activated this>` on
# claude/snapmon-game-dev-7o667u (redeploys the website as of 07841aa, game included); details docs/CATALOGUE.md.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main, master, claude/snapmon-game-dev-7o667u]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Catalogue data and writing checks
        run: |
          node tests/catalogue-model.js
          node tools/curated.js validate
      - name: Catalogue-only site, tested as served under /snapmon/
        run: |
          npm i --no-save --silent playwright@1.48.2
          npx playwright install --with-deps chromium > /dev/null
          mkdir -p shots
          node tools/catalogue/build-site.js _site
          node tests/e2e-catalogue-preview.js _site 8799 shots
          node tools/catalogue/serve.js _site 8798 &
          sleep 1
          node tests/e2e-catalogue-local.js http://localhost:8798/snapmon/ shots
          node tests/e2e-catalogue-ai.js http://localhost:8798/snapmon/ shots
          node tests/e2e-catalogue-sync.js http://localhost:8798/snapmon/
          node tests/e2e-catalogue-sprite.js http://localhost:8798/snapmon/ shots
          node tests/e2e-catalogue-storage.js http://localhost:8798/snapmon/
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/catalogue/build-site.js _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
