name: Deploy to GitHub Pages
on:
  push:
    branches: [main, master, claude/snapmon-game-dev-7o667u]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/sim.js > /dev/null
      - run: node tests/labels.js
      - run: node tests/sprite-regress.js check tests/fixtures/sprite-baseline-v1.json
      - run: node tools/build.js
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest icon.svg src dist _site/
      - name: Mirror AI models onto the site (best effort)
        continue-on-error: true
        run: node tools/fetch-models.js _site/models
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
