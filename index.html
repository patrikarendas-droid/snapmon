<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--ARTIFACT-HEAD-->
<title>SNAPMON: Monsters Among Us</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#110d1b">
<meta name="description" content="Photograph real objects to reveal the monsters hiding inside them. Fight, capture and collect.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Chakra+Petch:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app — status bar, scrolling screen, fixed thumb-reach tab bar; battles and scans take over the screen. */
:root {
  --ink: #110d1b; --panel: #1b1530; --panel-2: #251d40; --line: #3a2f5e; --text: #f1ecff; --muted: #a79dc9;
  --ecto: #7cf5d3; --flash: #ffcf5a; --danger: #ff5d73; --good: #62d87a; --violet: #a68bff;
  --r-common: #a9b4c6; --r-uncommon: #62d87a; --r-rare: #4fb0ff; --r-epic: #c977ff; --r-legendary: #ffbe3b;
  --font-display: 'Pixelify Sans', 'Courier New', monospace;
  --font-body: 'Chakra Petch', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --tabbar: 64px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; } /* author display rules must never override the hidden attribute */
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--text); font: 15px/1.45 var(--font-body); overscroll-behavior: none; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ecto); outline-offset: 2px; }
img.px, canvas.px { image-rendering: pixelated; image-rendering: crisp-edges; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: 0.02em; }
h3 { font-family: var(--font-body); letter-spacing: 0; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }

#app { max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; position: relative;
  background: radial-gradient(120% 60% at 50% -10%, #2a1f4d 0%, transparent 60%), var(--ink); }

/* ---- top status bar ---- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center;
  padding-block: 10px 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(var(--ink) 70%, transparent); }
.lvl-badge { width: 44px; height: 44px; border-radius: 12px; background: var(--panel-2); border: 2px solid var(--line); display: grid; place-items: center; font-family: var(--font-body); font-weight: 700; line-height: 1; text-align: center; }
.lvl-badge b { font-size: 18px; display: block; } .lvl-badge span { font-size: 9px; color: var(--muted); letter-spacing: .12em; }
.bars { display: grid; gap: 5px; min-width: 0; }
.bar { height: 10px; border-radius: 6px; background: #0b0814; border: 1px solid var(--line); overflow: hidden; position: relative; }
.bar > i { position: absolute; inset: 0 auto 0 0; border-radius: 5px; transition: width .35s ease; }
.bar.hp > i { background: linear-gradient(90deg, #ff5d73, #ff9a6b); }
.bar.hp.ok > i { background: linear-gradient(90deg, #45d07a, #a6f07a); }
.bar.xp > i { background: linear-gradient(90deg, #7a5cff, #7cf5d3); }
.bar.en > i { background: linear-gradient(90deg, #ffb13b, #ffe55c); }
.bar-row { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); }
.bar-row .bar { flex: 1; }
.bar-row .lbl { width: 22px; font-weight: 700; letter-spacing: .06em; }
.bar-row .val { min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
.top-right { display: flex; gap: 6px; align-items: center; }
.wallet { display: grid; justify-items: end; font-size: 12px; line-height: 1.25; font-variant-numeric: tabular-nums; }
.wallet .c { color: var(--flash); font-weight: 700; } .wallet .r { color: var(--ecto); font-weight: 700; }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; padding: 0; }
.icon-btn svg { width: 20px; height: 20px; }

/* ---- screens ---- */
main#screen { flex: 1; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 4px calc(var(--tabbar) + 24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
.screen-enter { animation: screenIn .28s ease both; }
@keyframes screenIn { from { opacity: .3; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.section-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.section-title h2 { font-size: 20px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

.btn { border: none; border-radius: 12px; padding: 12px 16px; font-weight: 700; letter-spacing: .02em; background: var(--panel-2); border: 1px solid var(--line); min-height: 46px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .08s ease, filter .15s; user-select: none; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--flash); color: #1b1206; border-color: transparent; }
.btn.ecto { background: var(--ecto); color: #062019; border-color: transparent; }
.btn.danger { background: var(--danger); color: #22060c; border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 36px; padding: 7px 12px; font-size: 13px; border-radius: 10px; }
.btn[disabled], .btn.disabled { opacity: .42; pointer-events: none; }
.btn.block { width: 100%; }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 9px; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; border: 1px solid var(--line); background: var(--panel-2); white-space: nowrap; }
.chip.r { border-color: currentColor; background: transparent; }
.seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: none; background: none; border-radius: 9px; padding: 9px 6px; font-weight: 700; color: var(--muted); }
.seg button.on { background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.chips-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips-scroll::-webkit-scrollbar { display: none; }
.fchip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--muted); }
.fchip.on { color: var(--ink); background: var(--text); border-color: var(--text); }

/* ---- hunt screen ---- */
.viewfinder { position: relative; aspect-ratio: 4 / 4.2; max-width: 100%; border-radius: 22px; overflow: hidden; background:
  radial-gradient(circle at 50% 45%, #1f3a3f 0%, #121022 55%, #0a0812 100%); border: 1px solid #2c4a52; isolation: isolate; }
.viewfinder::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(124,245,211,.05) 0 1px, transparent 1px 3px); pointer-events: none; z-index: 2; }
.vf-corner { position: absolute; width: 34px; height: 34px; border: 3px solid var(--ecto); z-index: 3; opacity: .85; }
.vf-corner.tl { top: 16px; left: 16px; border-right: 0; border-bottom: 0; border-radius: 8px 0 0 0; }
.vf-corner.tr { top: 16px; right: 16px; border-left: 0; border-bottom: 0; border-radius: 0 8px 0 0; }
.vf-corner.bl { bottom: 16px; left: 16px; border-right: 0; border-top: 0; border-radius: 0 0 0 8px; }
.vf-corner.br { bottom: 16px; right: 16px; border-left: 0; border-top: 0; border-radius: 0 0 8px 0; }
.vf-sweep { position: absolute; left: 0; right: 0; height: 40%; top: 0; background: linear-gradient(transparent, rgba(124,245,211,.12) 85%, rgba(124,245,211,.5)); z-index: 2; animation: sweep 3.8s linear infinite; pointer-events: none; will-change: transform; transform: translateY(-100%); }
/* transform (not top): runs on the compositor, so the sweep keeps moving while the CPU detector holds the main thread */
@keyframes sweep { from { transform: translateY(-100%); } to { transform: translateY(250%); } }
.vf-center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; z-index: 3; padding: 40px; }
.vf-center h1 { font-size: clamp(30px, 9vw, 44px); line-height: .95; color: var(--text); text-shadow: 0 0 18px rgba(124,245,211,.45); }
.vf-center h1 em { font-style: normal; color: var(--ecto); }
.vf-center p { margin: 10px auto 0; max-width: 26ch; color: #c9c0ea; }
.vf-hud { position: absolute; left: 22px; right: 22px; bottom: 22px; display: flex; justify-content: space-between; font: 600 11px var(--font-body); letter-spacing: .14em; color: var(--ecto); z-index: 3; opacity: .85; }
.vf-hud .rec::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--danger); margin-right: 6px; animation: blink 1.2s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.vf-ghost { position: absolute; z-index: 1; width: 120px; opacity: .08; filter: blur(1px) brightness(2); animation: drift 14s ease-in-out infinite alternate; }
@keyframes drift { from { transform: translate(-40px, 40px); } to { transform: translate(180px, 160px); } }
.viewfinder video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
.shutter-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; margin-top: -4px; }
.shutter { width: 96px; height: 96px; border-radius: 50%; border: 5px solid var(--text); background: radial-gradient(circle at 40% 35%, #fff3c4, var(--flash) 45%, #e59a1f); display: grid; place-items: center; cursor: pointer;
  box-shadow: 0 0 0 6px rgba(255,207,90,.15), 0 10px 30px rgba(255,170,40,.25); font: 700 15px var(--font-display); color: #2a1904; letter-spacing: .08em; position: relative; }
.shutter:active { transform: scale(.94); }
.shutter::after { content: ""; position: absolute; inset: -14px; border-radius: 50%; border: 2px solid rgba(255,207,90,.35); animation: pulse 2.2s ease-out infinite; }
@keyframes pulse { from { transform: scale(.85); opacity: 1; } to { transform: scale(1.15); opacity: 0; } }
.side-btn { justify-self: center; display: grid; justify-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); background: none; border: none; cursor: pointer; padding: 6px; }
.side-btn .ic { width: 48px; height: 48px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); display: grid; place-items: center; }
.side-btn svg { width: 22px; height: 22px; }
.quest { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.quest:first-of-type { border-top: 0; }
.quest h3 { font-size: 15px; } .quest p { margin: 0; font-size: 13px; color: var(--muted); grid-column: 1; }
.quest .bar { grid-column: 1 / -1; height: 7px; }
.quest .bar > i { background: var(--ecto); }
.warn { border-color: #6a2a3c; background: linear-gradient(90deg, #2c1424, var(--panel)); }
.sightings { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.sighting { flex: 0 0 auto; width: 76px; text-align: center; font-size: 11px; color: var(--muted); }
.sighting img { width: 64px; height: 64px; display: block; margin: 0 auto 2px; }

/* ---- tab bar ---- */
.tabs { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 520px; z-index: 6; display: grid; grid-template-columns: repeat(4, 1fr);
  background: rgba(17,13,27,.94); backdrop-filter: blur(10px); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabs button { height: var(--tabbar); border: none; background: none; display: grid; justify-items: center; align-content: center; gap: 3px; font-size: 11.5px; font-weight: 700; color: var(--muted); letter-spacing: .05em; position: relative; }
.tabs button svg { width: 24px; height: 24px; }
.tabs button.on { color: var(--ecto); }
.tabs button.on::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--ecto); }
.tabs .dot { position: absolute; top: 10px; right: calc(50% - 20px); width: 9px; height: 9px; border-radius: 50%; background: var(--flash); box-shadow: 0 0 0 2px var(--ink); }

/* ---- monster cards ---- */
.mgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.mcard { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 6px 9px; text-align: center; cursor: pointer; overflow: hidden; }
.mcard::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--rc) 28%, transparent), transparent 65%); pointer-events: none; }
.mcard.seen img { opacity: .55; filter: grayscale(.5); }
.swatch { display: inline-block; width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--line); vertical-align: middle; margin-right: 4px; }
.rdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; border: 1px solid; margin: 0 1px; }
.mcard img { width: 100%; max-width: 96px; aspect-ratio: 1; display: block; margin: 0 auto; position: relative; }
.mcard .nm { font-weight: 700; font-size: 12.5px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; position: relative; }
.mcard .sub { font-size: 11px; color: var(--muted); position: relative; }
.mcard.r-rare { border-color: color-mix(in srgb, var(--r-rare) 60%, var(--line)); }
.mcard.r-epic { border-color: color-mix(in srgb, var(--r-epic) 70%, var(--line)); box-shadow: 0 0 16px -6px var(--r-epic); }
.mcard.r-legendary { border-color: var(--r-legendary); box-shadow: 0 0 22px -6px var(--r-legendary); animation: legendGlow 2.4s ease-in-out infinite; }
@keyframes legendGlow { 50% { box-shadow: 0 0 30px -4px var(--r-legendary); } }
.mcard .badge { position: absolute; top: 6px; right: 6px; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 6px; background: var(--ecto); color: var(--ink); z-index: 1; }
.mcard .vbadge { position: absolute; top: 6px; left: 6px; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 6px; background: var(--violet); color: var(--ink); z-index: 1; }
.dex-row { display: grid; grid-template-columns: 92px repeat(5, minmax(0, 1fr)); gap: 6px; align-items: center; }
.dex-row .cat { font-size: 12px; font-weight: 600; line-height: 1.2; color: var(--muted); }
.dex-row .cat b { display: block; color: var(--text); font-size: 13px; }
.slot { aspect-ratio: 1; border-radius: 10px; background: #0d0a16; border: 1px solid var(--line); display: grid; place-items: center; position: relative; cursor: pointer; padding: 0; }
.slot img { width: 92%; }
.slot.locked { cursor: default; color: #3b3260; font: 700 16px var(--font-display); }
.slot::after { content: ""; position: absolute; bottom: 4px; left: 50%; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--rc); opacity: .9; }
.slot.caught { border-color: color-mix(in srgb, var(--rc) 70%, var(--line)); }

/* ---- sprite stage ---- */
.stage { position: relative; display: grid; place-items: center; }
.sprite { position: relative; display: grid; place-items: center; }
.sprite img { position: relative; z-index: 1; animation: idle 1.8s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes idle { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-4px) scale(1.02, .97); } }
.sprite.hover img { animation: floaty 2.6s ease-in-out infinite; }
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.sprite .aura { position: absolute; inset: -10%; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--rc) 55%, transparent) 0%, transparent 62%); animation: auraPulse 2s ease-in-out infinite; }
@keyframes auraPulse { 50% { transform: scale(1.12); opacity: .75; } }
.sprite .spark { position: absolute; width: 6px; height: 6px; background: var(--rc); z-index: 2; animation: sparkle 2.4s ease-in-out infinite; box-shadow: 0 0 8px var(--rc); }
@keyframes sparkle { 0%, 100% { opacity: 0; transform: translateY(10px) scale(.3); } 50% { opacity: 1; transform: translateY(-14px) scale(1); } }
.sprite.shiny img { filter: drop-shadow(0 0 6px #fff) saturate(1.3); }
.sprite.spectral img { opacity: .9; filter: drop-shadow(0 0 10px #9ff7ff); }
.shadow { width: 60%; height: 12px; border-radius: 50%; background: rgba(0,0,0,.45); margin-top: -10px; }

/* ---- overlays (scan, discovery, battle, results) ---- */
.overlay { position: fixed; inset: 0; z-index: 20; display: flex; justify-content: center; background: rgba(8,6,14,.86); backdrop-filter: blur(4px); animation: fadeIn .2s ease; }
@keyframes fadeIn { from { opacity: 0; } }
.overlay-inner { width: 100%; max-width: 520px; height: 100%; display: flex; flex-direction: column; overflow-y: auto;
  padding-top: max(14px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 14px; }
.overlay-inner > * { flex-shrink: 0; }
.battle .overlay-inner > .arena { flex-shrink: 1; }
.camera .overlay-inner.cam-inner { justify-content: center; }
.cam-frame { position: relative; width: 100%; max-width: 100%; aspect-ratio: 3 / 4; max-height: 64vh; margin: 0 auto; border-radius: 18px; overflow: hidden; background: #000; border: 1px solid #2c4a52; }
.cam-frame { touch-action: none; }
.cam-frame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; transform-origin: 50% 50%; }
.cam-frame .vf-corner, .cam-frame .vf-sweep { z-index: 2; }
.cam-status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ecto); font-weight: 600; z-index: 3; background: #000; }
.lore { font-style: italic; } .lore-epic { color: #d9b8ff; } .lore-legendary { color: #ffd98a; text-shadow: 0 0 12px rgba(255,190,59,.35); }
.guide-btn { font-weight: 800; font-size: 17px; color: var(--ecto); }
.guide-sec { border: 1px solid var(--line); border-radius: 14px; background: var(--panel2, #1a1430); }
.guide-sec > summary { padding: 12px 14px; font-weight: 700; cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
.guide-sec > summary::after { content: '▸'; color: var(--muted); } .guide-sec[open] > summary::after { content: '▾'; }
.guide-sec > summary::-webkit-details-marker { display: none; }
.guide-body { padding: 0 14px 12px; font-size: 14px; } .guide-body p { margin: 0 0 8px; } .guide-body ul { margin: 0 0 8px; padding-left: 18px; } .guide-body li { margin: 3px 0; }
.guide-table { overflow-x: auto; margin: 6px 0; } .guide-table table { border-collapse: collapse; width: 100%; font-size: 13px; }
.guide-table th, .guide-table td { border-bottom: 1px solid var(--line); padding: 5px 6px; text-align: left; vertical-align: top; }
.guide-cards { display: grid; gap: 8px; margin: 8px 0; } .guide-status { display: grid; grid-template-columns: 74px 1fr; gap: 8px; align-items: start; background: #0e0b18; border-radius: 10px; padding: 8px; }
.guide-status .st { justify-self: start; }
.shutter[disabled], .shutter.waiting { opacity: .45; filter: grayscale(.6); cursor: default; } .shutter[disabled]::after { animation: none; opacity: 0; }
.shutter .waking { font-size: 11px; letter-spacing: .1em; }
.test-banner { font: 700 11px var(--font-body); letter-spacing: .14em; color: #1b1206; background: repeating-linear-gradient(45deg, #ffcf5a 0 10px, #ffb13b 10px 20px); padding: 4px 10px; border-radius: 6px; margin: 0; }
.zoom-row { display: flex; align-items: center; gap: 8px; justify-content: center; }
.zoom-row input[type=range] { flex: 1; max-width: 240px; accent-color: var(--ecto); }
.zoom-row .num { min-width: 3.2em; text-align: right; color: var(--ecto); }
.cam-controls { display: flex; justify-content: center; padding-top: 6px; }
.shutter[disabled] { opacity: .45; }
.photo-frame { position: relative; border-radius: 18px; overflow: hidden; border: 1px solid #2c4a52; background: #000; aspect-ratio: 1; max-height: 42vh; max-width: 100%; margin: 0 auto; width: 100%; }
.photo-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-frame .vf-sweep { animation-duration: 1.2s; }
.scan-hud { position: absolute; inset: 0; z-index: 3; display: grid; align-content: end; padding: 14px; gap: 6px; font: 600 12px var(--font-body); letter-spacing: .12em; color: var(--ecto); text-shadow: 0 0 6px #000; }
.scan-hud .meter { display: grid; grid-template-columns: 64px 1fr 40px; gap: 8px; align-items: center; }
.scan-hud .meter i { display: block; height: 6px; background: rgba(124,245,211,.18); border-radius: 3px; overflow: hidden; }
.scan-hud .meter i b { display: block; height: 100%; background: var(--ecto); width: 0; transition: width .25s; }
.scanning .photo-frame img { animation: glitch .25s steps(2) infinite; }
@keyframes glitch { 50% { filter: hue-rotate(40deg) contrast(1.3) saturate(1.4); transform: translateX(1px); } }
.cat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cat-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 9px 4px; display: grid; justify-items: center; gap: 2px; font-size: 12px; font-weight: 600; line-height: 1.15; text-align: center; min-height: 66px; }

.search { width: 100%; border-radius: 12px; border: 1px solid var(--line); background: #0d0a16; padding: 12px 14px; font-size: 16px; }

.discovery { align-items: center; justify-content: center; text-align: center; overflow: hidden; }
.disc-rays { position: absolute; inset: -50%; background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--rc) 30%, transparent) 0deg 10deg, transparent 10deg 24deg); animation: spin 14s linear infinite; opacity: .55; mask: radial-gradient(circle, #000 10%, transparent 55%); -webkit-mask: radial-gradient(circle, #000 10%, transparent 55%); }
@keyframes spin { to { transform: rotate(360deg); } }
.disc-flash { position: fixed; inset: 0; background: #fff; z-index: 40; pointer-events: none; animation: flash .6s ease-out forwards; }
@keyframes flash { from { opacity: 1; } to { opacity: 0; } }
.disc-sprite img { animation: reveal 1.3s cubic-bezier(.2,.9,.2,1.2) both, idle 1.8s 1.3s ease-in-out infinite; }
@keyframes reveal { 0% { transform: scale(.2) translateY(40px); filter: brightness(0) drop-shadow(0 0 0 #fff); } 55% { transform: scale(1.1); filter: brightness(0) drop-shadow(0 0 12px #fff); } 100% { transform: scale(1); filter: none; } }
.rarity-banner { font: 700 13px var(--font-body); letter-spacing: .3em; padding: 6px 16px; border: 2px solid currentColor; border-radius: 8px; display: inline-block; animation: bannerIn .5s .9s both; }
@keyframes bannerIn { from { opacity: 0; transform: scale(1.8); } }
.disc-name { font-size: clamp(26px, 8vw, 36px); line-height: 1.05; animation: bannerIn .5s 1.1s both; }
.new-tag { display: inline-block; background: var(--flash); color: #1b1206; font: 700 12px var(--font-body); letter-spacing: .14em; padding: 4px 10px; border-radius: 6px; animation: bannerIn .4s 1.4s both, wobble 1.6s 1.8s ease-in-out infinite; }

.shake { animation: shake .45s ease; }
@keyframes shake { 20% { transform: translate(-6px, 3px); } 40% { transform: translate(5px, -4px); } 60% { transform: translate(-4px, 2px); } 80% { transform: translate(3px, -1px); } }

/* battle */
.battle .overlay-inner { padding-left: 0; padding-right: 0; gap: 0; overflow: hidden; }
.arena { position: relative; flex: 1; min-height: 300px; overflow: hidden; background: linear-gradient(180deg, color-mix(in srgb, var(--fc) 30%, #120d22) 0%, #120d22 58%, #1a1430 58.2%, #0e0b18 100%); }
.arena::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px); pointer-events: none; }
.plat { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.55), rgba(0,0,0,0)); }
.foe { position: absolute; right: 5%; top: 10%; width: 46%; }
.foe .plat { left: 5%; right: 5%; bottom: -4%; height: 18%; }
.foe img { width: 100%; }
.hero { position: absolute; left: 4%; bottom: 4%; width: 40%; }
.hero img.hunter { width: 100%; animation: idle 2s ease-in-out infinite; transform-origin: 50% 100%; }
.hero .plat { left: 0; right: 10%; bottom: -3%; height: 16%; }
.hero .comp { position: absolute; width: 38%; left: 62%; bottom: 2%; }
.hp-card { position: absolute; background: rgba(17,13,27,.88); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; display: grid; gap: 4px; z-index: 3; backdrop-filter: blur(4px); }
.hp-card.foe-card { left: 12px; top: 12px; width: 50%; }
.hp-card.hero-card { right: 12px; bottom: 14px; width: 50%; }
.hp-card .nm { font-weight: 700; font-size: 13.5px; line-height: 1.15; display: flex; gap: 6px; align-items: baseline; justify-content: space-between; }
.hp-card .nm span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hp-card .lv { font-size: 11px; color: var(--muted); white-space: nowrap; }
.hp-card .bar { height: 9px; }
.st-row { display: flex; gap: 4px; flex-wrap: wrap; min-height: 18px; }
.st { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 5px; letter-spacing: .05em; }
.st.poison { background: #4c2a6b; color: #d6a2ff; } .st.burn { background: #6b2a1a; color: #ffb27a; } .st.stun { background: #6b5a1a; color: #ffe55c; }
.st.defdown { background: #1a3a6b; color: #8fc4ff; } .st.atkup { background: #6b1a2a; color: #ff9aa8; } .st.defup { background: #1a5a4b; color: #7cf5d3; } .st.immune { background: #2a5a1a; color: #a6f07a; }
.battle-log { min-height: 58px; padding: 10px 16px; font-weight: 600; background: #0b0814; border-top: 2px solid var(--line); border-bottom: 2px solid var(--line); display: flex; align-items: center; font-size: 14.5px; }
.actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px max(16px, env(safe-area-inset-left, 0px)) 4px max(16px, env(safe-area-inset-right, 0px)); }
.act { min-height: 64px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; align-content: center; gap: 2px; font-weight: 700; font-size: 14px; padding: 6px 4px; }
.act small { font-weight: 500; font-size: 11px; color: var(--muted); }
.act.attack { background: #3a1c2a; border-color: #6b2a42; }
.act.special { background: #3a301a; border-color: #6b5a2a; }
.act.capture { background: #163330; border-color: #2a6b5e; }
.act:active { transform: scale(.96); }
.act[disabled] { opacity: .4; }
.busy .act { pointer-events: none; opacity: .55; }
.float { position: absolute; z-index: 8; font: 700 22px var(--font-display); pointer-events: none; text-shadow: 0 2px 0 #000, 0 0 6px #000; animation: floatUp 1s ease-out forwards; white-space: nowrap; }
.float.crit { font-size: 30px; color: var(--flash); }
@keyframes floatUp { 0% { transform: translate(-50%, 0) scale(.6); opacity: 0; } 15% { transform: translate(-50%, -8px) scale(1.15); opacity: 1; } 100% { transform: translate(-50%, -54px) scale(1); opacity: 0; } }
.hitflash { animation: hitflash .35s steps(2) 2; }
@keyframes hitflash { 50% { filter: brightness(3) saturate(0); } }
.lunge-r { animation: lungeR .3s ease; } @keyframes lungeR { 50% { transform: translate(18%, -10%); } }
.lunge-l { animation: lungeL .3s ease; } @keyframes lungeL { 50% { transform: translate(-16%, 14%) scale(1.05); } }
.fx { position: absolute; z-index: 7; pointer-events: none; }
.fx.slash { width: 46%; aspect-ratio: 1; border-radius: 50%; border: 6px solid transparent; border-top-color: #fff6d8; border-right-color: #e8d6a8; filter: drop-shadow(0 0 6px #fff); animation: slash .35s ease-out forwards; }
@keyframes slash { from { transform: rotate(-80deg) scale(.6); opacity: 1; } to { transform: rotate(60deg) scale(1.05); opacity: 0; } }
.fx.bullet { width: 26px; height: 6px; border-radius: 3px; background: #dffcff; box-shadow: 0 0 10px #7ff0ff, 0 0 20px #7ff0ff; animation: shoot .22s linear forwards; }
.fx.orb { width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle, #fff, #c48bff 45%, transparent 70%); box-shadow: 0 0 22px #c48bff; animation: shoot .45s ease-in forwards; }
.fx.hex { font: 700 34px var(--font-display); color: #8dff6a; text-shadow: 0 0 10px #8dff6a; animation: hexpop .4s ease-out forwards; }
@keyframes hexpop { from { transform: scale(2) rotate(-30deg); opacity: 0; } 40% { opacity: 1; } to { transform: scale(1) rotate(0); opacity: 0; } }
.fx.trap { width: 34px; height: 34px; border-radius: 8px; background: linear-gradient(#7cf5d3 50%, #1b1530 50%); border: 3px solid #0b0814; box-shadow: 0 0 14px #7cf5d3; }
@keyframes shoot { from { transform: translate(0, 0); } to { transform: translate(var(--dx), var(--dy)); } }
.fx.bolt { width: 60px; height: 70%; top: 0; background: linear-gradient(transparent, #fff8b0 30%, #ffe55c 70%, transparent); clip-path: polygon(45% 0, 70% 0, 52% 38%, 78% 38%, 30% 100%, 44% 52%, 20% 52%); filter: drop-shadow(0 0 10px #ffe55c); animation: boltA .35s steps(3) forwards; }
@keyframes boltA { 0%, 66% { opacity: 1; } 100% { opacity: 0; } }
.fx.impact { width: 70px; height: 70px; background: radial-gradient(circle, #fff 0 20%, rgba(255,100,120,.8) 30%, transparent 65%); border-radius: 50%; animation: impact .3s ease-out forwards; }
@keyframes impact { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
.arena-flash { position: absolute; inset: 0; z-index: 6; background: #fff; pointer-events: none; animation: flash .3s ease-out forwards; }
.wobble { animation: trapWobble .35s ease-in-out; }
@keyframes trapWobble { 25% { transform: rotate(-18deg); } 75% { transform: rotate(18deg); } }

/* results */
.result-title { font-size: 38px; text-align: center; line-height: 1; }
.rewards { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.reward { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-weight: 700; font-size: 13px; animation: popIn .35s both; }
@keyframes popIn { from { transform: scale(.6); opacity: 0; } }
.levelup { text-align: center; padding: 14px; border-radius: 14px; background: linear-gradient(135deg, #3a2a00, #1b1530); border: 1px solid var(--flash); color: var(--flash); }
.levelup h2 { font-size: 26px; }

/* sheets & toasts */
.sheet-wrap { position: fixed; inset: 0; z-index: 30; background: rgba(5,3,10,.7); display: flex; align-items: flex-end; justify-content: center; animation: fadeIn .18s; }
.sheet { width: 100%; max-width: 520px; max-height: 88%; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0;
  padding-block: 10px max(18px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  animation: sheetUp .25s cubic-bezier(.2,.9,.3,1); display: flex; flex-direction: column; gap: 12px; }
@keyframes sheetUp { from { transform: translateY(40%); } }
.sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 4px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sheet-head h2 { font-size: 22px; }
.stat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; }
.stat { display: grid; grid-template-columns: 38px 1fr 34px; gap: 8px; align-items: center; font-size: 12.5px; }
.stat b { color: var(--muted); letter-spacing: .05em; } .stat span:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.stat .bar { height: 7px; } .stat .bar > i { background: var(--violet); }
.ability { padding: 9px 11px; border-radius: 10px; background: #0d0a16; border: 1px solid var(--line); font-size: 13px; }
.ability b { display: block; font-size: 14px; }
.list-item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
.list-item h3 { font-size: 16px; } .list-item p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
.list-item.on { border-color: var(--ecto); box-shadow: inset 0 0 0 1px var(--ecto); }
.list-item.locked { opacity: .78; }
.item-ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: #0d0a16; border: 1px solid var(--line); flex: 0 0 auto; }
.item-ic img { width: 40px; }
.potion-ic { width: 18px; height: 22px; border-radius: 4px 4px 9px 9px; background: var(--pc); box-shadow: inset -4px -4px 0 rgba(0,0,0,.25), 0 0 10px color-mix(in srgb, var(--pc) 50%, transparent); position: relative; }
.potion-ic::before { content: ""; position: absolute; top: -6px; left: 5px; width: 8px; height: 6px; background: #c7b9a0; border-radius: 2px; }
.cmp { font-size: 12px; font-weight: 700; } .cmp.up { color: var(--good); } .cmp.down { color: var(--danger); }
.wstats { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.wstats b { color: var(--text); }
.mats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.mat { text-align: center; background: #0d0a16; border: 1px solid var(--line); border-radius: 12px; padding: 8px 4px; font-size: 11.5px; color: var(--muted); }
.mat b { display: block; font-size: 18px; color: var(--text); font-variant-numeric: tabular-nums; }
.mat i { display: block; width: 14px; height: 14px; margin: 0 auto 4px; transform: rotate(45deg); background: var(--mc); box-shadow: 0 0 8px var(--mc); }
.toasts { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 12px); width: min(92%, 480px); display: grid; gap: 8px; pointer-events: none; }
.toast { background: #241c3d; border: 1px solid var(--ecto); border-radius: 12px; padding: 10px 14px; font-weight: 600; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.5); animation: toastIn .3s ease both; }
.toast.gold { border-color: var(--flash); }
.toast.bad { border-color: var(--danger); }
@keyframes toastIn { from { transform: translateY(-16px); opacity: 0; } }
textarea.code { width: 100%; min-height: 86px; border-radius: 12px; border: 1px solid var(--line); background: #0d0a16; padding: 10px; font: 12px/1.4 ui-monospace, monospace; word-break: break-all; resize: vertical; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.toggle:first-child { border-top: 0; }
.toggle p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
.switch { width: 52px; height: 30px; border-radius: 15px; border: 1px solid var(--line); background: #0d0a16; position: relative; flex: 0 0 auto; padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
.switch.on { background: #163330; border-color: var(--ecto); } .switch.on::after { transform: translateX(22px); background: var(--ecto); }
.empty { text-align: center; padding: 26px 14px; color: var(--muted); }
.empty h3 { color: var(--text); font-size: 18px; margin-bottom: 4px; }
.notice { font-size: 12.5px; color: var(--muted); border-left: 3px solid var(--violet); padding: 4px 0 4px 10px; }
.lens-chip { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; font-weight: 600; }
.lens-chip > i { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
.lens-chip > i.pulse { animation: blink 1s steps(2) infinite; }
.lens-tag { display: inline-flex; align-items: center; gap: 8px; align-self: start; background: rgba(8,6,14,.7); padding: 6px 10px; border-radius: 8px; }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ecto); border-right-color: transparent; animation: spin .8s linear infinite; display: inline-block; }
.det-canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; z-index: 1; }
.ident { display: flex; gap: 12px; align-items: center; border-color: var(--ecto); }
.ident .e, .cand .e { font-size: 26px; }
.ident .bar { margin-top: 6px; height: 7px; } .ident .bar > i { background: var(--ecto); }
button.list-item { width: 100%; color: inherit; font: inherit; cursor: pointer; }
.list-item.cand { grid-template-columns: auto 1fr auto; }
.num-badge { width: 28px; height: 28px; border-radius: 8px; background: var(--ecto); color: #062019; display: grid; place-items: center; font-weight: 700; }
details.debug { text-align: left; background: #0b0814; border: 1px dashed #5b4a8f; border-radius: 12px; padding: 10px 12px; font-size: 12px; overflow-x: auto; }
details.debug summary { font-weight: 700; color: var(--violet); cursor: pointer; }
details.debug > div { margin-top: 6px; color: #cfc6ee; }
details.debug table { width: 100%; border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
details.debug th { text-align: left; color: var(--ecto); padding: 8px 0 2px; font-size: 11px; letter-spacing: .06em; }
details.debug td { padding: 2px 6px 2px 0; border-top: 1px solid #221a38; vertical-align: top; word-break: break-word; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; } }
@media (max-width: 360px) { .mgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .dex-row { grid-template-columns: 70px repeat(5, minmax(0, 1fr)); } .shutter { width: 84px; height: 84px; } }
</style>
