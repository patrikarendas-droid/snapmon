<title>SNAPMON: Monsters Among Us</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#110d1b">
<meta name="description" content="Photograph real objects to reveal the monsters hiding inside them. Fight, capture and collect.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Chakra+Petch:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app — status bar, scrolling screen, fixed thumb-reach tab bar; battles and scans take over the screen. */
:root {
  --ink: #110d1b; --panel: #1b1530; --panel-2: #251d40; --line: #3a2f5e; --text: #f1ecff; --muted: #a79dc9;
  --ecto: #7cf5d3; --flash: #ffcf5a; --danger: #ff5d73; --good: #62d87a; --violet: #a68bff;
  --r-common: #a9b4c6; --r-uncommon: #62d87a; --r-rare: #4fb0ff; --r-epic: #c977ff; --r-legendary: #ffbe3b;
  --font-display: 'Pixelify Sans', 'Courier New', monospace;
  --font-body: 'Chakra Petch', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --tabbar: 64px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--text); font: 15px/1.45 var(--font-body); overscroll-behavior: none; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ecto); outline-offset: 2px; }
img.px, canvas.px { image-rendering: pixelated; image-rendering: crisp-edges; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: 0.02em; }
h3 { font-family: var(--font-body); letter-spacing: 0; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }

#app { max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; position: relative;
  background: radial-gradient(120% 60% at 50% -10%, #2a1f4d 0%, transparent 60%), var(--ink); }

/* ---- top status bar ---- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center;
  padding-block: 10px 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(var(--ink) 70%, transparent); }
.lvl-badge { width: 44px; height: 44px; border-radius: 12px; background: var(--panel-2); border: 2px solid var(--line); display: grid; place-items: center; font-family: var(--font-body); font-weight: 700; line-height: 1; text-align: center; }
.lvl-badge b { font-size: 18px; display: block; } .lvl-badge span { font-size: 9px; color: var(--muted); letter-spacing: .12em; }
.bars { display: grid; gap: 5px; min-width: 0; }
.bar { height: 10px; border-radius: 6px; background: #0b0814; border: 1px solid var(--line); overflow: hidden; position: relative; }
.bar > i { position: absolute; inset: 0 auto 0 0; border-radius: 5px; transition: width .35s ease; }
.bar.hp > i { background: linear-gradient(90deg, #ff5d73, #ff9a6b); }
.bar.hp.ok > i { background: linear-gradient(90deg, #45d07a, #a6f07a); }
.bar.xp > i { background: linear-gradient(90deg, #7a5cff, #7cf5d3); }
.bar.en > i { background: linear-gradient(90deg, #ffb13b, #ffe55c); }
.bar-row { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); }
.bar-row .bar { flex: 1; }
.bar-row .lbl { width: 22px; font-weight: 700; letter-spacing: .06em; }
.bar-row .val { min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
.top-right { display: flex; gap: 6px; align-items: center; }
.wallet { display: grid; justify-items: end; font-size: 12px; line-height: 1.25; font-variant-numeric: tabular-nums; }
.wallet .c { color: var(--flash); font-weight: 700; } .wallet .r { color: var(--ecto); font-weight: 700; }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; padding: 0; }
.icon-btn svg { width: 20px; height: 20px; }

/* ---- screens ---- */
main#screen { flex: 1; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 4px calc(var(--tabbar) + 24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
.screen-enter { animation: screenIn .28s ease both; }
@keyframes screenIn { from { opacity: .3; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.section-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.section-title h2 { font-size: 20px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

.btn { border: none; border-radius: 12px; padding: 12px 16px; font-weight: 700; letter-spacing: .02em; background: var(--panel-2); border: 1px solid var(--line); min-height: 46px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .08s ease, filter .15s; user-select: none; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--flash); color: #1b1206; border-color: transparent; }
.btn.ecto { background: var(--ecto); color: #062019; border-color: transparent; }
.btn.danger { background: var(--danger); color: #22060c; border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 36px; padding: 7px 12px; font-size: 13px; border-radius: 10px; }
.btn[disabled], .btn.disabled { opacity: .42; pointer-events: none; }
.btn.block { width: 100%; }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 9px; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; border: 1px solid var(--line); background: var(--panel-2); white-space: nowrap; }
.chip.r { border-color: currentColor; background: transparent; }
.seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: none; background: none; border-radius: 9px; padding: 9px 6px; font-weight: 700; color: var(--muted); }
.seg button.on { background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.chips-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips-scroll::-webkit-scrollbar { display: none; }
.fchip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--muted); }
.fchip.on { color: var(--ink); background: var(--text); border-color: var(--text); }

/* ---- hunt screen ---- */
.viewfinder { position: relative; aspect-ratio: 4 / 4.2; max-width: 100%; border-radius: 22px; overflow: hidden; background:
  radial-gradient(circle at 50% 45%, #1f3a3f 0%, #121022 55%, #0a0812 100%); border: 1px solid #2c4a52; isolation: isolate; }
.viewfinder::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(124,245,211,.05) 0 1px, transparent 1px 3px); pointer-events: none; z-index: 2; }
.vf-corner { position: absolute; width: 34px; height: 34px; border: 3px solid var(--ecto); z-index: 3; opacity: .85; }
.vf-corner.tl { top: 16px; left: 16px; border-right: 0; border-bottom: 0; border-radius: 8px 0 0 0; }
.vf-corner.tr { top: 16px; right: 16px; border-left: 0; border-bottom: 0; border-radius: 0 8px 0 0; }
.vf-corner.bl { bottom: 16px; left: 16px; border-right: 0; border-top: 0; border-radius: 0 0 0 8px; }
.vf-corner.br { bottom: 16px; right: 16px; border-left: 0; border-top: 0; border-radius: 0 0 8px 0; }
.vf-sweep { position: absolute; left: 0; right: 0; height: 40%; top: -40%; background: linear-gradient(transparent, rgba(124,245,211,.12) 85%, rgba(124,245,211,.5)); z-index: 2; animation: sweep 3.8s linear infinite; pointer-events: none; }
@keyframes sweep { to { top: 100%; } }
.vf-center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; z-index: 3; padding: 40px; }
.vf-center h1 { font-size: clamp(30px, 9vw, 44px); line-height: .95; color: var(--text); text-shadow: 0 0 18px rgba(124,245,211,.45); }
.vf-center h1 em { font-style: normal; color: var(--ecto); }
.vf-center p { margin: 10px auto 0; max-width: 26ch; color: #c9c0ea; }
.vf-hud { position: absolute; left: 22px; right: 22px; bottom: 22px; display: flex; justify-content: space-between; font: 600 11px var(--font-body); letter-spacing: .14em; color: var(--ecto); z-index: 3; opacity: .85; }
.vf-hud .rec::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--danger); margin-right: 6px; animation: blink 1.2s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.vf-ghost { position: absolute; z-index: 1; width: 120px; opacity: .08; filter: blur(1px) brightness(2); animation: drift 14s ease-in-out infinite alternate; }
@keyframes drift { from { transform: translate(-40px, 40px); } to { transform: translate(180px, 160px); } }
.viewfinder video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
.shutter-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; margin-top: -4px; }
.shutter { width: 96px; height: 96px; border-radius: 50%; border: 5px solid var(--text); background: radial-gradient(circle at 40% 35%, #fff3c4, var(--flash) 45%, #e59a1f); display: grid; place-items: center; cursor: pointer;
  box-shadow: 0 0 0 6px rgba(255,207,90,.15), 0 10px 30px rgba(255,170,40,.25); font: 700 15px var(--font-display); color: #2a1904; letter-spacing: .08em; position: relative; }
.shutter:active { transform: scale(.94); }
.shutter::after { content: ""; position: absolute; inset: -14px; border-radius: 50%; border: 2px solid rgba(255,207,90,.35); animation: pulse 2.2s ease-out infinite; }
@keyframes pulse { from { transform: scale(.85); opacity: 1; } to { transform: scale(1.15); opacity: 0; } }
.side-btn { justify-self: center; display: grid; justify-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); background: none; border: none; cursor: pointer; padding: 6px; }
.side-btn .ic { width: 48px; height: 48px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); display: grid; place-items: center; }
.side-btn svg { width: 22px; height: 22px; }
.quest { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.quest:first-of-type { border-top: 0; }
.quest h3 { font-size: 15px; } .quest p { margin: 0; font-size: 13px; color: var(--muted); grid-column: 1; }
.quest .bar { grid-column: 1 / -1; height: 7px; }
.quest .bar > i { background: var(--ecto); }
.warn { border-color: #6a2a3c; background: linear-gradient(90deg, #2c1424, var(--panel)); }
.sightings { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.sighting { flex: 0 0 auto; width: 76px; text-align: center; font-size: 11px; color: var(--muted); }
.sighting img { width: 64px; height: 64px; display: block; margin: 0 auto 2px; }

/* ---- tab bar ---- */
.tabs { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 520px; z-index: 6; display: grid; grid-template-columns: repeat(4, 1fr);
  background: rgba(17,13,27,.94); backdrop-filter: blur(10px); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabs button { height: var(--tabbar); border: none; background: none; display: grid; justify-items: center; align-content: center; gap: 3px; font-size: 11.5px; font-weight: 700; color: var(--muted); letter-spacing: .05em; position: relative; }
.tabs button svg { width: 24px; height: 24px; }
.tabs button.on { color: var(--ecto); }
.tabs button.on::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--ecto); }
.tabs .dot { position: absolute; top: 10px; right: calc(50% - 20px); width: 9px; height: 9px; border-radius: 50%; background: var(--flash); box-shadow: 0 0 0 2px var(--ink); }

/* ---- monster cards ---- */
.mgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.mcard { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 6px 9px; text-align: center; cursor: pointer; overflow: hidden; }
.mcard::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--rc) 28%, transparent), transparent 65%); pointer-events: none; }
.mcard.seen img { opacity: .55; filter: grayscale(.5); }
.rdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; border: 1px solid; margin: 0 1px; }
.mcard img { width: 100%; max-width: 96px; aspect-ratio: 1; display: block; margin: 0 auto; position: relative; }
.mcard .nm { font-weight: 700; font-size: 12.5px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; position: relative; }
.mcard .sub { font-size: 11px; color: var(--muted); position: relative; }
.mcard.r-rare { border-color: color-mix(in srgb, var(--r-rare) 60%, var(--line)); }
.mcard.r-epic { border-color: color-mix(in srgb, var(--r-epic) 70%, var(--line)); box-shadow: 0 0 16px -6px var(--r-epic); }
.mcard.r-legendary { border-color: var(--r-legendary); box-shadow: 0 0 22px -6px var(--r-legendary); animation: legendGlow 2.4s ease-in-out infinite; }
@keyframes legendGlow { 50% { box-shadow: 0 0 30px -4px var(--r-legendary); } }
.mcard .badge { position: absolute; top: 6px; right: 6px; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 6px; background: var(--ecto); color: var(--ink); z-index: 1; }
.mcard .vbadge { position: absolute; top: 6px; left: 6px; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 6px; background: var(--violet); color: var(--ink); z-index: 1; }
.dex-row { display: grid; grid-template-columns: 92px repeat(5, minmax(0, 1fr)); gap: 6px; align-items: center; }
.dex-row .cat { font-size: 12px; font-weight: 600; line-height: 1.2; color: var(--muted); }
.dex-row .cat b { display: block; color: var(--text); font-size: 13px; }
.slot { aspect-ratio: 1; border-radius: 10px; background: #0d0a16; border: 1px solid var(--line); display: grid; place-items: center; position: relative; cursor: pointer; padding: 0; }
.slot img { width: 92%; }
.slot.locked { cursor: default; color: #3b3260; font: 700 16px var(--font-display); }
.slot::after { content: ""; position: absolute; bottom: 4px; left: 50%; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--rc); opacity: .9; }
.slot.caught { border-color: color-mix(in srgb, var(--rc) 70%, var(--line)); }

/* ---- sprite stage ---- */
.stage { position: relative; display: grid; place-items: center; }
.sprite { position: relative; display: grid; place-items: center; }
.sprite img { position: relative; z-index: 1; animation: idle 1.8s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes idle { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-4px) scale(1.02, .97); } }
.sprite.hover img { animation: floaty 2.6s ease-in-out infinite; }
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.sprite .aura { position: absolute; inset: -10%; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--rc) 55%, transparent) 0%, transparent 62%); animation: auraPulse 2s ease-in-out infinite; }
@keyframes auraPulse { 50% { transform: scale(1.12); opacity: .75; } }
.sprite .spark { position: absolute; width: 6px; height: 6px; background: var(--rc); z-index: 2; animation: sparkle 2.4s ease-in-out infinite; box-shadow: 0 0 8px var(--rc); }
@keyframes sparkle { 0%, 100% { opacity: 0; transform: translateY(10px) scale(.3); } 50% { opacity: 1; transform: translateY(-14px) scale(1); } }
.sprite.shiny img { filter: drop-shadow(0 0 6px #fff) saturate(1.3); }
.sprite.spectral img { opacity: .9; filter: drop-shadow(0 0 10px #9ff7ff); }
.shadow { width: 60%; height: 12px; border-radius: 50%; background: rgba(0,0,0,.45); margin-top: -10px; }

/* ---- overlays (scan, discovery, battle, results) ---- */
.overlay { position: fixed; inset: 0; z-index: 20; display: flex; justify-content: center; background: rgba(8,6,14,.86); backdrop-filter: blur(4px); animation: fadeIn .2s ease; }
@keyframes fadeIn { from { opacity: 0; } }
.overlay-inner { width: 100%; max-width: 520px; height: 100%; display: flex; flex-direction: column; overflow-y: auto;
  padding-top: max(14px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 14px; }
.overlay-inner > * { flex-shrink: 0; }
.battle .overlay-inner > .arena { flex-shrink: 1; }
.camera .overlay-inner.cam-inner { justify-content: center; }
.cam-frame { position: relative; width: 100%; max-width: 100%; aspect-ratio: 3 / 4; max-height: 64vh; margin: 0 auto; border-radius: 18px; overflow: hidden; background: #000; border: 1px solid #2c4a52; }
.cam-frame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cam-frame .vf-corner, .cam-frame .vf-sweep { z-index: 2; }
.cam-status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ecto); font-weight: 600; z-index: 3; }
.cam-controls { display: flex; justify-content: center; padding-top: 6px; }
.shutter[disabled] { opacity: .45; }
.photo-frame { position: relative; border-radius: 18px; overflow: hidden; border: 1px solid #2c4a52; background: #000; aspect-ratio: 1; max-height: 42vh; max-width: 100%; margin: 0 auto; width: 100%; }
.photo-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-frame .vf-sweep { animation-duration: 1.2s; }
.scan-hud { position: absolute; inset: 0; z-index: 3; display: grid; align-content: end; padding: 14px; gap: 6px; font: 600 12px var(--font-body); letter-spacing: .12em; color: var(--ecto); text-shadow: 0 0 6px #000; }
.scan-hud .meter { display: grid; grid-template-columns: 64px 1fr 40px; gap: 8px; align-items: center; }
.scan-hud .meter i { display: block; height: 6px; background: rgba(124,245,211,.18); border-radius: 3px; overflow: hidden; }
.scan-hud .meter i b { display: block; height: 100%; background: var(--ecto); width: 0; transition: width .25s; }
.scanning .photo-frame img { animation: glitch .25s steps(2) infinite; }
@keyframes glitch { 50% { filter: hue-rotate(40deg) contrast(1.3) saturate(1.4); transform: translateX(1px); } }
.cat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cat-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 9px 4px; display: grid; justify-items: center; gap: 2px; font-size: 12px; font-weight: 600; line-height: 1.15; text-align: center; min-height: 66px; }
.cat-btn .e { font-size: 22px; line-height: 1.1; }
.cat-btn.sel, .cat-btn:active { border-color: var(--ecto); background: #163330; }
.cat-btn.hint { border-color: var(--flash); }
.search { width: 100%; border-radius: 12px; border: 1px solid var(--line); background: #0d0a16; padding: 12px 14px; font-size: 16px; }
.ai-box { border: 1px dashed #5b4a8f; border-radius: 12px; padding: 10px 12px; font-size: 13px; color: #cfc6ee; }
.ai-box button { margin: 6px 6px 0 0; }

.discovery { align-items: center; justify-content: center; text-align: center; overflow: hidden; }
.disc-rays { position: absolute; inset: -50%; background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--rc) 30%, transparent) 0deg 10deg, transparent 10deg 24deg); animation: spin 14s linear infinite; opacity: .55; mask: radial-gradient(circle, #000 10%, transparent 55%); -webkit-mask: radial-gradient(circle, #000 10%, transparent 55%); }
@keyframes spin { to { transform: rotate(360deg); } }
.disc-flash { position: fixed; inset: 0; background: #fff; z-index: 40; pointer-events: none; animation: flash .6s ease-out forwards; }
@keyframes flash { from { opacity: 1; } to { opacity: 0; } }
.disc-sprite img { animation: reveal 1.3s cubic-bezier(.2,.9,.2,1.2) both, idle 1.8s 1.3s ease-in-out infinite; }
@keyframes reveal { 0% { transform: scale(.2) translateY(40px); filter: brightness(0) drop-shadow(0 0 0 #fff); } 55% { transform: scale(1.1); filter: brightness(0) drop-shadow(0 0 12px #fff); } 100% { transform: scale(1); filter: none; } }
.rarity-banner { font: 700 13px var(--font-body); letter-spacing: .3em; padding: 6px 16px; border: 2px solid currentColor; border-radius: 8px; display: inline-block; animation: bannerIn .5s .9s both; }
@keyframes bannerIn { from { opacity: 0; transform: scale(1.8); } }
.disc-name { font-size: clamp(26px, 8vw, 36px); line-height: 1.05; animation: bannerIn .5s 1.1s both; }
.new-tag { display: inline-block; background: var(--flash); color: #1b1206; font: 700 12px var(--font-body); letter-spacing: .14em; padding: 4px 10px; border-radius: 6px; animation: bannerIn .4s 1.4s both, wobble 1.6s 1.8s ease-in-out infinite; }
@keyframes wobble { 50% { transform: rotate(-4deg) scale(1.05); } }
.shake { animation: shake .45s ease; }
@keyframes shake { 20% { transform: translate(-6px, 3px); } 40% { transform: translate(5px, -4px); } 60% { transform: translate(-4px, 2px); } 80% { transform: translate(3px, -1px); } }

/* battle */
.battle .overlay-inner { padding-left: 0; padding-right: 0; gap: 0; overflow: hidden; }

<script>window.__SNAPMON_CLIP_WORKER = "/* SNAPMON — experimental Spirit Lens worker (CLIP-style image encoder via ONNX Runtime Web).\n   Runs off the main thread. Receives preprocessed 224×224 crops, returns vocabulary scores.\n   Text embeddings for the whole vocabulary are precomputed offline (lab/export_clip.py), so phones\n   only download the image encoder. Messages: {type:'init', base, ortBase, preferGPU} → {type:'ready'}\n                                             {type:'run', id, crops:Float32Array, n} → {type:'result', id, top} */\n'use strict';\nlet session = null, vocab = null, meta = null, dim = 0, nLabels = 0, backend = '';\n\nasync function cachedFetch(url) {\n  // Cache API keeps the model on the phone after the first download (falls back to a normal fetch)\n  try {\n    const c = await caches.open('snapmon-models-v1');\n    const hit = await c.match(url);\n    if (hit) return hit;\n    const r = await fetch(url);\n    if (!r.ok) throw new Error(r.status + ' ' + url);\n    try { await c.put(url, r.clone()); } catch (e) {}\n    return r;\n  } catch (e) {\n    const r = await fetch(url);\n    if (!r.ok) throw new Error('download failed (' + r.status + ') ' + url.split('/').pop());\n    return r;\n  }\n}\nfunction f16ToF32(u16) {\n  const out = new Float32Array(u16.length);\n  for (let i = 0; i < u16.length; i++) {\n    const h = u16[i], s = (h & 0x8000) ? -1 : 1, e = (h >> 10) & 0x1f, f = h & 0x3ff;\n    out[i] = e === 0 ? s * Math.pow(2, -14) * (f / 1024) : e === 31 ? (f ? NaN : s * Infinity) : s * Math.pow(2, e - 15) * (1 + f / 1024);\n  }\n  return out;\n}\n\nasync function init({ base, ortBase, preferGPU }) {\n  const t0 = performance.now();\n  let useGPU = false;\n  if (preferGPU && typeof navigator !== 'undefined' && navigator.gpu) { try { useGPU = !!(await navigator.gpu.requestAdapter()); } catch (e) { useGPU = false; } }\n  importScripts(ortBase + (useGPU ? 'ort.webgpu.min.js' : 'ort.min.js'));\n  ort.env.wasm.wasmPaths = ortBase;\n  ort.env.wasm.numThreads = self.crossOriginIsolated ? Math.min(4, navigator.hardwareConcurrency || 2) : 1;\n  meta = await (await cachedFetch(base + 'vocab.json')).json();\n  const [modelBuf, vocBuf] = await Promise.all([\n    cachedFetch(base + meta.model).then(r => r.arrayBuffer()),\n    cachedFetch(base + 'vocab.bin').then(r => r.arrayBuffer()),\n  ]);\n  dim = meta.dim; nLabels = meta.labels.length;\n  vocab = f16ToF32(new Uint16Array(vocBuf));\n  const providers = useGPU ? ['webgpu', 'wasm'] : ['wasm'];\n  session = await ort.InferenceSession.create(new Uint8Array(modelBuf), { executionProviders: providers, graphOptimizationLevel: 'all' });\n  backend = useGPU ? 'webgpu' : 'wasm';\n  // warm-up so the first real photo is not slowed down by kernel compilation\n  const s = meta.image.size;\n  await session.run({ [session.inputNames[0]]: new ort.Tensor('float32', new Float32Array(3 * s * s), [1, 3, s, s]) });\n  return { backend, loadMs: Math.round(performance.now() - t0), labels: nLabels, dim, modelBytes: modelBuf.byteLength, vocabBytes: vocBuf.byteLength, name: meta.name };\n}\n\nasync function run({ crops, n, k = 8 }) {\n  const t0 = performance.now(), s = meta.image.size;\n  const out = await session.run({ [session.inputNames[0]]: new ort.Tensor('float32', crops, [n, 3, s, s]) });\n  const emb = out[session.outputNames[0]].data;\n  const scale = meta.scale, top = [];\n  for (let c = 0; c < n; c++) {\n    let norm = 0; for (let d = 0; d < dim; d++) norm += emb[c * dim + d] ** 2; norm = Math.sqrt(norm) || 1;\n    const cos = new Float32Array(nLabels);\n    let mx = -1e9;\n    for (let l = 0; l < nLabels; l++) { let dot = 0; const o = l * dim; for (let d = 0; d < dim; d++) dot += emb[c * dim + d] * vocab[o + d]; cos[l] = dot / norm; if (cos[l] > mx) mx = cos[l]; }\n    // softmax over the whole vocabulary (temperature = model's logit scale); summed per object later\n    let sum = 0; const p = new Float32Array(nLabels);\n    for (let l = 0; l < nLabels; l++) { p[l] = Math.exp(scale * (cos[l] - mx)); sum += p[l]; }\n    const idx = Array.from({ length: nLabels }, (_, i) => i).sort((a, b) => p[b] - p[a]).slice(0, k);\n    top.push(idx.map(i => ({ i, p: p[i] / sum, cos: +cos[i].toFixed(4) })));\n  }\n  return { top, ms: Math.round(performance.now() - t0) };\n}\n\nself.onmessage = async ev => {\n  const m = ev.data;\n  try {\n    if (m.type === 'init') self.postMessage({ type: 'ready', info: await init(m) });\n    else if (m.type === 'run') self.postMessage({ type: 'result', id: m.id, ...(await run(m)) });\n  } catch (e) { self.postMessage({ type: 'error', id: m.id, error: String(e && e.message || e) }); }\n};\n";</script>

/* SNAPMON — procedural pixel-art monster sprites.

'use strict';

/* ---------- seeded randomness ---------- */
function hashStr(str) {

    h2 = Math.imul(h2 ^ ch, 1597334677);

}

    a = (a + 0x6d2b79f5) >>> 0;

    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

  r.int = (lo, hi) => lo + Math.floor(r() * (hi - lo + 1));
  r.pick = arr => arr[Math.floor(r() * arr.length)];

/* ---------- palette indices ---------- */
const P = {

     'dedicated' – a bespoke builder for this exact object (PARTS.D or an original v1/v2 sprite)

/* SNAPMON — platform layer. Everything that touches the device lives behind these small interfaces so a future
   native Android build (e.g. Capacitor + Android WebView) can replace the browser implementations without touching
   game logic, UI or AI code. See docs/ANDROID.md.

   Platform.camera  : open(video) / capture(video) → canvas / close(video) / isOpen() / supported() / describe(error)
   Platform.storage : get(key) / set(key, value) / remove(key)   (synchronous; returns false when storage is blocked)

'use strict';

const Platform = (() => {
  /* ---------- camera: live rear camera only (no gallery / file upload) ---------- */
  let stream = null;
  const camera = {
    supported: () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia),
    secure: () => window.isSecureContext !== false,
    async open(video, { timeoutMs = 12000 } = {}) {
      if (!camera.secure()) throw Object.assign(new Error('insecure'), { kind: 'insecure' });
      if (!camera.supported()) throw Object.assign(new Error('unsupported'), { kind: 'unsupported' });
      const want = { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false };
      const start = c => Promise.race([navigator.mediaDevices.getUserMedia(c), new Promise((_, rej) => setTimeout(() => rej(Object.assign(new Error('timeout'), { name: 'TimeoutError' })), timeoutMs))]);
      try { stream = await start(want); }
      catch (e) {

        else throw e;

    },
    capture(video, maxSide = 1280) {

      const c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
      c.getContext('2d').drawImage(video, 0, 0, c.width, c.height);
      return c; // stays in memory only
    },
    close(video) {
      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = null; if (video) { video.pause && video.pause(); video.srcObject = null; }
    },
    isOpen: () => !!stream,
    // map browser errors to player-facing explanations
    describe(e) {
      const kind = e && (e.kind || ({ NotAllowedError: 'denied', SecurityError: 'denied', NotFoundError: 'none', OverconstrainedError: 'none', NotReadableError: 'busy', AbortError: 'busy', TimeoutError: 'timeout' })[e.name]) || 'unknown';
      const text = {
        denied: ['Camera permission is off', 'SNAPMON needs the camera to find monsters. Allow camera access for this site (tap the lock icon next to the address, then Permissions → Camera), then try again.'],
        none: ['No camera found', 'This device does not seem to have a usable camera.'],
        busy: ['Camera is busy', 'Another app is using the camera. Close it and try again.'],
        timeout: ['Camera did not start', 'The camera took too long to start. Try again.'],
        insecure: ['Camera needs a secure page', 'Open SNAPMON from its https:// address to use the camera.'],
        unsupported: ['Camera not supported here', 'This browser cannot open a live camera. Use a recent version of Chrome on Android.'],
        unknown: ['Camera problem', 'The camera could not be opened. Try again.'],
      }[kind];
      return { kind, title: text[0], text: text[1] };
    },
  };

  /* ---------- storage ---------- */
  const storage = {
    get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
    set(key, value) { try { localStorage.setItem(key, value); return true; } catch (e) { return false; } },
    remove(key) { try { localStorage.removeItem(key); return true; } catch (e) { return false; } },
  };

  /* ---------- device capabilities ---------- */
  const device = {
    online: () => navigator.onLine !== false,
    webgl() { try { const c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); } catch (e) { return false; } },
    webgpu: () => !!navigator.gpu,
    wasm: () => typeof WebAssembly === 'object',
  };

  return { name: 'web', camera, storage, device };
})();

    weapons: { sword: 0 }, equipped: 'sword', charms: {}, charmSlots: [null, null],
    research: {}, monsters: [], dex: {}, companion: null,
    questsClaimed: {}, achievements: {},
    stats: { photos: 0, encounters: 0, wins: 0, losses: 0, captures: 0, flees: 0, capByFam: {}, famSeen: {}, catsPhotographed: {}, objsPhotographed: {},

    enc: { miss: 0, sinceRare: 0, recentHashes: [], recentCats: [], recentObjs: [] },

    }

    if (st.classifier) {
      // whole photo (centre 90% square)
      const t = performance.now();
      const W = img.width, H = img.height, side = Math.min(W, H) * 0.9;
      const preds = await st.classifier.classify(crop(img, (W - side) / 2, (H - side) / 2, side, side), 5);

    const byCat = new Map();

      const prev = byCat.get(c.cat);
      if (!prev) { byCat.set(c.cat, { ...c }); continue; }
      const best = (c.box && !prev.box) || c.conf > prev.conf ? { ...c } : { ...prev };

    const valid = ranked.filter(c => c.conf >= CFG.MIN_CONF).slice(0, CFG.MAX_CHOICES);
    const people = dets.filter(d => d.class === 'person' && d.score > 0.6).length;
    const fullTop = dbg.full[0];
    let decision, reason;
    if (!valid.length) {
      decision = 'unknown';
      reason = people && !objects.length ? 'person' : fullTop && fullTop.map === 'excluded' && fullTop.prob > 0.3 ? 'scene' : 'low';
    } else if (valid.filter(c => c.box && c.src !== 'photo').length >= 2) { decision = 'choose'; reason = 'multiple'; }
    else if (valid[0].conf >= CFG.AUTO_CONF && (!valid[1] || valid[1].conf < valid[0].conf * CFG.CLEAR_MARGIN)) { decision = 'auto'; reason = 'confident'; }
    else { decision = 'choose'; reason = 'unsure'; }

    T.lensLoad = st.loadMs; dbg.times = T; dbg.decision = decision; dbg.reason = reason; dbg.candidates = ranked.map(c => ({ label: c.label, obj: c.obj, cat: c.cat, conf: c.conf, src: c.src }));
    dbg.thresholds = { min: CFG.MIN_CONF, auto: CFG.AUTO_CONF, detMin: CFG.DET_MIN };
    // boxes: every usable detection (normalised), so the experimental lens can classify exactly the same crops
    const boxes = objects.map(d => ({ cls: d.class, score: d.score, box: [d.bbox[0] / img.width, d.bbox[1] / img.height, d.bbox[2] / img.width, d.bbox[3] / img.height] }));
    return { decision, reason, candidates: valid, image: img, debug: dbg, boxes, people };
  }
  function fmtMap(m) { return m === 'excluded' ? 'excluded' : m ? m.obj : '?'; }

  async function clearCache() {
    for (const k of Object.values(CFG.cacheKeys)) { try { await tf.io.removeModel(k); } catch (e) {} }
  }

  return { load, recognize, clearCache, status: st, onChange: f => { listeners.add(f); return () => listeners.delete(f); }, CFG };
})();

<script>
/* SNAPMON — EXPERIMENTAL Spirit Lens: CLIP-style zero-shot recognition over a large everyday-object vocabulary.
   Developer-only (Settings → Developer). Never downloaded for normal players.
   Pipeline: production COCO-SSD boxes (if any) + the whole photo → 224 px crops → image encoder in a worker →
   cosine similarity against precomputed text embeddings → per-object probabilities → rejection rules.
   CLIP similarities are NOT probabilities: the shown "calibrated confidence" comes from a reliability table measured
   on a labelled benchmark (lab/), and is absent when no calibration is available. */
'use strict';

const ClipLens = (() => {
  const CFG = {
    variant: 'tinyclip-39m16',
    base: 'models/clip/',
    ortBase: 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/',
    localOrt: 'vendor/ort/',
    workerPath: 'src/workers/clip-worker.js',
    // fallback thresholds; replaced by the benchmark's calibration in vocab.json when present
    accept: { p: 0.35, margin: 0.12 },
    MAX_CROPS: 4,
    TIMEOUT_MS: 30000,
  };
  const st = { state: 'off', error: '', info: null, worker: null, seq: 0, pending: new Map(), meta: null, busy: false };

  function workerURL() {
    if (window.__SNAPMON_CLIP_WORKER) return URL.createObjectURL(new Blob([window.__SNAPMON_CLIP_WORKER], { type: 'text/javascript' }));
    return new URL(CFG.workerPath, location.href).href;
  }
  async function exists(url) { try { const r = await fetch(url, { method: 'HEAD' }); return r.ok; } catch (e) { return false; } }

  async function load() {
    if (st.state === 'ready') return true;
    if (st.loading) return st.loading;
    st.loading = (async () => {
      st.state = 'loading'; st.error = '';
      try {
        const base = new URL(CFG.base + CFG.variant + '/', location.href).href;
        if (!(await exists(base + 'vocab.json'))) throw Object.assign(new Error('experimental model files are not deployed on this site'), { code: 'model-missing' });
        st.meta = await (await fetch(base + 'vocab.json')).json();
        const ortBase = (await exists(new URL(CFG.localOrt + 'ort.min.js', location.href).href)) ? new URL(CFG.localOrt, location.href).href : CFG.ortBase;
        st.worker = new Worker(workerURL());
        st.worker.onmessage = ev => {
          const m = ev.data, pend = st.pending.get(m.id != null ? m.id : 'init');
          if (!pend) return;
          st.pending.delete(m.id != null ? m.id : 'init'); clearTimeout(pend.timer);
          m.type === 'error' ? pend.reject(new Error(m.error)) : pend.resolve(m);
        };
        st.worker.onerror = e => { for (const p of st.pending.values()) p.reject(new Error('worker crashed: ' + (e.message || 'unknown'))); st.pending.clear(); };
        const ready = await call('init', { type: 'init', base, ortBase, preferGPU: true }, 180000);
        st.info = ready.info; st.state = 'ready';
      } catch (e) { st.state = 'failed'; st.error = String(e.message || e); if (st.worker) st.worker.terminate(); st.worker = null; }
      st.loading = null;
      return st.state === 'ready';
    })();

  }
  function call(id, msg, timeout = CFG.TIMEOUT_MS) {
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => { st.pending.delete(id); reject(Object.assign(new Error('recognition timed out'), { code: 'timeout' })); }, timeout);
      st.pending.set(id, { resolve, reject, timer });
      st.worker.postMessage(msg, msg.crops ? [msg.crops.buffer] : []);
    });
  }

  /* CLIP preprocessing: square crop (with padding) → 224×224 → RGB normalised with CLIP mean/std, CHW */
  function prep(src, box, size, mean, std) {
    const W = src.width, H = src.height;
    let x, y, w, h;
    if (box) { x = box[0] * W; y = box[1] * H; w = box[2] * W; h = box[3] * H; } else { x = 0; y = 0; w = W; h = H; }
    const side = Math.min(Math.max(w, h) * (box ? 1.15 : 1), Math.max(W, H));
    const sx = Math.max(0, Math.min(W - side, x + w / 2 - side / 2)), sy = Math.max(0, Math.min(H - side, y + h / 2 - side / 2));
    const c = document.createElement('canvas'); c.width = size; c.height = size;

    ctx.fillStyle = '#7f7f7f'; ctx.fillRect(0, 0, size, size);
    const sw = Math.min(side, W), sh = Math.min(side, H);
    ctx.drawImage(src, sx, sy, sw, sh, (size - size * sw / side) / 2, (size - size * sh / side) / 2, size * sw / side, size * sh / side);
    const d = ctx.getImageData(0, 0, size, size).data, out = new Float32Array(3 * size * size), n = size * size;
    for (let i = 0; i < n; i++) for (let ch = 0; ch < 3; ch++) out[ch * n + i] = (d[i * 4 + ch] / 255 - mean[ch]) / std[ch];
    return out;
  }

  // Aggregate label probabilities per object, apply rejection, attach calibrated confidence.
  function judge(top) {
    const labels = st.meta.labels, per = new Map();
    for (const t of top) { const L = labels[t.i]; const key = L.o || '__none'; const e = per.get(key) || { obj: L.o || null, label: L.l, p: 0, cos: t.cos }; e.p += t.p; if (t.cos > e.cos) { e.cos = t.cos; } per.set(key, e); }
    const ranked = [...per.values()].sort((a, b) => b.p - a.p);
    const best = ranked[0], second = ranked[1] || { p: 0 };
    const th = (st.meta.calib && st.meta.calib.accept) || CFG.accept;
    const margin = best.p - second.p;
    let accepted = !!best.obj && best.p >= th.p && margin >= th.margin, why = accepted ? 'accepted' : !best.obj ? 'background or person' : best.p < th.p ? 'low score' : 'ambiguous';
    if (accepted && st.meta.calib && st.meta.calib.minCos && best.cos < st.meta.calib.minCos) { accepted = false; why = 'weak match'; }
    return { best, ranked: ranked.slice(0, 5), margin, accepted, why, calibrated: calibrate(best.p) };
  }
  function calibrate(p) {
    const bins = st.meta && st.meta.calib && st.meta.calib.reliability;
    if (!bins) return null; // never invent a probability
    const b = bins.find(x => p >= x.lo && p < x.hi) || bins[bins.length - 1];
    return b && b.n >= 5 ? b.acc : null;
  }

  /* recognise: regions = production boxes (if any) + whole photo */
  async function recognize(img, prodRec) {
    if (st.state !== 'ready') throw new Error('experimental lens not ready');
    if (st.busy) throw Object.assign(new Error('a recognition is already running'), { code: 'busy' });
    st.busy = true;
    try {
      const t0 = performance.now(), m = st.meta, size = m.image.size;
      const regions = [{ box: null, cls: 'whole photo' }, ...((prodRec && prodRec.boxes) || []).slice(0, CFG.MAX_CROPS - 1)];
      const buf = new Float32Array(regions.length * 3 * size * size);
      regions.forEach((r, i) => buf.set(prep(img, r.box, size, m.image.mean, m.image.std), i * 3 * size * size));
      const res = await call(++st.seq, { type: 'run', id: st.seq, crops: buf, n: regions.length });
      const per = regions.map((r, i) => ({ ...r, ...judge(res.top[i]) }));
      return { regions: per, inferMs: res.ms, totalMs: Math.round(performance.now() - t0), backend: st.info.backend };
    } finally { st.busy = false; }
  }

  /* Hybrid decision: CLIP refines production results; production stays the fallback.
     Rules (documented in docs/RECOGNITION.md and tested in tests/clip-fusion.js):
       1. A region where CLIP is accepted AND agrees with the production object → that object (both models agree).
       2. CLIP accepted, production names the same category → CLIP's object (more specific: truck → forklift).
       3. CLIP accepted and trusted, production disagrees or found nothing → CLIP's object. "Trusted" = the calibrated
          confidence for its score bin, or (bins too sparse) the held-out precision of the calibrated thresholds, is ≥ 0.7.
          Without deployed calibration this rule never fires.
       4. Otherwise → the production candidate for that region (or nothing). */
  function trust(r) {
    if (r.calibrated != null) return r.calibrated;
    const h = st.meta && st.meta.calib && st.meta.calib.heldOut;
    return h && h.precision != null && h.accepted >= 10 ? h.precision : 0;
  }
  function fuse(prodRec, clipRes) {
    const out = [], cands = prodRec.candidates || [], claimed = new Map();
    // each production candidate belongs to one region: boxed regions claim theirs first, the whole photo takes what is
    // left (otherwise one detected clock was counted twice, as "wall clock" and "clock", in the third field test)
    const sameBox = (c, r) => c.box && Math.abs(c.box[0] - r.box[0]) < 0.02 && Math.abs(c.box[1] - r.box[1]) < 0.02;
    const regions = [...clipRes.regions].sort((a, b) => (a.box ? 0 : 1) - (b.box ? 0 : 1));
    for (const r of regions) {
      const free = cands.filter(c => !claimed.has(c));
      const prod = r.box ? free.find(c => sameBox(c, r)) : free.find(c => !c.box) || free[0];
      if (prod) claimed.set(prod, r);
      const c = r.best;
      let pick = null, rule = 4;
      if (r.accepted && prod && prod.obj === c.obj) { pick = { ...prod, label: c.label, obj: c.obj, conf: Math.max(prod.conf, r.calibrated || c.p) }; rule = 1; }
      else if (r.accepted && prod && OBJECTS[c.obj] && OBJECTS[c.obj].cat === prod.cat) { pick = { ...prod, label: c.label, obj: c.obj, conf: Math.max(prod.conf, r.calibrated || c.p) }; rule = 2; }
      else if (r.accepted && trust(r) >= 0.7) { pick = { label: c.label, obj: c.obj, cat: OBJECTS[c.obj].cat, conf: trust(r), box: r.box, src: 'clip' }; rule = 3; }
      else if (prod) pick = prod;
      if (pick && !out.some(o => o.obj === pick.obj)) out.push({ ...pick, rule });
    }
    // production's other ideas stay available as choices (rule 4), so fusing never removes a right answer
    for (const c of cands) if (!claimed.has(c) && !out.some(o => o.obj === c.obj)) out.push({ ...c, rule: 4 });
    return out.sort((a, b) => b.conf - a.conf);
  }

  /* Hybrid decision for one photo (developer "Hybrid" mode): fuse per region, then re-decide with the production
     lens's own thresholds (L = Lens.CFG). Then CLIP's best whole-photo object (score >= SECOND_P) is offered as a
     "second opinion" choice when:
       5.  production would identify the photo automatically but CLIP names a different object (not a near-synonym);
       5b. production is unsure (one object, low confidence) and CLIP's object is not among its ideas;
       6.  production found nothing (not a person) but CLIP has an object.
     Evidence from three phone field tests is in docs/RECOGNITION.md. The choices still come only from the two lenses:
     no typed input, and "none of these" leads to a retake. */
  const SECOND_P = 0.08;
  function hybridDecision(rec, clip, L) {
    const fused = fuse(rec, clip).filter(c => c.conf >= L.MIN_CONF).slice(0, L.MAX_CHOICES);
    let decision, reason;
    if (!fused.length) { decision = 'unknown'; reason = rec.reason === 'person' ? 'person' : 'low'; }
    else if (fused.filter(c => c.box).length >= 2) { decision = 'choose'; reason = 'multiple'; }
    else if (fused[0].conf >= L.AUTO_CONF && (!fused[1] || fused[1].conf < fused[0].conf * L.CLEAR_MARGIN)) { decision = 'auto'; reason = 'confident'; }
    else { decision = 'choose'; reason = 'unsure'; }

    // near-synonyms are not a disagreement: same category and CLIP rates production's object at least half as high
    // (wall clock 0.075 vs clock 0.118 = agree; coffeepot 0.104 vs electric kettle 0.267 = disagree; second field test)
    const backed = fused[0] && OBJECTS[fused[0].obj] && OBJECTS[alt.obj].cat === OBJECTS[fused[0].obj].cat &&
      (whole.ranked || []).some(x => x.obj === fused[0].obj && x.p >= alt.p * 0.5);
    const offer = (decision === 'auto' && !backed) || (decision === 'choose' && reason === 'unsure') || (decision === 'unknown' && reason !== 'person');
    if (!offer) return { candidates: fused, decision, reason };

    fused.push({ label: alt.label, obj: alt.obj, cat: OBJECTS[alt.obj].cat, conf: alt.p, box: null, src: 'clip', rule: decision === 'auto' ? 5 : decision === 'unknown' ? 6 : '5b' });
    return { candidates: fused, decision: 'choose', reason: decision === 'auto' ? 'disagree' : decision === 'unknown' ? 'second-opinion' : 'unsure' };
  }

  function reset() { if (st.worker) st.worker.terminate(); Object.assign(st, { state: 'off', error: '', info: null, worker: null, meta: null, busy: false, loading: null }); st.pending.clear(); }
  return { load, recognize, fuse, judge, hybridDecision, reset, status: st, CFG };
})();

function lensStatusLine() {

/* ---------- recognition flow: photo → Spirit Lens → (pick among detections) → encounter scan ----------
   There is no manual entry: only objects the lens actually recognised can be hunted. */
function beginIdentify(img, url) {
  const hash = Photo.analyze(img).hash; // whole-photo similarity fingerprint (repeat-photo detection)
  ui.pending = { img, url, hash, thumb: S.settings.keepPhotos ? Photo.thumbnail(img) : null, rec: null, t0: Date.now() };
  recognizeFlow();
}
function lensFrame(p, extra = '') {
  return `<div class="photo-frame" id="lensFrame"><img alt="Your photo" src="${p.url}">${extra}<i class="vf-corner tl"></i><i class="vf-corner tr"></i><i class="vf-corner bl"></i><i class="vf-corner br"></i></div>`;
}
function lensStatusText() {
  const L = Lens.status;
  if (L.state === 'loading') return `${esc(L.progress || 'Starting the Spirit Lens…')}${S.settings.lensCached ? '' : ' First time only: about 30 MB of AI models download and are then kept on this phone.'}`;
  if (L.state === 'ready') return 'Looking for objects… (runs on this phone)';
  return '';
}
const withTimeout = (promise, ms, code) => Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(Object.assign(new Error(code), { code })), ms))]);
async function recognizeFlow() {
  const p = ui.pending; if (!p) return;
  $('#overlay').innerHTML = `<div class="overlay scanning"><div class="overlay-inner" style="justify-content:center">
    <div class="sheet-head"><h2>Spirit Lens</h2><button class="btn small ghost" data-act="cancelPhoto">Cancel</button></div>
    ${lensFrame(p, '<i class="vf-sweep"></i><div class="scan-hud"><div class="lens-tag"><i class="spin"></i> ANALYSING <span id="lensClock">0.0s</span></div></div>')}
    <p class="muted" style="text-align:center" id="lensStatus">${lensStatusText()}</p></div></div>`;
  const clock = setInterval(() => { const el = $('#lensClock'); if (!el || ui.pending !== p) return clearInterval(clock); el.textContent = ((Date.now() - p.t0) / 1000).toFixed(1) + 's'; }, 100);
  const fail = kind => { clearInterval(clock); if (ui.pending === p) showLensFailed(p, kind); };
  if (!Platform.device.wasm() && !Platform.device.webgl()) return fail('unsupported');
  if (Lens.status.state !== 'ready') {
    const ok = await Lens.load();
    if (ui.pending !== p) return clearInterval(clock);
    if (!ok) return fail(Platform.device.online() ? 'download' : 'offline');
    const s = $('#lensStatus'); if (s) s.textContent = lensStatusText().replace(/&[a-z]+;/g, '');
  }
  let rec;
  try { rec = await withTimeout(Lens.recognize(p.img), 30000, 'timeout'); }
  catch (e) { return fail(e.code === 'timeout' ? 'timeout' : e.code === 'busy' ? 'busy' : 'error'); }
  if (ui.pending !== p) return clearInterval(clock);
  p.rec = rec;
  if (!S.settings.lensCached) { S.settings.lensCached = true; persist(); }
  // developer-only experimental lens: compare side by side, or let it refine the result (hybrid)
  const mode = S.settings.expLens || 'off';
  if (mode !== 'off' || S.settings.fieldTest) {
    const s = $('#lensStatus'); if (s) s.textContent = 'Experimental lens running…';
    try {
      if (ClipLens.status.state !== 'ready' && !(await ClipLens.load())) throw new Error(ClipLens.status.error || 'experimental lens unavailable');
      p.clip = await withTimeout(ClipLens.recognize(rec.image, rec), 30000, 'timeout');
      p.prodOnly = { decision: rec.decision, reason: rec.reason, top: ftTop(rec) }; // what production alone said (field test)
      if (mode === 'hybrid') applyHybrid(rec, p.clip);
    } catch (e) { p.clipError = String(e.message || e); }
  }
  clearInterval(clock);
  if (ui.pending !== p) return;
  if (S.settings.fieldTest) return showFieldTest(p);
  if (rec.decision === 'unknown') return showUnknown(p);
  if (rec.decision === 'auto') return showIdentified(p, 0);
  showChoices(p);
}
// hybrid mode: replace the production candidates with the fused result and re-decide with the same rules
function applyHybrid(rec, clip) {
  const h = ClipLens.hybridDecision(rec, clip, Lens.CFG);
  rec.candidates = h.candidates; rec.decision = h.decision; rec.reason = h.reason;
  rec.debug.decision = rec.decision + ' (hybrid' + (h.reason === 'disagree' ? ': lenses disagree' : '') + ')';
}
/* ---------- field test (developer mode) ----------
   Records what each model said and the tester's verdict in a SEPARATE store (snapmon.fieldtest.v1). Nothing here ever
   feeds back into recognition, and a field-test photo never creates an encounter. */
const FT_KEY = 'snapmon.fieldtest.v1';
const ftLoad = () => { try { return JSON.parse(Platform.storage.get(FT_KEY) || '[]'); } catch (e) { return []; } };
// "new" = logged after the newest entry already copied out, so each field-test round can be sent on its own
const ftNew = () => { const after = +(Platform.storage.get(FT_KEY + '.copied') || 0); return ftLoad().filter(e => e.t > after); };
const ftSave = list => Platform.storage.set(FT_KEY, JSON.stringify(list.slice(-500)));
function ftTop(rec) { return (rec.candidates || []).slice(0, 3).map(c => ({ obj: c.obj, label: c.label, conf: +c.conf.toFixed(3) })); }
function showFieldTest(p) {
  const rec = p.rec, clip = p.clip, hybrid = (S.settings.expLens || 'off') === 'hybrid' && p.prodOnly;
  const prodRec = p.prodOnly || { decision: rec.decision, reason: rec.reason, top: ftTop(rec) }, prodTop = prodRec.top;
  const clipTop = clip ? clip.regions[0].ranked.slice(0, 3).map(x => ({ obj: x.obj, label: x.label, p: +x.p.toFixed(3) })) : null;
  p.ft = { v: 2, t: Date.now(), prod: { decision: prodRec.decision, reason: prodRec.reason, top: prodTop, ms: rec.debug && rec.debug.times && rec.debug.times.total },
    clip: clip ? { accepted: clip.regions[0].accepted, why: clip.regions[0].why, top: clipTop, ms: clip.totalMs, backend: clip.backend } : p.clipError ? { error: p.clipError } : null,
    hybrid: hybrid ? { decision: rec.decision, reason: rec.reason, top: ftTop(rec) } : null, marks: {} };
  const nm = x => esc(x.obj && OBJECTS[x.obj] ? OBJECTS[x.obj].name : x.label);
  // verdict buttons match what the lens did: an answer is right / in the list / wrong; no answer is rightly unknown or a miss
  const ANSWERED = [['top1', 'Right'], ['top3', 'Right one is in the list'], ['wrong', 'Wrong']];
  const UNANSWERED = [['rejected_ok', 'Rightly unknown'], ['missed_guess', 'Missed, but its best guess was right'], ['rejected_bad', 'Missed']];
  const markRow = (model, label, answered) => `<div class="stack" style="gap:6px"><b class="small">${label}</b><div class="row wrap">${(answered ? ANSWERED : UNANSWERED)
    .map(([k, l]) => `<button class="fchip" data-act="ftMark" data-arg="${model}:${k}">${l}</button>`).join('')}</div></div>`;
  $('#overlay').innerHTML = `<div class="overlay"><div class="overlay-inner" style="gap:12px">
    <div class="sheet-head"><h2>Field test</h2><button class="btn small ghost" data-act="cancelPhoto">Close</button></div>
    <p class="small muted" style="margin:0">No monster is created in field-test mode. Your answers are stored separately and are never used for recognition.</p>
    <div class="photo-frame" id="lensFrame"></div>
    <div class="card small stack" style="gap:4px"><b>Production lens</b> <span class="muted">${esc(prodRec.decision)} (${esc(prodRec.reason)}) · ${p.ft.prod.ms || '?'} ms</span>
      <div>${prodTop.length ? prodTop.map((x, i) => `${i + 1}. ${nm(x)} <span class="muted">${Math.round(x.conf * 100)}%</span>`).join('<br>') : '<span class="muted">nothing accepted</span>'}</div></div>
    ${clipTop ? `<div class="card small stack" style="gap:4px"><b>Experimental lens</b> <span class="muted">${clip.regions[0].accepted ? 'accepted' : 'rejected: ' + esc(clip.regions[0].why)} · ${clip.totalMs} ms · ${esc(clip.backend)}</span>
      <div>${clipTop.map((x, i) => `${i + 1}. ${nm(x)} <span class="muted">score ${(x.p * 100).toFixed(1)}</span>`).join('<br>')}</div></div>` : p.clipError ? `<div class="card small">Experimental lens failed: ${esc(p.clipError)}</div>` : ''}
    ${hybrid ? `<div class="card small stack" style="gap:4px"><b>Hybrid result</b> <span class="muted">${esc(rec.decision)} (${esc(rec.reason)})</span>
      <div>${p.ft.hybrid.top.length ? p.ft.hybrid.top.map((x, i) => `${i + 1}. ${nm(x)}`).join('<br>') : '<span class="muted">nothing</span>'}</div></div>` : ''}
    ${markRow('prod', 'Production verdict', prodRec.decision !== 'unknown')}${clipTop ? markRow('clip', 'Experimental verdict', clip.regions[0].accepted) : ''}${hybrid ? markRow('hybrid', 'Hybrid verdict', rec.decision !== 'unknown') : ''}
    <input class="search" id="ftTruth" maxlength="60" placeholder="What was it really? (optional, for the test log only)" autocomplete="off">
    <button class="btn primary block" data-act="ftSave">Save result &amp; take another</button>
    ${debugHTML(rec)}
  </div></div>`;
  drawDetections(p);
}
// Answered: right / list / wrong. Not answered: rightly unknown / missed. v1 entries (before the verdict fix) used
// 'rejected_ok' for some wrong answers too, so those are counted from the logged decision, not the verdict.
function ftStats(list) {
  const blank = () => ({ n: 0, answered: 0, right: 0, inList: 0, unknownOk: 0, missed: 0, ms: [] }), m = { prod: blank(), clip: blank(), hybrid: blank() };
  for (const e of list) for (const k of ['prod', 'clip', 'hybrid']) {
    const v = e.marks && e.marks[k], r = e[k]; if (!v || !r) continue; const s = m[k]; s.n++;
    const answered = k === 'clip' ? r.accepted : r.decision !== 'unknown';
    if (answered) { s.answered++; if (v === 'top1') s.right++; if (v === 'top1' || v === 'top3') s.inList++; }
    else if (v === 'rejected_ok') s.unknownOk++; else s.missed++;
    if (r.ms) s.ms.push(r.ms);
  }
  return m;
}
function ftSummaryHTML() {
  const list = ftLoad(), st = ftStats(list), pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '–';
  const row = (k, l) => { const s = st[k], ms = s.ms; if (!s.n) return ''; return `<tr><td>${l}</td><td>${s.n}</td><td>${pct(s.right, s.answered)}</td><td>${pct(s.inList, s.answered)}</td><td>${s.unknownOk} / ${s.missed}</td><td>${ms.length ? ms.sort((a, b) => a - b)[ms.length >> 1] + ' / ' + ms[ms.length - 1] : '–'}</td></tr>`; };
  return `<div class="debug small"><table><tr><th></th><th>photos</th><th>right when it answered</th><th>right one in list</th><th>right unknown / missed</th><th>ms median / worst</th></tr>${row('prod', 'Production')}${row('clip', 'Experimental')}${row('hybrid', 'Hybrid')}</table></div>
    <p class="small muted" style="margin:0">${list.length} field-test photos logged on this phone.</p>`;
}

function showLensFailed(p, kind) {
  const L = Lens.status;
  const msg = {
    download: ['The Spirit Lens could not download', 'Recognition runs on your phone, but its AI models (about 30 MB) must be downloaded once. The download failed. Check your connection and try again.'],
    offline: ['You are offline', 'The Spirit Lens needs to download its AI models once (about 30 MB). Connect to the internet and try again. After that it works offline.'],
    timeout: ['Recognition took too long', 'The Spirit Lens did not finish in time. Close other apps, then try again.'],
    unsupported: ['This device cannot run the Spirit Lens', 'The browser lacks WebGL and WebAssembly, which on-device recognition needs. Try a recent version of Chrome.'],
    busy: ['Still thinking', 'The lens was busy with another photo. Try again.'],
    error: ['The Spirit Lens hit a problem', 'Something went wrong during recognition. Try again.'],
  }[kind] || ['The Spirit Lens hit a problem', 'Try again.'];
  $('#overlay').innerHTML = `<div class="overlay"><div class="overlay-inner" style="justify-content:center;text-align:center;gap:14px">
    <h2 style="font-size:26px">${msg[0]}</h2><p>${msg[1]}</p>
    <p class="small muted">No monster was created. The photo was not stored.</p>
    ${S.settings.debugLens ? `<p class="small muted" style="word-break:break-word">Details: ${esc(L.error || kind)}</p>` : ''}
    <button class="btn primary block" data-act="lensRetry">Try again</button>
    <button class="btn ghost block" data-act="cancelPhoto">Back</button></div></div>`;
}
function showUnknown(p) {
  const reason = p.rec.reason;
  S.stats.unrecognized = (S.stats.unrecognized || 0) + 1; persist();
  SFX.nothing();
  const msg = reason === 'person' ? ['Just a human', 'Humans are (mostly) not monsters. Point the lens at an object.']
    : reason === 'scene' ? ['Too much going on', 'That looks like a place, not an object. Get closer to one thing.']
    : ['Unknown object', 'No supernatural signature detected.'];

function drawDetections(p, only) {

async function scan(i) {

    <h2 style="text-align:center">Scanning for supernatural activity…</h2>

    await wait(220);

      <h2 style="font-size:28px;color:var(--muted)">${result.dup ? 'Already scanned' : 'All quiet'}</h2>
      <p style="font-size:18px">${esc(result.line)}</p>

}

function anim(el, cls) { if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), 700); }
const STATUS_NAME = { poison: 'Poisoned', burn: 'Burning', stun: 'Stunned', defdown: 'Defense down', atkup: 'Attack up', defup: 'Defense up', immune: 'Immune' };

async function play(events) {
  const B = ui.battle;
  let lastFx = 'slash';
  for (const e of events) {
    if (!ui.battle) return;
    switch (e.t) {
      case 'act': {
        const actor = e.who === 'hero' ? 'You' : B.enemy.name.split(',')[0];
        if (e.who === 'hero') {
          setLog(e.name === 'Attack' ? `You attack with the ${WEAPONS[B.weapon].name}!` : e.name === 'Flee' ? 'You try to run…' : e.fx === 'item' ? `You use ${e.name}.` : e.fx === 'trap' ? 'You hurl a Snap Trap!' : `You unleash ${e.name}!`);
          if (e.fx === 'trap') break;
          if (e.fx && e.fx !== 'item') { anim($('#hero'), 'lunge-r'); lastFx = e.fx; await wait(e.special ? 320 : 180); }
          else await wait(350);
        } else {
          setLog(e.ability ? `${actor} uses ${e.name}!` : `${actor} attacks!`);
          if (e.ultimate) { const o = $('.overlay'); anim(o, 'shake'); }
          anim($('#foe'), 'lunge-l'); await wait(e.ability ? 420 : 260);
        }
        break;
      }
      case 'hit': {
        if (e.who === 'enemy') {
          spawnFx(lastFx); SFX.hit(lastFx); await wait(lastFx === 'orb' ? 300 : 120);
          B.disp.enemy = Math.max(0, B.disp.enemy - e.dmg);
          anim($('#foe img'), 'hitflash');
          floatText('enemy', (e.crit ? 'CRIT ' : '') + e.dmg, e.crit ? 'crit' : '', e.eff > 1 ? '#ffe55c' : e.eff < 1 ? '#a0a0b8' : '#fff');
          if (e.crit) anim($('.overlay'), 'shake');
        } else {
          heroImpact(); SFX.hurt();
          B.disp.hero = Math.max(0, B.disp.hero - e.dmg);
          anim($('#hero img'), 'hitflash');
          floatText('hero', (e.crit ? 'CRIT ' : '') + e.dmg, e.crit ? 'crit' : '', '#ff8a9a');
          if (e.crit) anim($('.overlay'), 'shake');
        }
        refreshBattleBars(); await wait(380); break;
      }
      case 'miss': SFX.miss(); floatText(e.who, 'MISS', '', '#a0a0b8'); setLog(e.who === 'enemy' ? 'Missed!' : 'You dodged it!'); await wait(380); break;
      case 'heal': SFX.heal(); B.disp[e.who] = Math.min(B[e.who].maxHp, B.disp[e.who] + e.amt); floatText(e.who, '+' + e.amt, '', '#7dff9a'); refreshBattleBars(); await wait(380); break;
      case 'status': SFX.status(); floatText(e.who, STATUS_NAME[e.s] || e.s, '', '#d6a2ff'); refreshBattleBars(); await wait(360); break;
      case 'dot': B.disp[e.who] = Math.max(0, B.disp[e.who] - e.dmg); floatText(e.who, e.dmg, '', e.s === 'poison' ? '#c48bff' : '#ffae5c'); setLog(`${e.who === 'hero' ? 'You take' : B.enemy.name.split(',')[0] + ' takes'} ${e.s} damage.`); refreshBattleBars(); await wait(420); break;
      case 'expire': refreshBattleBars(); break;
      case 'text': setLog(e.msg); await wait(e.stun ? 650 : 520); break;
      case 'capture': await captureAnim(e.ok); break;
      case 'end': break;
    }
  }

}
async function captureAnim(ok) {
  const trap = spawnFx('trap'); const foe = $('#foe img');
  await wait(480);
  if (foe) { foe.style.transition = 'transform .3s, opacity .3s'; foe.style.transform = 'scale(.1)'; foe.style.opacity = '0'; }
  await wait(380);
  const shakes = ok ? 3 : 1 + Math.floor(Math.random() * 2);
  for (let i = 0; i < shakes; i++) { SFX.trap(); anim(trap, 'wobble'); setLog('…'.repeat(i + 1)); await wait(620); }
  if (ok) { SFX.capture(); setLog(`Gotcha! ${ui.battle.enemy.name.split(',')[0]} was captured!`); if (trap) trap.style.boxShadow = '0 0 40px #7cf5d3, 0 0 80px #fff'; await wait(900); }
  else {

    if (foe) { foe.style.transform = ''; foe.style.opacity = ''; setTimeout(() => { if (foe) foe.style.transition = ''; }, 350); }
    setLog('Argh! It broke free!'); await wait(650);

}

async function battleAction(kind, arg) {
  const B = ui.battle; if (!B || ui.busy || B.over) return;
  let ev;
  if (kind === 'attack') ev = heroStrike(B, S, false);
  else if (kind === 'special') { if (B.hero.energy < WEAPONS[B.weapon].special.cost) return toast('Not enough energy yet — basic attacks charge it.'); ev = heroStrike(B, S, true); }
  else if (kind === 'capture') { const r = attemptCapture(B, S); if (!r.used) return toast('You are out of Snap Traps. Craft or buy more in Gear.', 'bad'); ev = r.ev; }
  else if (kind === 'flee') ev = attemptFlee(B, S);
  else if (kind === 'item') { const r = useItem(B, S, arg); closeSheet(); if (!r.ok) return toast(r.ev[0] ? r.ev[0].msg : 'You cannot use that right now.'); ev = r.ev; }
  ui.busy = true; refreshActions();
  await play(ev);
  if (B.over) return endBattle();
  await runEnemy();
}
async function runEnemy() {
  const B = ui.battle; if (!B) return;
  ui.busy = true; refreshActions();
  for (let guard = 0; guard < 6; guard++) {
    await play(enemyTurn(B));
    if (B.over) return endBattle();
    const st = heroTurnStart(B);
    await play(st.ev);
    if (B.over) return endBattle();
    if (!st.skip) break;
  }
  B.turn++; ui.busy = false; refreshActions(); setLog('Your move.');
}
