<title>SNAPMON: Monsters Among Us</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#110d1b">
<meta name="description" content="Photograph real objects to reveal the monsters hiding inside them. Fight, capture and collect.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Chakra+Petch:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app — status bar, scrolling screen, fixed thumb-reach tab bar; battles and scans take over the screen. */
:root {
  --ink: #110d1b; --panel: #1b1530; --panel-2: #251d40; --line: #3a2f5e; --text: #f1ecff; --muted: #a79dc9;
  --ecto: #7cf5d3; --flash: #ffcf5a; --danger: #ff5d73; --good: #62d87a; --violet: #a68bff;
  --r-common: #a9b4c6; --r-uncommon: #62d87a; --r-rare: #4fb0ff; --r-epic: #c977ff; --r-legendary: #ffbe3b;
  --font-display: 'Pixelify Sans', 'Courier New', monospace;
  --font-body: 'Chakra Petch', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --tabbar: 64px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; } /* author display rules must never override the hidden attribute */
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--text); font: 15px/1.45 var(--font-body); overscroll-behavior: none; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ecto); outline-offset: 2px; }
img.px, canvas.px { image-rendering: pixelated; image-rendering: crisp-edges; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: 0.02em; }
h3 { font-family: var(--font-body); letter-spacing: 0; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }

#app { max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; position: relative;
  background: radial-gradient(120% 60% at 50% -10%, #2a1f4d 0%, transparent 60%), var(--ink); }

/* ---- top status bar ---- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center;
  padding-block: 10px 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(var(--ink) 70%, transparent); }
.lvl-badge { width: 44px; height: 44px; border-radius: 12px; background: var(--panel-2); border: 2px solid var(--line); display: grid; place-items: center; font-family: var(--font-body); font-weight: 700; line-height: 1; text-align: center; }
.lvl-badge b { font-size: 18px; display: block; } .lvl-badge span { font-size: 9px; color: var(--muted); letter-spacing: .12em; }
.bars { display: grid; gap: 5px; min-width: 0; }
.bar { height: 10px; border-radius: 6px; background: #0b0814; border: 1px solid var(--line); overflow: hidden; position: relative; }
.bar > i { position: absolute; inset: 0 auto 0 0; border-radius: 5px; transition: width .35s ease; }
.bar.hp > i { background: linear-gradient(90deg, #ff5d73, #ff9a6b); }
.bar.hp.ok > i { background: linear-gradient(90deg, #45d07a, #a6f07a); }
.bar.xp > i { background: linear-gradient(90deg, #7a5cff, #7cf5d3); }
.bar.en > i { background: linear-gradient(90deg, #ffb13b, #ffe55c); }
.bar-row { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); }
.bar-row .bar { flex: 1; }
.bar-row .lbl { width: 22px; font-weight: 700; letter-spacing: .06em; }
.bar-row .val { min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
.top-right { display: flex; gap: 6px; align-items: center; }
.wallet { display: grid; justify-items: end; font-size: 12px; line-height: 1.25; font-variant-numeric: tabular-nums; }
.wallet .c { color: var(--flash); font-weight: 700; } .wallet .r { color: var(--ecto); font-weight: 700; }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; padding: 0; }
.icon-btn svg { width: 20px; height: 20px; }

/* ---- screens ---- */
main#screen { flex: 1; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 4px calc(var(--tabbar) + 24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
.screen-enter { animation: screenIn .28s ease both; }
@keyframes screenIn { from { opacity: .3; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.section-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.section-title h2 { font-size: 20px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

.btn { border: none; border-radius: 12px; padding: 12px 16px; font-weight: 700; letter-spacing: .02em; background: var(--panel-2); border: 1px solid var(--line); min-height: 46px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .08s ease, filter .15s; user-select: none; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--flash); color: #1b1206; border-color: transparent; }
.btn.ecto { background: var(--ecto); color: #062019; border-color: transparent; }
.btn.danger { background: var(--danger); color: #22060c; border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 36px; padding: 7px 12px; font-size: 13px; border-radius: 10px; }
.btn[disabled], .btn.disabled { opacity: .42; pointer-events: none; }
.btn.block { width: 100%; }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 9px; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; border: 1px solid var(--line); background: var(--panel-2); white-space: nowrap; }
.chip.r { border-color: currentColor; background: transparent; }
.seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: none; background: none; border-radius: 9px; padding: 9px 6px; font-weight: 700; color: var(--muted); }
.seg button.on { background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.chips-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips-scroll::-webkit-scrollbar { display: none; }
.fchip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--muted); }
.fchip.on { color: var(--ink); background: var(--text); border-color: var(--text); }

/* ---- hunt screen ---- */
.viewfinder { position: relative; aspect-ratio: 4 / 4.2; max-width: 100%; border-radius: 22px; overflow: hidden; background:
  radial-gradient(circle at 50% 45%, #1f3a3f 0%, #121022 55%, #0a0812 100%); border: 1px solid #2c4a52; isolation: isolate; }
.viewfinder::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(124,245,211,.05) 0 1px, transparent 1px 3px); pointer-events: none; z-index: 2; }
.vf-corner { position: absolute; width: 34px; height: 34px; border: 3px solid var(--ecto); z-index: 3; opacity: .85; }
.vf-corner.tl { top: 16px; left: 16px; border-right: 0; border-bottom: 0; border-radius: 8px 0 0 0; }
.vf-corner.tr { top: 16px; right: 16px; border-left: 0; border-bottom: 0; border-radius: 0 8px 0 0; }
.vf-corner.bl { bottom: 16px; left: 16px; border-right: 0; border-top: 0; border-radius: 0 0 0 8px; }
.vf-corner.br { bottom: 16px; right: 16px; border-left: 0; border-top: 0; border-radius: 0 0 8px 0; }
.vf-sweep { position: absolute; left: 0; right: 0; height: 40%; top: 0; background: linear-gradient(transparent, rgba(124,245,211,.12) 85%, rgba(124,245,211,.5)); z-index: 2; animation: sweep 3.8s linear infinite; pointer-events: none; will-change: transform; transform: translateY(-100%); }
/* transform (not top): runs on the compositor, so the sweep keeps moving while the CPU detector holds the main thread */
@keyframes sweep { from { transform: translateY(-100%); } to { transform: translateY(250%); } }
.vf-center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; z-index: 3; padding: 40px; }
.vf-center h1 { font-size: clamp(30px, 9vw, 44px); line-height: .95; color: var(--text); text-shadow: 0 0 18px rgba(124,245,211,.45); }
.vf-center h1 em { font-style: normal; color: var(--ecto); }
.vf-center p { margin: 10px auto 0; max-width: 26ch; color: #c9c0ea; }
.vf-hud { position: absolute; left: 22px; right: 22px; bottom: 22px; display: flex; justify-content: space-between; font: 600 11px var(--font-body); letter-spacing: .14em; color: var(--ecto); z-index: 3; opacity: .85; }
.vf-hud .rec::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--danger); margin-right: 6px; animation: blink 1.2s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.vf-ghost { position: absolute; z-index: 1; width: 120px; opacity: .08; filter: blur(1px) brightness(2); animation: drift 14s ease-in-out infinite alternate; }
@keyframes drift { from { transform: translate(-40px, 40px); } to { transform: translate(180px, 160px); } }
.viewfinder video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
.shutter-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; margin-top: -4px; }
.shutter { width: 96px; height: 96px; border-radius: 50%; border: 5px solid var(--text); background: radial-gradient(circle at 40% 35%, #fff3c4, var(--flash) 45%, #e59a1f); display: grid; place-items: center; cursor: pointer;
  box-shadow: 0 0 0 6px rgba(255,207,90,.15), 0 10px 30px rgba(255,170,40,.25); font: 700 15px var(--font-display); color: #2a1904; letter-spacing: .08em; position: relative; }
.shutter:active { transform: scale(.94); }
.shutter::after { content: ""; position: absolute; inset: -14px; border-radius: 50%; border: 2px solid rgba(255,207,90,.35); animation: pulse 2.2s ease-out infinite; }
@keyframes pulse { from { transform: scale(.85); opacity: 1; } to { transform: scale(1.15); opacity: 0; } }
.side-btn { justify-self: center; display: grid; justify-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); background: none; border: none; cursor: pointer; padding: 6px; }
.side-btn .ic { width: 48px; height: 48px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); display: grid; place-items: center; }
.side-btn svg { width: 22px; height: 22px; }
.quest { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.quest:first-of-type { border-top: 0; }
.quest h3 { font-size: 15px; } .quest p { margin: 0; font-size: 13px; color: var(--muted); grid-column: 1; }
.quest .bar { grid-column: 1 / -1; height: 7px; }
.quest .bar > i { background: var(--ecto); }
.warn { border-color: #6a2a3c; background: linear-gradient(90deg, #2c1424, var(--panel)); }
.sightings { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.sighting { flex: 0 0 auto; width: 76px; text-align: center; font-size: 11px; color: var(--muted); }
.sighting img { width: 64px; height: 64px; display: block; margin: 0 auto 2px; }

/* ---- tab bar ---- */
.tabs { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 520px; z-index: 6; display: grid; grid-template-columns: repeat(4, 1fr);
  background: rgba(17,13,27,.94); backdrop-filter: blur(10px); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabs button { height: var(--tabbar); border: none; background: none; display: grid; justify-items: center; align-content: center; gap: 3px; font-size: 11.5px; font-weight: 700; color: var(--muted); letter-spacing: .05em; position: relative; }
.tabs button svg { width: 24px; height: 24px; }
.tabs button.on { color: var(--ecto); }
.tabs button.on::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--ecto); }
.tabs .dot { position: absolute; top: 10px; right: calc(50% - 20px); width: 9px; height: 9px; border-radius: 50%; background: var(--flash); box-shadow: 0 0 0 2px var(--ink); }

/* ---- monster cards ---- */
.mgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.mcard { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 6px 9px; text-align: center; cursor: pointer; overflow: hidden; }
.mcard::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--rc) 28%, transparent), transparent 65%); pointer-events: none; }
.mcard.seen img { opacity: .55; filter: grayscale(.5); }
.swatch { display: inline-block; width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--line); vertical-align: middle; margin-right: 4px; }
.rdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; border: 1px solid; margin: 0 1px; }
.mcard img { width: 100%; max-width: 96px; aspect-ratio: 1; display: block; margin: 0 auto; position: relative; }
.mcard .nm { font-weight: 700; font-size: 12.5px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; position: relative; }
.mcard .sub { font-size: 11px; color: var(--muted); position: relative; }
.mcard.r-rare { border-color: color-mix(in srgb, var(--r-rare) 60%, var(--line)); }
.mcard.r-epic { border-color: color-mix(in srgb, var(--r-epic) 70%, var(--line)); box-shadow: 0 0 16px -6px var(--r-epic); }
.mcard.r-legendary { border-color: var(--r-legendary); box-shadow: 0 0 22px -6px var(--r-legendary); animation: legendGlow 2.4s ease-in-out infinite; }
@keyframes legendGlow { 50% { box-shadow: 0 0 30px -4px var(--r-legendary); } }
.mcard .badge { position: absolute; top: 6px; right: 6px; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 6px; background: var(--ecto); color: var(--ink); z-index: 1; }
.mcard .vbadge { position: absolute; top: 6px; left: 6px; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 6px; background: var(--violet); color: var(--ink); z-index: 1; }
.dex-row { display: grid; grid-template-columns: 92px repeat(5, minmax(0, 1fr)); gap: 6px; align-items: center; }
.dex-row .cat { font-size: 12px; font-weight: 600; line-height: 1.2; color: var(--muted); }
.dex-row .cat b { display: block; color: var(--text); font-size: 13px; }
.slot { aspect-ratio: 1; border-radius: 10px; background: #0d0a16; border: 1px solid var(--line); display: grid; place-items: center; position: relative; cursor: pointer; padding: 0; }
.slot img { width: 92%; }
.slot.locked { cursor: default; color: #3b3260; font: 700 16px var(--font-display); }
.slot::after { content: ""; position: absolute; bottom: 4px; left: 50%; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--rc); opacity: .9; }
.slot.caught { border-color: color-mix(in srgb, var(--rc) 70%, var(--line)); }

/* ---- sprite stage ---- */
.stage { position: relative; display: grid; place-items: center; }
.sprite { position: relative; display: grid; place-items: center; }
.sprite img { position: relative; z-index: 1; animation: idle 1.8s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes idle { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-4px) scale(1.02, .97); } }
.sprite.hover img { animation: floaty 2.6s ease-in-out infinite; }
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.sprite .aura { position: absolute; inset: -10%; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--rc) 55%, transparent) 0%, transparent 62%); animation: auraPulse 2s ease-in-out infinite; }
@keyframes auraPulse { 50% { transform: scale(1.12); opacity: .75; } }
.sprite .spark { position: absolute; width: 6px; height: 6px; background: var(--rc); z-index: 2; animation: sparkle 2.4s ease-in-out infinite; box-shadow: 0 0 8px var(--rc); }
@keyframes sparkle { 0%, 100% { opacity: 0; transform: translateY(10px) scale(.3); } 50% { opacity: 1; transform: translateY(-14px) scale(1); } }
.sprite.shiny img { filter: drop-shadow(0 0 6px #fff) saturate(1.3); }
.sprite.spectral img { opacity: .9; filter: drop-shadow(0 0 10px #9ff7ff); }
.shadow { width: 60%; height: 12px; border-radius: 50%; background: rgba(0,0,0,.45); margin-top: -10px; }

/* ---- overlays (scan, discovery, battle, results) ---- */
.overlay { position: fixed; inset: 0; z-index: 20; display: flex; justify-content: center; background: rgba(8,6,14,.86); backdrop-filter: blur(4px); animation: fadeIn .2s ease; }
@keyframes fadeIn { from { opacity: 0; } }
.overlay-inner { width: 100%; max-width: 520px; height: 100%; display: flex; flex-direction: column; overflow-y: auto;
  padding-top: max(14px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 14px; }
.overlay-inner > * { flex-shrink: 0; }
.battle .overlay-inner > .arena { flex-shrink: 1; }
.camera .overlay-inner.cam-inner { justify-content: center; }
.cam-frame { position: relative; width: 100%; max-width: 100%; aspect-ratio: 3 / 4; max-height: 64vh; margin: 0 auto; border-radius: 18px; overflow: hidden; background: #000; border: 1px solid #2c4a52; }
.cam-frame { touch-action: none; }
.cam-frame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; transform-origin: 50% 50%; }
.cam-frame .vf-corner, .cam-frame .vf-sweep { z-index: 2; }
.cam-status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ecto); font-weight: 600; z-index: 3; background: #000; }
.lore { font-style: italic; } .lore-epic { color: #d9b8ff; } .lore-legendary { color: #ffd98a; text-shadow: 0 0 12px rgba(255,190,59,.35); }
.guide-btn { font-weight: 800; font-size: 17px; color: var(--ecto); }
.guide-sec { border: 1px solid var(--line); border-radius: 14px; background: var(--panel2, #1a1430); }
.guide-sec > summary { padding: 12px 14px; font-weight: 700; cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
.guide-sec > summary::after { content: '▸'; color: var(--muted); } .guide-sec[open] > summary::after { content: '▾'; }
.guide-sec > summary::-webkit-details-marker { display: none; }
.guide-body { padding: 0 14px 12px; font-size: 14px; } .guide-body p { margin: 0 0 8px; } .guide-body ul { margin: 0 0 8px; padding-left: 18px; } .guide-body li { margin: 3px 0; }
.guide-table { overflow-x: auto; margin: 6px 0; } .guide-table table { border-collapse: collapse; width: 100%; font-size: 13px; }
.guide-table th, .guide-table td { border-bottom: 1px solid var(--line); padding: 5px 6px; text-align: left; vertical-align: top; }
.guide-cards { display: grid; gap: 8px; margin: 8px 0; } .guide-status { display: grid; grid-template-columns: 74px 1fr; gap: 8px; align-items: start; background: #0e0b18; border-radius: 10px; padding: 8px; }
.guide-status .st { justify-self: start; }
.shutter[disabled], .shutter.waiting { opacity: .45; filter: grayscale(.6); cursor: default; } .shutter[disabled]::after { animation: none; opacity: 0; }
.shutter .waking { font-size: 11px; letter-spacing: .1em; }
.test-banner { font: 700 11px var(--font-body); letter-spacing: .14em; color: #1b1206; background: repeating-linear-gradient(45deg, #ffcf5a 0 10px, #ffb13b 10px 20px); padding: 4px 10px; border-radius: 6px; margin: 0; }
.zoom-row { display: flex; align-items: center; gap: 8px; justify-content: center; }
.zoom-row input[type=range] { flex: 1; max-width: 240px; accent-color: var(--ecto); }
.zoom-row .num { min-width: 3.2em; text-align: right; color: var(--ecto); }
.cam-controls { display: flex; justify-content: center; padding-top: 6px; }
.shutter[disabled] { opacity: .45; }
.photo-frame { position: relative; border-radius: 18px; overflow: hidden; border: 1px solid #2c4a52; background: #000; aspect-ratio: 1; max-height: 42vh; max-width: 100%; margin: 0 auto; width: 100%; }
.photo-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-frame .vf-sweep { animation-duration: 1.2s; }
.scan-hud { position: absolute; inset: 0; z-index: 3; display: grid; align-content: end; padding: 14px; gap: 6px; font: 600 12px var(--font-body); letter-spacing: .12em; color: var(--ecto); text-shadow: 0 0 6px #000; }
.scan-hud .meter { display: grid; grid-template-columns: 64px 1fr 40px; gap: 8px; align-items: center; }
.scan-hud .meter i { display: block; height: 6px; background: rgba(124,245,211,.18); border-radius: 3px; overflow: hidden; }
.scan-hud .meter i b { display: block; height: 100%; background: var(--ecto); width: 0; transition: width .25s; }
.scanning .photo-frame img { animation: glitch .25s steps(2) infinite; }
@keyframes glitch { 50% { filter: hue-rotate(40deg) contrast(1.3) saturate(1.4); transform: translateX(1px); } }
.cat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cat-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 9px 4px; display: grid; justify-items: center; gap: 2px; font-size: 12px; font-weight: 600; line-height: 1.15; text-align: center; min-height: 66px; }

 s * Math.pow(2, -14) * (f / 1024) : e === 31 ? (f ? NaN : s * Infinity) : s * Math.pow(2, e - 15) * (1 + f / 1024);\n  }\n  return out;\n}\nconst memoryError = e => /memory|allocation|RangeError|Aborted\\(\\)|OOM/i.test(String(e && (e.message || e)));\n\nasync function makeSession(modelBuf, which) {\n  const s = await ort.InferenceSession.create(new Uint8Array(modelBuf), { executionProviders: which === 'webgpu' ? ['webgpu'] : ['wasm'], graphOptimizationLevel: 'all' });\n  // warm-up (also proves the backend really runs this model) so the first photo is not slowed down by compilation\n  const sz = meta.image.size;\n  await s.run({ [s.inputNames[0]]: new ort.Tensor('float32', new Float32Array(3 * sz * sz), [1, 3, sz, sz]) });\n  return s;\n}\n\n// test: { failGPU, failCPU } lets automated tests simulate backend failures; never set by the game itself\nasync function init({ base, ortBase, backend: want = 'wasm', expect = {}, test = {} }) {\n  const t0 = performance.now();\n  let gpu = false;\n  if (want === 'webgpu') {\n    gpu = !!test.failGPU;\n    if (!gpu && navigator.gpu) { try { gpu = !!(await navigator.gpu.requestAdapter()); } catch (e) { gpu = false; } }\n  }\n  // the WebGPU bundle also contains the WASM backend; the standard path loads only the smaller CPU build\n  importScripts(ortBase + (gpu ? 'ort.webgpu.min.js' : 'ort.min.js'));\n  ort.env.wasm.wasmPaths = ortBase;\n  // one thread on every device: the same WASM binary, the same operation order, the same result\n  ort.env.wasm.numThreads = 1;\n  const urls = { meta: base + 'vocab.json', vocab: base + 'vocab.bin' };\n  meta = JSON.parse(new TextDecoder().decode((await cachedFetch(urls.meta, 'vocab.json', expect['vocab.json'])).buf));\n  urls.model = base + meta.model;\n  const [m, v] = await Promise.all([cachedFetch(urls.model, meta.model, expect[meta.model]), cachedFetch(urls.vocab, 'vocab.bin', expect['vocab.bin'])]);\n  dim = meta.dim; nLabels = meta.labels.length;\n  vocab = f16ToF32(new Uint16Array(v.buf));\n  if (vocab.length !== dim * nLabels) { await purge(Object.values(urls)); throw Object.assign(new Error('vocabulary file does not match the model'), { kind: 'download' }); }\n  let gpuError = null;\n  if (gpu) {\n    try { if (test.failGPU) throw new Error('simulated WebGPU failure'); session = await makeSession(m.buf, 'webgpu'); backend = 'webgpu'; }\n    catch (e) { gpuError = String(e.message || e); session = null; }\n  }\n  if (!session) {\n    try { if (test.failCPU) throw new Error(test.failCPU); session = await makeSession(m.buf, 'wasm'); backend = 'wasm'; }\n    catch (e) {\n      if (m.cached) await purge([urls.model]); // maybe a damaged cached copy: download it again next time\n      throw Object.assign(new Error('the model failed to run on the CPU: ' + (e.message || e)), { kind: memoryError(e) ? 'memory' : 'init' });\n    }\n  }\n  return { backend, requested: want, threads: ort.env.wasm.numThreads, gpuError, loadMs: Math.round(performance.now() - t0), labels: nLabels, dim, modelBytes: m.buf.byteLength, vocabBytes: v.buf.byteLength,\n    name: meta.name, variant: meta.variant, fromCache: m.cached && v.cached };\n}\n\nasync function run({ crops, n, k = 8 }) {\n  const t0 = performance.now(), s = meta.image.size;\n  const out = await session.run({ [session.inputNames[0]]: new ort.Tensor('float32', crops, [n, 3, s, s]) });\n  const emb = out[session.outputNames[0]].data;\n  const scale = meta.scale, top = [];\n  for (let c = 0; c < n; c++) {\n    let norm = 0; for (let d = 0; d < dim; d++) norm += emb[c * dim + d] ** 2; norm = Math.sqrt(norm) || 1;\n    const cos = new Float32Array(nLabels);\n    let mx = -1e9;\n    for (let l = 0; l < nLabels; l++) { let dot = 0; const o = l * dim; for (let d = 0; d < dim; d++) dot += emb[c * dim + d] * vocab[o + d]; cos[l] = dot / norm; if (cos[l] > mx) mx = cos[l]; }\n    // softmax over the whole vocabulary (temperature = model's logit scale); summed per object later\n    let sum = 0; const p = new Float32Array(nLabels);\n    for (let l = 0; l < nLabels; l++) { p[l] = Math.exp(scale * (cos[l] - mx)); sum += p[l]; }\n    const idx = Array.from({ length: nLabels }, (_, i) => i).sort((a, b) => p[b] - p[a]).slice(0, k);\n    top.push(idx.map(i => ({ i, p: p[i] / sum, cos: +cos[i].toFixed(4) })));\n  }\n  return { top, ms: Math.round(performance.now() - t0) };\n}\n\nself.onmessage = async ev => {\n  const m = ev.data;\n  try {\n    if (m.type === 'init') self.postMessage({ type: 'ready', info: await init(m) });\n    else if (m.type === 'run') self.postMessage({ type: 'result', id: m.id, ...(await run(m)) });\n    else if (m.type === 'ping') self.postMessage({ type: 'pong', id: m.id, ok: !!session });\n  } catch (e) { self.postMessage({ type: 'error', id: m.id, error: String(e && e.message || e), kind: (e && e.kind) || (memoryError(e) ? 'memory' : 'init') }); }\n};\n";</script>

     'dedicated' – a bespoke builder for this exact object (PARTS.D or an original v1/v2 sprite)

/* ---------- v0.4.3: designs for vocabulary objects ----------
   Before v0.4.3 every vocabulary-only object was drawn with its category's single template, so a light switch or a
   security camera (filed under "tool") became a toolbox with toolbox lore. These rules give each object the closest
   honest design: a composed template with object parameters (V), or the design of a close relative (LIKE). Each rule
   also names a lore group (lore.js) and a name for the signature move; the move keeps its category's numbers, so combat
   balance is unchanged. First matching rule wins. Objects no rule covers get their category's neutral template
   (CAT_FALLBACK_VIS) instead of a specific object's look. Tests (tests/identity.js) check the important cases. */

<script>
/* SNAPMON — photo-derived monster colours (pure functions, no DOM: unit-tested in Node and reusable in a native build).

   extractPalette(rgba, w, h, box) reads a small RGBA image (the photo downscaled to ~128 px) and returns the colours of
   the photographed OBJECT, trying hard not to pick up the table, wall or floor behind it:

   1. Regions. The object region is the detected box (shrunk 6%) or, without a box, a central ellipse. The background
      model comes from pixels outside the box (a ring around it) plus the photo's border strip.
   2. Background model. k-means (k = 3) in CIELAB on the background pixels; clusters with ≥ 12% of them count.
   3. Foreground. Object-region pixels within ΔE 14 of a background cluster are dropped (unless that would drop
      almost everything: then the object probably matches its surroundings, and the result is marked as a fallback).
      Pixels are weighted towards the region's centre, where the object almost certainly is.
   4. Surfaces. k-means (k = 5) on the foreground, then clusters that differ mainly in lightness (the same surface in
      light and shadow) are merged into "surfaces". Specular glints (very light, colourless) and deep shadows only
      count as a surface when they dominate (white or black objects).
   5. Roles. primary = largest surface (its mid-tone), secondary = next clearly different surface (≥ 12%),
      highlight = lightest tone of the primary surface, shadow = darkest tone of the primary surface.
   6. Confidence. 'confident' when a box was used, enough foreground survived and one surface clearly leads;
      otherwise 'fallback' (the sprite then only leans towards the photo instead of copying it).

    const pts = [], wts = [], rgbs = [];
    for (let i = 0; i < objPts.length; i++) if (keep[i]) { pts.push(objPts[i]); wts.push(objW[i]); rgbs.push(objRGB[i]); }

    const lighting = s => s.members.every(m => (m.L > 92 && m.C < 8) || m.L < 9);

})();

/* SNAPMON — on-device colour/similarity analysis of a captured camera frame.
   Object recognition lives in lens.js.
   Photos never leave the device. Pixels are reduced to a colour signature + 64-bit similarity hash, then discarded
   (unless the player opts in to keeping small thumbnails). */

const Photo = (() => {
  // box: optional [x, y, w, h] as fractions of the image (a detected object). Colour is read from that region.
  function analyze(src, box) {

    const c = document.createElement('canvas'); c.width = 64; c.height = 64;
    const ctx = c.getContext('2d', { willReadFrequently: true });

      const bx = box[0] * w, by = box[1] * h, bw = Math.max(4, box[2] * w), bh = Math.max(4, box[3] * h);
      ctx.drawImage(src, bx + bw * 0.1, by + bh * 0.1, bw * 0.8, bh * 0.8, 0, 0, 64, 64);
    } else {
      // centre crop: the object being photographed is usually in the middle
      const side = Math.min(w, h) * 0.8, sx = (w - side) / 2, sy = (h - side) / 2;
      ctx.drawImage(src, sx, sy, side, side, 0, 0, 64, 64);

      const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, dd = mx - mn;
      const s = dd === 0 ? 0 : dd / (1 - Math.abs(2 * l - 1));

      sumS += s; sumL += l; n++;

/* SNAPMON — production half of the Hybrid recogniser (see engine.js): on-device object detection + classification.
   Two open-source TensorFlow.js models share one runtime (WebGL on Android Chrome):

   IndexedDB, and are never swapped for different or smaller models: if either model cannot load, the engine reports

    cocoLib: ['vendor/tfjs/coco-ssd.min.js', 'https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js'],
    cacheKeys: { classifier: 'indexeddb://snapmon-lens-mobilenet-v2-100', detector: 'indexeddb://snapmon-lens-cocossd-lite' },
    localUrls: { classifier: 'models/mobilenet_v2_100/model.json', detector: 'models/ssdlite_mobilenet_v2/model.json' },

    }
    // production's other ideas stay available as choices (rule 4), so fusing never removes a right answer
    for (const c of cands) if (!claimed.has(c) && !out.some(o => o.obj === c.obj)) out.push({ ...c, rule: 4 });
    return out.sort((a, b) => b.conf - a.conf);
  }

  /* Hybrid decision for one photo (developer "Hybrid" mode): fuse per region, then re-decide with the production
     lens's own thresholds (L = Lens.CFG). Then CLIP's best whole-photo object (score >= SECOND_P) is offered as a
     "second opinion" choice when:
       5.  production would identify the photo automatically but CLIP names a different object (not a near-synonym);
       5b. production is unsure (one object, low confidence) and CLIP's object is not among its ideas;
       6.  production found nothing (not a person) but CLIP has an object.
     Evidence from three phone field tests is in docs/RECOGNITION.md. The choices still come only from the two lenses:
     no typed input, and "none of these" leads to a retake. */
  const SECOND_P = 0.08;
  function hybridDecision(rec, clip, L) {
    const fused = fuse(rec, clip).filter(c => c.conf >= L.MIN_CONF).slice(0, L.MAX_CHOICES);
    let decision, reason;
    if (!fused.length) { decision = 'unknown'; reason = rec.reason === 'person' ? 'person' : 'low'; }
    else if (fused.filter(c => c.box).length >= 2) { decision = 'choose'; reason = 'multiple'; }
    else if (fused[0].conf >= L.AUTO_CONF && (!fused[1] || fused[1].conf < fused[0].conf * L.CLEAR_MARGIN)) { decision = 'auto'; reason = 'confident'; }
    else { decision = 'choose'; reason = 'unsure'; }
    const whole = clip.regions.find(r => !r.box), alt = whole && whole.best;
    if (!alt || !alt.obj || !OBJECTS[alt.obj] || alt.p < SECOND_P || fused.some(c => c.obj === alt.obj)) return { candidates: fused, decision, reason };
    // near-synonyms are not a disagreement: same category and CLIP rates production's object at least half as high
    // (wall clock 0.075 vs clock 0.118 = agree; coffeepot 0.104 vs electric kettle 0.267 = disagree; second field test)
    const backed = fused[0] && OBJECTS[fused[0].obj] && OBJECTS[alt.obj].cat === OBJECTS[fused[0].obj].cat &&
      (whole.ranked || []).some(x => x.obj === fused[0].obj && x.p >= alt.p * 0.5);
    const offer = (decision === 'auto' && !backed) || (decision === 'choose' && reason === 'unsure') || (decision === 'unknown' && reason !== 'person');
    if (!offer) return { candidates: fused, decision, reason };
    if (fused.length >= L.MAX_CHOICES) fused.pop(); // keep the list short: the weakest production idea makes room
    fused.push({ label: alt.label, obj: alt.obj, cat: OBJECTS[alt.obj].cat, conf: alt.p, box: null, src: 'clip', rule: decision === 'auto' ? 5 : decision === 'unknown' ? 6 : '5b' });
    return { candidates: fused, decision: 'choose', reason: decision === 'auto' ? 'disagree' : decision === 'unknown' ? 'second-opinion' : 'unsure' };
  }

  // is the worker still alive and holding a session? (it can be frozen or killed while the app is in the background)
  async function ping(ms = 4000) {
    if (st.state !== 'ready' || !st.worker) return false;
    if (st.busy) return true;
    try { const r = await call('ping' + (++st.seq), { type: 'ping', id: 'ping' + st.seq }, ms); return !!r.ok; } catch (e) { return false; }
  }
  function reset() { if (st.worker) st.worker.terminate(); Object.assign(st, { state: 'off', error: '', info: null, worker: null, meta: null, busy: false, loading: null }); st.pending.clear(); }
  return { load, recognize, fuse, judge, hybridDecision, reset, ping, status: st, CFG };
})();

<script>
/* SNAPMON — the recognition engine: ONE standard Hybrid recogniser for every player.

   Parts (all on the device, nothing uploaded):
     • Lens (lens.js)      — COCO-SSD lite detector + MobileNet v2 classifier (TF.js; WebGL, CPU fallback)
     • ClipLens (lens-clip.js + workers/clip-worker.js) — TinyCLIP ViT-39M/16 image encoder over a 2,940-label
                             vocabulary (ONNX Runtime Web; WebAssembly/CPU for everyone)
     • ClipLens.hybridDecision — the fusion and second-opinion rules (docs/RECOGNITION.md)

   Every player gets the same model files, vocabulary, thresholds and rules (ENGINE_ID names that set). TinyCLIP always
   runs on the CPU (WASM, one thread) so its scores are identical on every device; the detector/classifier uses the
   GPU (WebGL) where it works, otherwise the CPU with the same weights (measured differences ≤ 0.0001). If either part cannot load or run, hunting
   stops with an explanation and a Retry. There is no weaker fallback recogniser.

   Model files come from Platform.assets (the website today, the APK's bundled assets later). The deploy writes
   models/manifest.json (sizes + SHA-256), used for the download notice and to verify downloads. */
'use strict';

const ENGINE_ID = 'hybrid-1'; // bump whenever a model file, the vocabulary, a threshold or a decision rule changes

const Engine = (() => {
  const FALLBACK_SIZES = { lens: 32.6 * 1048576, clip: 53.5 * 1048576 }; // used if the manifest is missing (upper bounds)
  const st = { state: 'idle', stage: '', loaded: 0, total: 0, error: '', kind: '', loadMs: 0, manifest: null, backends: {} };
  const listeners = new Set();
  const emit = () => listeners.forEach(f => { try { f(st); } catch (e) {} });
  let loading = null;
  // timing of every recognition (not only field tests), kept on this phone for the developer panel; never uploaded
  const PERF_KEY = 'snapmon-perf', PERF_MAX = 200;
  function perfLog() { try { return JSON.parse(Platform.storage.get(PERF_KEY) || '[]'); } catch (e) { return []; } }
  function perfAdd(e) { try { const l = perfLog(); l.push(e); Platform.storage.set(PERF_KEY, JSON.stringify(l.slice(-PERF_MAX))); } catch (er) {} }

  async function manifest() {
    if (st.manifest) return st.manifest;
    try { const r = await fetch(Platform.assets.url('models/manifest.json'), { cache: 'no-cache' }); if (r.ok) st.manifest = await r.json(); } catch (e) {}
    return st.manifest;
  }
  // approximate one-time download, for the notice
  async function downloadBytes() {
    const m = await manifest();
    if (m && m.groups) return (m.groups.lens || FALLBACK_SIZES.lens) + (m.groups.clip || FALLBACK_SIZES.clip);
    return FALLBACK_SIZES.lens + FALLBACK_SIZES.clip;
  }

  // classify a failure into something the player can act on
  function kindOf(e, part) {
    const msg = String((e && (e.message || e)) || '');
    if (e && e.kind) return e.kind; // the worker already knows (download / memory / init / timeout / crash)
    if (!Platform.device.online()) return 'offline';
    if (/download|fetch|network|404|unavailable|could not/i.test(msg)) return 'download';
    if (/memory|allocation|RangeError|OOM|Aborted\(\)/i.test(msg)) return 'memory';
    if (/timed out|timeout/i.test(msg)) return 'timeout';
    if (!Platform.device.wasm()) return 'unsupported';
    return part === 'run' ? 'run' : 'init';
  }

  function load() {
    if (st.state === 'ready') return Promise.resolve(true);
    if (loading) return loading;
    // after a failure, start both parts from scratch (Retry must really reinitialise, not reuse a broken part)
    if (st.state === 'failed') { ClipLens.reset(); Lens.reset && Lens.reset(); }
    loading = (async () => {
      const t0 = performance.now();
      Object.assign(st, { state: 'loading', error: '', kind: '', stage: 'Preparing…', loaded: 0, total: 0 }); emit();
      try {
        if (!Platform.device.wasm()) throw Object.assign(new Error('this browser cannot run WebAssembly'), { kind: 'unsupported' });
        const m = await manifest();
        const lensBytes = (m && m.groups && m.groups.lens) || FALLBACK_SIZES.lens, clipBytes = (m && m.groups && m.groups.clip) || FALLBACK_SIZES.clip;
        st.total = lensBytes + clipBytes;
        if (m && m.files) {
          const pre = 'models/clip/' + ClipLens.CFG.variant + '/', expect = {};
          for (const f of m.files) if (f.path.startsWith(pre)) expect[f.path.slice(pre.length)] = { bytes: f.bytes, sha256: f.sha256 };
          ClipLens.CFG.expect = expect;
        }
        // one part after the other keeps peak memory and bandwidth lower on phones
        st.stage = 'Object detector and classifier'; emit();
        const tL = performance.now(); st.stageMs = {};
        if (!(await Lens.load())) throw Object.assign(new Error(Lens.status.error || 'detector/classifier failed to load'), { part: 'lens' });
        st.stageMs.lens = Math.round(performance.now() - tL);
        st.loaded = lensBytes; st.backends.lens = Lens.status.backend; st.stage = 'Object vocabulary model'; emit();
        const tC = performance.now();
        ClipLens.CFG.onProgress = prog => { const got = Object.values(prog).reduce((a, p) => a + (p.loaded || 0), 0); st.loaded = lensBytes + Math.min(clipBytes, got); emit(); };
        if (!(await ClipLens.load())) throw Object.assign(new Error(ClipLens.status.error || 'vocabulary model failed to load'), { kind: ClipLens.status.errorKind, part: 'clip' });
        st.backends.clip = ClipLens.status.info.backend; st.stageMs.clip = Math.round(performance.now() - tC);
        st.loaded = st.total; st.loadMs = Math.round(performance.now() - t0); st.state = 'ready'; st.stage = '';
        try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {} // ask the browser not to evict the models
      } catch (e) {
        st.state = 'failed'; st.error = String(e.message || e); st.kind = kindOf(e, 'load'); st.stage = '';
      }
      loading = null; emit();
      return st.state === 'ready';
    })();
    return loading;
  }

  /* Recovery. Android Chrome may freeze or discard parts of a page in the background: the GPU (WebGL) context can be
     lost, taking the detector/classifier weights with it, and the TinyCLIP worker can be frozen or stopped. Before
     v0.4.2 the engine still reported "ready" afterwards, so every hunt failed until the page was reloaded.
     check() asks both parts whether they still work (called when the app returns to the foreground); recover() throws
     both parts away and loads them again from the copies saved on the phone (no download). Only one recovery runs at a
     time, and it waits for any load already in progress. A page Chrome has killed entirely restarts from scratch. */
  let recovering = null, checkingP = null;
  // while checking, the engine does not count as ready (the game disables SNAP), so a stale "ready" is never used
  async function check() {
    if (st.state !== 'ready') return st.state !== 'failed';
    if (checkingP) return checkingP;
    st.checking = true; emit(); // not "ready" from this moment until the check is over
    checkingP = (async () => {
      try {
        const ok = Lens.healthy() && await ClipLens.ping();
        if (!ok) { st.recoveries = (st.recoveries || 0) + 1; await recover('check'); }
        return st.state === 'ready';
      } finally { st.checking = false; checkingP = null; emit(); }
    })();
    return checkingP;
  }
  const ready = () => st.state === 'ready' && !st.checking && !recovering && !loading;
  function recover(why) {
    if (recovering) return recovering;
    recovering = (async () => {
      if (loading) { try { await loading; } catch (e) {} }
      st.lastRecovery = { why, t: Date.now() };
      ClipLens.reset(); Lens.reset && Lens.reset();
      Object.assign(st, { state: 'idle', backends: {} }); emit();
      const ok = await load();
      recovering = null;
      return ok;
    })();
    return recovering;
  }

  const timeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(Object.assign(new Error('recognition timed out'), { kind: 'timeout' })), ms))]);
  // Recognise one photo with the standard pipeline. Returns { rec, prodOnly, clip }: rec carries the final decision.
  async function recognize(img, { timeoutMs = 45000 } = {}) {
    if (st.state !== 'ready') throw Object.assign(new Error('recognition engine not ready'), { kind: 'not-ready' });
    try { return await recognizeOnce(img, timeoutMs); }
    catch (e) {
      const kind = (e && e.kind) || kindOf(e, 'run');
      if (kind === 'busy') throw Object.assign(e instanceof Error ? e : new Error(String(e)), { kind });
      // too slow: report it now (no second long wait), but reload in the background in case something is stuck
      if (kind === 'timeout') { st.recoveries = (st.recoveries || 0) + 1; recover('timeout'); throw Object.assign(e instanceof Error ? e : new Error(String(e)), { kind }); }
      // the engine may have lost its GPU context or worker (e.g. after the app was in the background): reload both
      // parts from the phone's cache and try this photo once more, with the same models
      st.recoveries = (st.recoveries || 0) + 1;
      if (await recover('run: ' + kind)) {
        try { return await recognizeOnce(img, timeoutMs); }
        catch (e2) { st.state = 'failed'; st.error = String(e2.message || e2); st.kind = (e2 && e2.kind) || kindOf(e2, 'run'); emit(); throw Object.assign(e2 instanceof Error ? e2 : new Error(String(e2)), { kind: st.kind }); }
      }
      throw Object.assign(e instanceof Error ? e : new Error(String(e)), { kind: st.kind || kind });
    }
  }
  async function recognizeOnce(img, timeoutMs) {
    const t0 = performance.now();
    const rec = await timeout(Lens.recognize(img), timeoutMs);
    const prodOnly = { decision: rec.decision, reason: rec.reason, candidates: rec.candidates.slice() };
    const clip = await timeout(ClipLens.recognize(rec.image, rec), timeoutMs);
    const h = ClipLens.hybridDecision(rec, clip, Lens.CFG);
    rec.candidates = h.candidates; rec.decision = h.decision; rec.reason = h.reason;
    rec.debug.decision = h.decision + (h.reason === 'disagree' ? ' (lenses disagree)' : h.reason === 'second-opinion' ? ' (second opinion)' : '');
    const ms = Math.round(performance.now() - t0), backends = { lens: Lens.status.backend, clip: ClipLens.status.info.backend };
    rec.debug.engine = { id: ENGINE_ID, backends, totalMs: ms };
    perfAdd({ t: Date.now(), ms, lensMs: rec.debug.times && rec.debug.times.total, clipMs: clip.totalMs, clipInferMs: clip.inferMs, crops: clip.regions.length, backends });
    return { rec, prodOnly, clip, ms };
  }

  // developer testing only (same models, reloads the engine):
  //   setForceCPU — the detector/classifier on TF.js's CPU backend instead of WebGL (TinyCLIP is on the CPU anyway)
  //   setClipGPU  — TinyCLIP on WebGPU, to compare speed and results with the standard CPU path
  const reload = () => { ClipLens.reset(); Lens.reset && Lens.reset(); Object.assign(st, { state: 'idle', backends: {} }); emit(); };
  function setForceCPU(on) { Lens.CFG.forceCPU = !!on; reload(); }
  function setClipGPU(on) { ClipLens.CFG.backend = on ? 'webgpu' : 'wasm'; reload(); }
  async function clearCache() {
    try { await caches.delete('snapmon-models-v1'); } catch (e) {}
    try { await Lens.clearCache(); } catch (e) {}
    reload();
  }

  return { load, recognize, check, recover, ready, downloadBytes, manifest, setForceCPU, setClipGPU, clearCache, perfLog, clearPerf: () => Platform.storage.remove(PERF_KEY), status: st, onChange: f => { listeners.add(f); return () => listeners.delete(f); }, ID: ENGINE_ID };
})();

</script>
<script>
/* SNAPMON — in-game Guide ("How to play"). Every number shown here is read from the game's own rule tables
   (MECH, STATUS_TURNS and RARITIES in game.js/data.js; FAMILIES, WEAPONS, ITEMS, RESEARCH, CHARMS in data.js),
   so the guide cannot drift from the rules: change a value there and the guide follows.
   Deliberately not shown: hidden safety nets the game does not advertise. */
'use strict';

const Guide = (() => {
  const SN = { poison: 'poison', burn: 'burn', stun: 'stun', defdown: 'DEF↓', atkup: 'ATK↑', defup: 'DEF↑', immune: 'immunity' };
  const pct = x => Math.round(x * 100) + '%';
  const pct1 = x => (Math.round(x * 1000) / 10) + '%';
  const T = STATUS_TURNS, X = MECH.status, C = MECH.capture, E = MECH.enc;
  const turns = n => n + (n === 1 ? ' turn' : ' turns');
  const el = id => `<span style="color:${ELEMENTS[id].color}">${ELEMENTS[id].name}</span>`;
  const famName = f => `<span style="color:${FAMILIES[f].color}">${FAMILIES[f].glyph} ${FAMILIES[f].name}</span>`;
  const weaponsWith = test => WEAPON_ORDER.filter(w => test(WEAPONS[w])).map(w => WEAPONS[w].name);
  // v0.4.5: monsters draw moves from their object's kit, so any kind of monster may use an effect: show example moves
  const kitMoves = Object.values(MOVE_KITS).flatMap(k => k.split(',').map(x => x.split(':').map(t => t.trim())));
  const familiesUsing = eff => [...new Set(kitMoves.filter(([, a]) => MOVE_ARCH[a].effect === eff).map(([n]) => n))].slice(0, 4).concat('…');
  const totalWeight = RARITIES.reduce((a, r) => a + r.weight, 0);

  const sections = [
    { id: 'hunt', title: 'Hunting & encounters', body: () => `
      <p>Photograph a real object with the Spirit Camera. The recognition engine runs on your phone and names the object; you can always reject a wrong answer before anything happens. Then the lens scans the object for a monster.</p>
      <ul>
        <li><b>Encounter chance:</b> ${pct(E.base)} per photo, <b>+${pct(E.newObj)}</b> for a kind of object you have never photographed, <b>+${pct(E.perMiss)}</b> for every quiet photo in a row.</li>
        <li>After <b>${E.pity}</b> quiet photos in a row the next new photo is a guaranteed encounter (${E.pitySensor} with the Paranormal Sensor research).</li>
        <li>Photographing the same kind of object three times in a row: <b>−${pct(E.sameObj)}</b>. The same view again: chance × ${E.dupMult}. Explore!</li>
        <li>Wide-Angle and Night Vision lenses (research) add <b>+${pct(E.lens)}</b> each.</li>
        <li>Your first ever monster is always a gentle Common one.</li>
      </ul>` },
    { id: 'combat', title: 'Combat basics', body: () => `
      <p>Battles are turn-based: you act, then the monster acts. Each turn you can <b>Attack</b>, use your weapon's <b>Special</b>, use an <b>Item</b>, throw a <b>Snap Trap</b> or try to <b>Flee</b>. Using an item takes your turn.</p>
      <ul>
        <li><b>Damage</b> = attack × move power × 25 ÷ (25 + defence), varying ±10%. Defence never blocks everything: every hit does at least 1.</li>
        <li><b>Who goes first:</b> you, unless the monster's speed is more than ${MECH.firstStrike}× yours.</li>
        <li><b>Hitting:</b> each weapon has an accuracy; you lose 1 percentage point for every point of speed the monster has over you. The Pistol never misses.</li>
        <li><b>Dodging:</b> you dodge a monster's hit ${pct(MECH.enemy.dodgeBase)} of the time, ${pct(MECH.enemy.dodgePerSpd)} more (or less) per point of speed you have over (or under) it, at most ${pct(MECH.enemy.dodgeMax)}.</li>
        <li><b>Critical hits:</b> yours depend on the weapon (and charms); a monster crits ${pct(MECH.enemy.crit)} of the time for ×${MECH.enemy.critX} damage.</li>
        <li><b>Monster abilities:</b> each monster has a signature move plus more moves from its object's own move set the rarer it is (a drink fights like a drink, a spoon like kitchenware). Every Legendary is unique: its title, a legend move and its Ultimate carry its object's name. After use, a move needs a few turns to recharge. A monster that can heal does so when below ${pct(MECH.enemy.healBelow)} HP.</li>
      </ul>` },
    { id: 'types', title: 'Damage types, weaknesses & resistances', body: () => `
      <p>Every weapon deals one damage type. Hitting a weakness does <b>×${MECH.weak}</b> damage ("super effective"); a resistance takes only <b>×${MECH.resist}</b>. A monster's family decides its weaknesses.</p>
      <div class="guide-table"><table><tr><th>Family</th><th>Weak to (×${MECH.weak})</th><th>Resists (×${MECH.resist})</th></tr>
      ${Object.keys(FAMILIES).map(f => `<tr><td>${famName(f)}</td><td>${FAMILIES[f].weak.map(el).join(', ')}</td><td>${FAMILIES[f].resist.map(el).join(', ') || '–'}</td></tr>`).join('')}</table></div>
      <p class="small muted">Weapons: ${WEAPON_ORDER.map(w => `${WEAPONS[w].name} = ${el(WEAPONS[w].el)}`).join(' · ')}. The family is shown next to every monster's name.</p>` },
    { id: 'status', title: 'Status effects', body: () => `
      <p>Effects tick and count down at the <b>start of the affected creature's turn</b>; "Lasts" below says what that means in practice. The same effect does not stack: applying it again only resets its timer (to the longer of the two). Different effects can be active at the same time.</p>
      <div class="guide-cards">
        ${statusCard('POISON', 'poison', `Loses ${pct(X.poisonPct)} of max HP (at least ${X.poisonMin}) at the start of each of its turns.`, `damage at the start of its next ${turns(T.poison)}`, `Cured by an Antidote. On a monster it adds +${pct(C.dot)} capture chance.`, [`Monster moves such as ${familiesUsing('poison').join(', ')}`, `Weapons: Cursed Dagger hits (${pct(WEAPONS.dagger.poison)}, only if not already poisoned) and Hex Flurry`])}
        ${statusCard('BURN', 'burn', `Loses ${pct(X.burnPct)} of max HP + ${X.burnFlat} at the start of each of its turns, and deals ${pct(1 - X.burnAtk)} less damage.`, `damage at the start of its next ${turns(T.burn)}; weaker attacks for its next ${T.burn - 1}`, `Cured by an Antidote. On a monster it adds +${pct(C.dot)} capture chance (not added again if also poisoned).`, [`Monster moves such as ${familiesUsing('burn').join(', ')}`, `Weapons: Arcane Wand special (Arcane Nova)`])}
        ${statusCard('STUN', 'stun', 'Loses its next turn.', T.stun === 1 ? 'its next turn' : `its next ${turns(T.stun)}`, `No cure: it wears off after one turn. A stunned monster is ${pct(X.stunAcc)} easier to hit and +${pct(C.stun)} easier to capture.`, [`Monster moves such as ${familiesUsing('stun').join(', ')}`, `Weapons: Thunder Hammer hits (${pct(WEAPONS.hammer.stun)}) and Thunderclap`])}
        ${statusCard('DEF↓', 'defdown', `Defence is halved (×${X.defdown}): it takes more damage.`, `the opponent's next ${T.defdown - 1} attacks against it`, 'Cured by an Antidote.', [`Monster moves such as ${familiesUsing('defdown').join(', ')}`, `Weapons: Rusty Hunter Sword special (Rusty Cleave)`])}
        ${statusCard('ATK↑', 'atkup', `Deals ×${X.atkup} damage.`, `its next ${T.atkup - 1} attacks`, 'Yours comes from a Strength Potion; monsters may power themselves up too.', [`Monster moves such as ${familiesUsing('atkup').join(', ')}`])}
        ${statusCard('DEF↑', 'defup', `Defence ×${X.defup}: takes less damage.`, `the opponent's next ${T.defup} attacks`, 'Yours comes from a Defense Potion; some monsters raise their own defence.', [`Monster moves such as ${familiesUsing('defup').join(', ')}`])}
        ${statusCard('IMMUNE', 'immune', 'Cannot be poisoned, burned, stunned or weakened (DEF↓).', `the monster's next ${turns(T.immune)}`, 'Given by an Antidote, together with the cure and +10 HP.', [])}
      </div>
      <p class="small muted">Example: your attack poisons a monster. It then loses HP at the start of each of its next ${T.poison} turns, and the poison is gone.</p>` },
    { id: 'energy', title: 'Energy & weapon specials', body: () => `
      <p>You start each battle with <b>${MECH.energy.start} energy</b> (+${MECH.energy.battery} with the Spare Battery charm). Every normal attack adds <b>+${MECH.energy.perAttack}</b> (up to ${MECH.energy.max}). A Special spends energy for a powerful move:</p>
      <div class="guide-table"><table><tr><th>Weapon</th><th>Normal attack</th><th>Special (cost)</th></tr>
      ${WEAPON_ORDER.map(w => { const W = WEAPONS[w], sp = W.special; return `<tr><td>${W.name}<br><span class="muted small">${el(W.el)}</span></td><td class="small">${W.hits ? W.hits + ' hits × ' + pct(W.hitPow) : '1 hit'} · accuracy ${pct(W.acc)} · crit ${pct(W.crit)} (×${W.critX})${W.pierce ? ` · ignores ${pct(W.pierce)} of defence` : ''}${W.poison ? ` · ${pct(W.poison)} poison` : ''}${W.stun ? ` · ${pct(W.stun)} stun` : ''}</td><td class="small"><b>${sp.name}</b> (${sp.cost}): ${pct(sp.power)} power${sp.hits ? ' × ' + sp.hits + ' hits' : ''}${sp.sure ? ', never misses' : ''}${sp.effect ? `, ${pct(sp.chance || 1)} ${SN[sp.effect]}` : ''}</td></tr>`; }).join('')}</table></div>
      <p class="small muted">Each upgrade level in the Arsenal adds 15% to the weapon's attack.</p>` },
    { id: 'capture', title: 'Capturing monsters', body: () => `
      <p>Throw a <b>Snap Trap</b> (uses one trap and your turn). Captured monsters join your collection and can become your hunting buddy.</p>
      <ul>
        <li>The base chance depends on rarity (below) and <b>rises as the monster's HP falls</b>: at full HP you get only ${pct(1 - C.hpWeight)} of the base chance, near 0 HP almost all of it.</li>
        <li><b>Stunned:</b> +${pct(C.stun)} · <b>poisoned or burning:</b> +${pct(C.dot)} · <b>Capture Enhancer:</b> +${pct(C.enhancer)} for the battle · <b>Reinforced / Quantum Traps</b> research: +${pct(C.research)} each · <b>Spirit Lens Cap</b> charm: +${pct(C.lenscap)}.</li>
        <li>Variants (Spectral, Mutated, Prismatic) are harder: chance × ${C.variantMult}.</li>
        <li>The chance is always between ${pct(C.min)} and ${pct(C.max)}. Epic and Legendary monsters may break free and vanish after ${C.escapeAfter} failed traps (${pct(C.escapeChance)} each time).</li>
        <li>With Quantum Traps, a failed trap comes back ${pct(C.quantumRefund)} of the time. Monster Analysis research shows the exact odds in battle.</li>
      </ul>` },
    { id: 'rarity', title: 'Rarity', body: () => `
      <p>When a monster appears, its rarity is rolled. The object you photographed does not change these odds.</p>
      <div class="guide-table"><table><tr><th>Rarity</th><th>Chance</th><th>Stats</th><th>Base capture</th><th>Level vs you</th><th>Rewards</th></tr>
      ${RARITIES.map(r => `<tr><td style="color:${r.color}"><b>${r.name}</b></td><td>${pct1(r.weight / totalWeight)}</td><td>×${r.mult} (HP ×${r.hpMult})</td><td>${pct(r.capture)}</td><td>${r.lvl[0] === r.lvl[1] ? (r.lvl[0] ? '+' + r.lvl[0] : 'same') : `+${r.lvl[0]} to +${r.lvl[1]}`}</td><td>×${r.xp}</td></tr>`).join('')}</table></div>
      <ul class="small"><li>Research: the Ectoplasmic Lens makes Rare, Epic and Legendary 40% more likely; the Legend Tracker doubles Legendary odds.</li>
        <li>Rarer monsters know more abilities; each Legendary also has its own unique title, legend move and Ultimate.</li>
        <li>Variants (unlocked by research): Spectral and Mutated forms (9% each) change the monster's family; Prismatic colours (1 in 12) give +8% stats and double coins.</li></ul>` },
    { id: 'levels', title: 'Levels & scaling', body: () => `
      <ul>
        <li>Win or capture to earn XP. Each hunter level: <b>+12 max HP, +2 attack, +1 defence, +1 speed</b>. A second charm slot opens at level 5.</li>
        <li>Monsters appear at about your level, higher for rarer ones (table above). Below level 3, monsters are at most one level above you; Commons are sometimes one level below.</li>
        <li>XP needed for the next level grows with each level.</li>
      </ul>` },
    { id: 'rewards', title: 'Rewards, defeat & healing', body: () => `
      <ul>
        <li><b>Victory:</b> XP, coins and materials (more for rarer, higher-level monsters); sometimes a potion or trap, a new weapon or a charm. You recover ${pct(MECH.afterWin)} of your max HP.</li>
        <li><b>Capture:</b> slightly less XP, half the coins and materials, but you keep the monster. First capture of a species: +3 RP.</li>
        <li><b>New species discovered:</b> research points (more for rare finds).</li>
        <li><b>Defeat:</b> you lose ${pct(MECH.defeatCoins)} of your coins and wake up with ${pct(MECH.defeatHp)} HP. Monsters are never lost.</li>
        <li><b>Fleeing:</b> ${pct(MECH.flee.base)} chance, +${pct(MECH.flee.perSpd)} per point of speed over the monster's, +${pct(MECH.flee.slipper)} with Haste Slippers, −${pct(MECH.flee.legendary)} against Legendaries (between ${pct(MECH.flee.min)} and ${pct(MECH.flee.max)}). A Smoke Bomb always works.</li>
        <li><b>Resting:</b> you heal ${pct(MECH.regenPerMin)} of your max HP per minute between battles.</li>
      </ul>` },
    { id: 'items', title: 'Items', body: () => `
      <div class="guide-table"><table><tr><th>Item</th><th>Effect</th><th>Shop</th></tr>
      ${ITEM_ORDER.map(id => `<tr><td>${ITEMS[id].name}</td><td class="small">${ITEMS[id].desc}${id === 'antidote' ? ` Also immunity for the monster's next ${turns(T.immune)}.` : ''}</td><td class="small">${ITEMS[id].price} coins</td></tr>`).join('')}</table></div>
      <p class="small muted">Items can also be crafted from materials in Gear → Shop &amp; Craft. Field Medicine research makes healing potions 30% stronger.</p>` },
    { id: 'gear', title: 'Gear, charms & hunting buddy', body: () => `
      <ul>
        <li><b>Weapons</b> unlock with coins and materials (or drop from beaten monsters) and can be upgraded up to level 5 (8 with Master Smithing).</li>
        <li><b>Charms</b> drop from beaten monsters; equip up to your slot count: ${CHARM_ORDER.map(c => `${CHARMS[c].name} (${CHARMS[c].desc.toLowerCase()})`).join(', ')}.</li>
        <li><b>Hunting buddy:</b> one captured monster can follow you, adding 8% of its HP and 12% of its attack and defence to yours.</li>
      </ul>` },
    { id: 'research', title: 'Research', body: () => `
      <p>Spend research points (RP) in the Lab. Some research needs an earlier one first.</p>
      <div class="guide-table"><table><tr><th>Research</th><th>RP</th><th>Effect</th></tr>
      ${RESEARCH.map(r => `<tr><td>${r.name}</td><td>${r.cost}</td><td class="small">${r.desc}${r.req ? ` <span class="muted">(needs ${RESEARCH_BY_ID[r.req].name})</span>` : ''}</td></tr>`).join('')}</table></div>` },
  ];

  function statusCard(label, cls, does, lasts, counter, sources) {
    return `<div class="guide-status"><span class="st ${cls}">${label}</span><div class="small"><b>Effect:</b> ${does}<br><b>Lasts:</b> ${lasts}<br><b>Counter:</b> ${counter}${sources.length ? `<br><span class="muted">${sources.join(' · ')}</span>` : ''}</div></div>`;
  }
  // accordion: each section expands on its own; the open one is remembered while the guide is open
  function html(open) {
    return `<div class="sheet-head"><h2>Guide</h2><button class="btn small ghost" data-act="closeSheet">Close</button></div>
      <p class="small muted" style="margin:0">How SNAPMON works. Numbers come straight from the game's rules.</p>
      ${sections.map(s => `<details class="guide-sec" data-sec="${s.id}"${s.id === open ? ' open' : ''}><summary>${s.title}</summary><div class="guide-body">${s.body()}</div></details>`).join('')}`;
  }
  return { html, sections };
})();

</script>
<script>
/* SNAPMON — user interface: screens, photo flow, discovery, battle playback, collection, gear, research, settings. */
'use strict';

let S = loadState();
const ui = { tab: 'hunt', dexView: 'captured', fR: 'all', fF: 'all', gearTab: 'arsenal', labTab: 'research', battle: null, busy: false, pending: null, lastSightings: [] };
const $ = sel => document.querySelector(sel);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const wait = ms => new Promise(r => setTimeout(r, ms));
const fmtDate = t => t ? new Date(t).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : '—';
let saveTimer = null;
function persist(now) {
  if (ui.testSnapshot) return; // a developer test battle is running: the real save is restored afterwards, never overwritten
  clearTimeout(saveTimer); if (now) saveState(S); else saveTimer = setTimeout(() => saveState(S), 250);
}
SFX.setMuted(S.settings.muted);

const ICON = {
  hunt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  dex: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><circle cx="12" cy="8.5" r="1.6" fill="currentColor"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14.5 4.5 19.5 4.5 19.5 9.5 9 20l-3-3z"/><path d="M5 14l5 5M3.5 20.5l2-2"/></svg>',
  lab: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3"/><path d="M7.5 15h9"/></svg>',
  sound: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
  mute: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>',
  cog: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>',
  gallery: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="15.5" cy="8.5" r="1.5"/></svg>',
  live: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3z"/></svg>',
};

/* ---------- toasts ---------- */
function toast(msg, kind = '') {
  const el = document.createElement('div'); el.className = 'toast ' + kind; el.textContent = msg;
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), 3200);
}

/* ---------- helpers for sprites ---------- */
function spriteHTML(dna, { size = 160, rarity = 'common', variant = null, cls = '' } = {}) {
  const tier = RARITY[rarity].tier;
  const sparks = tier >= 3 || variant === 'shiny' ? [0, 1, 2, 3, 4].map(i => `<i class="spark" style="left:${10 + i * 19}%;top:${20 + (i % 3) * 22}%;animation-delay:${i * 0.45}s"></i>`).join('') : '';
  return `<div class="sprite ${variant || ''} ${dna.shape === 'cloth' || dna.shape === 'key' || variant === 'spectral' ? 'hover' : ''} ${cls}" style="--rc:${RARITY[rarity].color};width:${size}px;max-width:100%">
    ${tier >= 2 || variant ? '<i class="aura"></i>' : ''}${sparks}<img class="px" alt="" src="${spriteURL(dna, 5)}" style="width:100%"></div>`;
}
const rarityChip = r => `<span class="chip r" style="color:${RARITY[r].color}">${RARITY[r].name.toUpperCase()}</span>`;
const famChip = f => `<span class="chip" style="color:${FAMILIES[f].color}">${FAMILIES[f].glyph} ${FAMILIES[f].name}</span>`;
const varChip = v => v ? `<span class="chip" style="color:var(--violet)">${variantLabel(v)}</span>` : '';
function monsterTitle(m) { return m.nick ? esc(m.nick) : esc(m.name); }
function catLabel(m) { return m.obj && OBJECTS[m.obj] ? esc(OBJECTS[m.obj].name) : m.cat === 'other' && m.word ? `“${esc(m.word)}”` : esc(CATEGORY[m.cat].name); }
// honest description of how specific a monster's look is (see objectTier in objects.js)
function designLine(obj) {
  const o = OBJECTS[obj], t = objectTier(o);
  if (!o) return 'Generic oddity design.';
  return { dedicated: `Specific ${esc(o.name.toLowerCase())} design.`, composed: `${esc(o.name)} design built from shared parts.`,
    related: `Shares the ${esc(visualSource(o).name.toLowerCase())} design.`, family: `General ${esc(CATEGORY[o.cat].name.split(' /')[0].toLowerCase())} design (no specific ${esc(o.name.toLowerCase())} look yet).` }[t];
}

/* ---------- top bar & tabs ---------- */
function renderTop() {
  regen(S);
  const hs = hunterStats(S), need = xpFor(S.level), hpPct = S.hp / hs.maxHp * 100;
  $('#topbar').innerHTML = `
    <div class="lvl-badge" aria-label="Hunter level ${S.level}"><div><span>LV</span><b>${S.level}</b></div></div>
    <div class="bars">
      <div class="bar-row"><span class="lbl">HP</span><div class="bar hp ${hpPct > 40 ? 'ok' : ''}"><i style="width:${hpPct}%"></i></div><span class="val">${S.hp}/${hs.maxHp}</span></div>
      <div class="bar-row"><span class="lbl">XP</span><div class="bar xp"><i style="width:${S.xp / need * 100}%"></i></div><span class="val">${S.xp}/${need}</span></div>
    </div>
    <div class="top-right">
      <div class="wallet"><span class="c">${S.coins}¢</span><span class="r">${S.rp} RP</span></div>
      <button class="icon-btn" data-act="mute" aria-label="${S.settings.muted ? 'Unmute sound' : 'Mute sound'}">${S.settings.muted ? ICON.mute : ICON.sound}</button>
      <button class="icon-btn guide-btn" data-act="guide" aria-label="Guide: how to play">?</button>
      <button class="icon-btn" data-act="settings" aria-label="Settings and save data">${ICON.cog}</button>
    </div>`;
}
function claimableQuests() { return activeQuests(S).filter(q => questProgress(S, q) >= q.target).length; }
function renderTabs() {
  const tabs = [['hunt', 'Hunt'], ['dex', 'Monsters'], ['gear', 'Gear'], ['lab', 'Lab']];
  const dot = { lab: claimableQuests() > 0 || RESEARCH.some(r => !S.research[r.id] && S.rp >= r.cost && (!r.req || S.research[r.req])) };
  $('#tabs').innerHTML = tabs.map(([id, label]) => `<button class="${ui.tab === id ? 'on' : ''}" data-act="tab" data-arg="${id}" aria-current="${ui.tab === id}">${ICON[id]}${label}${dot[id] ? '<i class="dot"></i>' : ''}</button>`).join('');
}
function render() {
  renderTop(); renderTabs();
  const el = $('#screen');
  el.innerHTML = ({ hunt: huntScreen, dex: dexScreen, gear: gearScreen, lab: labScreen })[ui.tab]();
  el.classList.remove('screen-enter'); void el.offsetWidth; el.classList.add('screen-enter');
}

/* ---------- HUNT ---------- */
function huntScreen() {
  const hs = hunterStats(S), low = S.hp < hs.maxHp * 0.35;
  const quests = activeQuests(S);
  const ghost = S.monsters.length ? S.monsters[S.monsters.length - 1].dna : null;
  const live = false;
  return `${saveBlockedHTML()}
  <section class="viewfinder" id="vf">
    ${live ? '<video id="liveVideo" autoplay playsinline muted></video>' : ''}
    ${ghost && !live ? `<img class="vf-ghost px" alt="" src="${spriteURL(ghost, 3)}">` : ''}
    <i class="vf-corner tl"></i><i class="vf-corner tr"></i><i class="vf-corner bl"></i><i class="vf-corner br"></i><i class="vf-sweep"></i>
    ${live ? '' : `<div class="vf-center"><div><h1>Monsters hide <em>in plain sight</em></h1>
      <p>${S.stats.photos === 0 ? 'Photograph a real object near you — a mug, a shoe, a plant — and the Spirit Lens will reveal what lives inside it.' : 'Explore. Unusual objects hide unusual monsters.'}</p></div></div>`}
    <div class="vf-hud"><span class="rec">SPIRIT CAM</span><span>${S.stats.photos} SNAPS · ${Object.keys(S.dex).length} OBJECTS</span></div>
  </section>
  <div class="shutter-row">
    <button class="side-btn" data-act="tab" data-arg="dex"><span class="ic">${ICON.dex}</span>Monsters</button>
    ${snapButtonHTML()}
    <button class="side-btn" data-act="tab" data-arg="lab"><span class="ic">${ICON.lab}</span>Orders</button>
  </div>
  ${lensChipHTML()}
  ${quickTest() ? '<div class="test-banner" style="text-align:center">QUICK MONSTER TEST MODE IS ON · test monsters only, nothing is saved to your collection</div>' : ''}
  ${low ? `<div class="card warn row"><div class="grow"><b>You're badly hurt.</b><div class="small muted">Monsters hit hard. Heal up before your next hunt — you also recover slowly over time.</div></div>
    ${S.items.potion ? `<button class="btn small" data-act="quickHeal">Drink potion (${S.items.potion})</button>` : `<button class="btn small" data-act="tab" data-arg="gear">Shop</button>`}</div>` : ''}
  <section class="card">
    <div class="section-title"><h2>Hunter's orders</h2><span class="small muted">${Object.keys(S.questsClaimed).length}/${QUESTS.length} done</span></div>
    ${quests.length ? quests.map(questHTML).join('') : '<p class="muted">Every order is complete. You are a legend of the hunt.</p>'}
  </section>
  ${ui.lastSightings.length ? `<section class="stack"><div class="section-title"><h2>Recent sightings</h2></div>
    <div class="sightings">${ui.lastSightings.map(s => `<div class="sighting"><img class="px" alt="" src="${spriteURL(s.dna, 3)}">${esc(s.name.split(',')[0])}<br><span style="color:${RARITY[s.rarity].color}">${s.outcome}</span></div>`).join('')}</div></section>` : ''}
  <p class="notice">Your photos stay on this phone. The Spirit Lens recognises objects on-device, then the image is thrown away.</p>`;
}
function saveBlockedHTML() {
  if (!saveBlocked) return '';
  const why = saveBlocked.reason === 'newer' ? `Your saved progress was made by a newer SNAPMON (save format ${saveBlocked.version}) than this one (format ${SAVE_VERSION}). This usually means the game was rolled back to an older version.`
    : 'Your saved progress could not be read.';
  return `<div class="card warn stack"><b>Saved progress not loaded</b><p class="small" style="margin:0">${why} It has <b>not</b> been changed or deleted: this session will not save over it. Open Settings to copy it as a backup code.</p></div>`;
}
function questHTML(q) {
  const p = questProgress(S, q), done = p >= q.target;
  const rw = Object.entries(q.reward).map(([k, v]) => rewardLabel(k, v)).join(', ');
  return `<div class="quest"><h3>${esc(q.name)}</h3>${done ? `<button class="btn small primary" data-act="claim" data-arg="${q.id}">Claim</button>` : `<span class="small muted num">${p}/${q.target}</span>`}
    <p>${esc(q.desc)} <span style="color:var(--flash)">· ${esc(rw)}</span></p><div class="bar"><i style="width:${p / q.target * 100}%"></i></div></div>`;
}

/* ---------- photo flow ---------- */
/* ---------- live camera (the only way to hunt: no gallery, no file upload) ---------- */
async function openCamera() {
  closeSheet();
  if (ui.cameraOpening || Platform.camera.isOpen()) return; // double taps
  // first hunt on this phone: say once what will be downloaded (this is information, not a choice of recogniser)
  if (snapState() === 'download' && !ui.engineNoticeOk) return showEngineNotice();
  // the camera opens only with a ready engine; "Snap another" buttons on result screens wait on the loading screen
  if (!Engine.ready()) { if (Engine.status.state === 'failed') return showEngineFailed(null, Engine.status.kind); return showEngineLoading(openCamera); }
  ui.cameraOpening = true; ui.snapping = false;
  const t0 = performance.now(), blocks = watchMainThread();
  $('#overlay').innerHTML = `<div class="overlay camera"><div class="overlay-inner cam-inner">
    <div class="sheet-head"><h2>Spirit Camera</h2><button class="btn small ghost" data-act="camClose">Close</button></div>
    <div class="cam-frame" id="camFrame"><video id="camVideo" autoplay playsinline muted></video><i class="vf-corner tl"></i><i class="vf-corner tr"></i><i class="vf-corner bl"></i><i class="vf-corner br"></i><i class="vf-sweep"></i>
      <div class="cam-status" id="camStatus"><span><i class="spin"></i> Starting camera…</span></div></div>
    <div class="zoom-row" id="zoomRow" hidden><button class="btn small ghost" data-act="camZoom" data-arg="-" aria-label="Zoom out">−</button>
      <input type="range" id="zoomRange" aria-label="Zoom" min="1" max="3" step="0.1" value="1"><button class="btn small ghost" data-act="camZoom" data-arg="+" aria-label="Zoom in">+</button><span class="small num" id="zoomVal">1.0×</span></div>
    <p class="small" id="camLensHint" style="text-align:center;margin:0;color:var(--flash)" hidden></p>
    <p class="muted small" style="text-align:center;margin:0">Fill the frame with one real object. The photo is analysed on this phone and never saved.</p>
    <div class="cam-controls"><button class="shutter" id="camShutter" data-act="camSnap" aria-label="Take photo" disabled>SNAP</button></div>
  </div></div>`;
  const v = $('#camVideo');
  try {
    await Platform.camera.open(v); // resolves once the preview is really showing frames
    ui.cameraOpening = false;
    if ($('#camVideo') !== v) { Platform.camera.close(v); return; } // closed (or reopened) while starting
    const st = $('#camStatus'); if (st) st.remove();
    syncShutter();
    setupZoom(v);
    ui.camStartMs = Math.round(performance.now() - t0);
    setTimeout(() => { ui.camLongestBlock = blocks.stop(); }, 1500);
  } catch (e) { ui.cameraOpening = false; blocks.stop(); Platform.camera.close(v); if ($('#camVideo') === v) showCameraError(e); }
}
/* Main-thread blocks while the camera starts (Chrome's Long Tasks API). A frozen or blank viewfinder for about a second
   means something held the main thread; the longest block is shown in the developer panel next to the camera time. */
function watchMainThread() {
  let longest = 0, obs = null;
  try { obs = new PerformanceObserver(list => { for (const e of list.getEntries()) longest = Math.max(longest, Math.round(e.duration)); }); obs.observe({ type: 'longtask', buffered: false }); } catch (e) { obs = null; }
  return { stop() { try { obs && obs.disconnect(); } catch (e) {} obs = null; return longest; } };
}
// zoom controls: buttons, slider and two-finger pinch on the viewfinder; hidden if the camera offers no zoom at all
function setupZoom(v) {
  const z = Platform.camera.zoomInfo(), row = $('#zoomRow'), range = $('#zoomRange'), frame = $('#camFrame');
  if (!row || !z || z.max <= z.min) return;
  Object.assign(range, { min: z.min, max: z.max, step: z.step, value: z.value });
  row.hidden = false; row.dataset.kind = z.kind;
  let busy = false, want = null;
  const apply = async val => {
    want = val; if (busy) return; busy = true;
    try { while (want != null) { const x = want; want = null; const got = await Platform.camera.setZoom(x, v); range.value = got; $('#zoomVal').textContent = (got / z.min).toFixed(1) + '×'; } }
    catch (e) { /* the camera refused this zoom level: keep the previous one */ }
    busy = false;
  };
  ui.camZoom = { info: z, apply, get value() { return +range.value; } };
  range.addEventListener('input', () => apply(+range.value));
  let pinch = null;
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  frame.addEventListener('touchstart', e => { if (e.touches.length === 2) pinch = { d: dist(e.touches), z: +range.value }; }, { passive: true });
  frame.addEventListener('touchmove', e => { if (pinch && e.touches.length === 2) { e.preventDefault(); apply(pinch.z * dist(e.touches) / pinch.d); } }, { passive: false });
  frame.addEventListener('touchend', e => { if (e.touches.length < 2) pinch = null; });
}
function showCameraError(e) {
  const d = Platform.camera.describe(e);
  $('#overlay').innerHTML = `<div class="overlay"><div class="overlay-inner" style="justify-content:center;text-align:center;gap:14px">
    <h2 style="font-size:26px">${esc(d.title)}</h2><p>${esc(d.text)}</p>
    <p class="small muted">Hunting needs the live camera. Saved photos cannot be used.</p>

/* ---------- recognition flow: photo → Hybrid engine → (pick among AI suggestions) → encounter scan ----------
   There is no manual entry: only objects the engine actually recognised can be hunted. */
function beginIdentify(img, url, tSnap = performance.now()) {
  const hash = Photo.analyze(img).hash; // whole-photo similarity fingerprint (repeat-photo detection)
  ui.pending = { img, url, hash, thumb: S.settings.keepPhotos ? Photo.thumbnail(img) : null, rec: null, t0: Date.now(), tSnap };
  recognizeFlow();
}
/* v0.4.4: the Analysing screen (with the photo just taken) must be ON SCREEN before recognition starts. With the
