<title>SNAPMON: Monsters Among Us</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#110d1b">
<meta name="description" content="Photograph real objects to reveal the monsters hiding inside them. Fight, capture and collect.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Chakra+Petch:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app — status bar, scrolling screen, fixed thumb-reach tab bar; battles and scans take over the screen. */
:root {
  --ink: #110d1b; --panel: #1b1530; --panel-2: #251d40; --line: #3a2f5e; --text: #f1ecff; --muted: #a79dc9;
  --ecto: #7cf5d3; --flash: #ffcf5a; --danger: #ff5d73; --good: #62d87a; --violet: #a68bff;
  --r-common: #a9b4c6; --r-uncommon: #62d87a; --r-rare: #4fb0ff; --r-epic: #c977ff; --r-legendary: #ffbe3b;
  --font-display: 'Pixelify Sans', 'Courier New', monospace;
  --font-body: 'Chakra Petch', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --tabbar: 64px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--text); font: 15px/1.45 var(--font-body); overscroll-behavior: none; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ecto); outline-offset: 2px; }
img.px, canvas.px { image-rendering: pixelated; image-rendering: crisp-edges; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: 0.02em; }
h3 { font-family: var(--font-body); letter-spacing: 0; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }

#app { max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; position: relative;
  background: radial-gradient(120% 60% at 50% -10%, #2a1f4d 0%, transparent 60%), var(--ink); }

/* ---- top status bar ---- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center;
  padding-block: 10px 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(var(--ink) 70%, transparent); }
.lvl-badge { width: 44px; height: 44px; border-radius: 12px; background: var(--panel-2); border: 2px solid var(--line); display: grid; place-items: center; font-family: var(--font-body); font-weight: 700; line-height: 1; text-align: center; }
.lvl-badge b { font-size: 18px; display: block; } .lvl-badge span { font-size: 9px; color: var(--muted); letter-spacing: .12em; }
.bars { display: grid; gap: 5px; min-width: 0; }
.bar { height: 10px; border-radius: 6px; background: #0b0814; border: 1px solid var(--line); overflow: hidden; position: relative; }
.bar > i { position: absolute; inset: 0 auto 0 0; border-radius: 5px; transition: width .35s ease; }
.bar.hp > i { background: linear-gradient(90deg, #ff5d73, #ff9a6b); }
.bar.hp.ok > i { background: linear-gradient(90deg, #45d07a, #a6f07a); }
.bar.xp > i { background: linear-gradient(90deg, #7a5cff, #7cf5d3); }
.bar.en > i { background: linear-gradient(90deg, #ffb13b, #ffe55c); }
.bar-row { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); }
.bar-row .bar { flex: 1; }
.bar-row .lbl { width: 22px; font-weight: 700; letter-spacing: .06em; }
.bar-row .val { min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
.top-right { display: flex; gap: 6px; align-items: center; }
.wallet { display: grid; justify-items: end; font-size: 12px; line-height: 1.25; font-variant-numeric: tabular-nums; }
.wallet .c { color: var(--flash); font-weight: 700; } .wallet .r { color: var(--ecto); font-weight: 700; }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; padding: 0; }
.icon-btn svg { width: 20px; height: 20px; }

/* ---- screens ---- */
main#screen { flex: 1; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 4px calc(var(--tabbar) + 24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
.screen-enter { animation: screenIn .28s ease both; }
@keyframes screenIn { from { opacity: .3; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.section-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.section-title h2 { font-size: 20px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

.btn { border: none; border-radius: 12px; padding: 12px 16px; font-weight: 700; letter-spacing: .02em; background: var(--panel-2); border: 1px solid var(--line); min-height: 46px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .08s ease, filter .15s; user-select: none; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--flash); color: #1b1206; border-color: transparent; }
.btn.ecto { background: var(--ecto); color: #062019; border-color: transparent; }
.btn.danger { background: var(--danger); color: #22060c; border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 36px; padding: 7px 12px; font-size: 13px; border-radius: 10px; }
.btn[disabled], .btn.disabled { opacity: .42; pointer-events: none; }
.btn.block { width: 100%; }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 9px; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; border: 1px solid var(--line); background: var(--panel-2); white-space: nowrap; }
.chip.r { border-color: currentColor; background: transparent; }
.seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: none; background: none; border-radius: 9px; padding: 9px 6px; font-weight: 700; color: var(--muted); }
.seg button.on { background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.chips-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips-scroll::-webkit-scrollbar { display: none; }
.fchip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--muted); }
.fchip.on { color: var(--ink); background: var(--text); border-color: var(--text); }

/* ---- hunt screen ---- */
.viewfinder { position: relative; aspect-ratio: 4 / 4.2; max-width: 100%; border-radius: 22px; overflow: hidden; background:
  radial-gradient(circle at 50% 45%, #1f3a3f 0%, #121022 55%, #0a0812 100%); border: 1px solid #2c4a52; isolation: isolate; }
.viewfinder::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(124,245,211,.05) 0 1px, transparent 1px 3px); pointer-events: none; z-index: 2; }
.vf-corner { position: absolute; width: 34px; height: 34px; border: 3px solid var(--ecto); z-index: 3; opacity: .85; }
.vf-corner.tl { top: 16px; left: 16px; border-right: 0; border-bottom: 0; border-radius: 8px 0 0 0; }
.vf-corner.tr { top: 16px; right: 16px; border-left: 0; border-bottom: 0; border-radius: 0 8px 0 0; }
.vf-corner.bl { bottom: 16px; left: 16px; border-right: 0; border-top: 0; border-radius: 0 0 0 8px; }
.vf-corner.br { bottom: 16px; right: 16px; border-left: 0; border-top: 0; border-radius: 0 0 8px 0; }
.vf-sweep { position: absolute; left: 0; right: 0; height: 40%; top: -40%; background: linear-gradient(transparent, rgba(124,245,211,.12) 85%, rgba(124,245,211,.5)); z-index: 2; animation: sweep 3.8s linear infinite; pointer-events: none; }
@keyframes sweep { to { top: 100%; } }
.vf-center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; z-index: 3; padding: 40px; }
.vf-center h1 { font-size: clamp(30px, 9vw, 44px); line-height: .95; color: var(--text); text-shadow: 0 0 18px rgba(124,245,211,.45); }
.vf-center h1 em { font-style: normal; color: var(--ecto); }
.vf-center p { margin: 10px auto 0; max-width: 26ch; color: #c9c0ea; }
.vf-hud { position: absolute; left: 22px; right: 22px; bottom: 22px; display: flex; justify-content: space-between; font: 600 11px var(--font-body); letter-spacing: .14em; color: var(--ecto); z-index: 3; opacity: .85; }
.vf-hud .rec::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--danger); margin-right: 6px; animation: blink 1.2s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.vf-ghost { position: absolute; z-index: 1; width: 120px; opacity: .08; filter: blur(1px) brightness(2); animation: drift 14s ease-in-out infinite alternate; }
@keyframes drift { from { transform: translate(-40px, 40px); } to { transform: translate(180px, 160px); } }
.viewfinder video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
.shutter-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; margin-top: -4px; }
.shutter { width: 96px; height: 96px; border-radius: 50%; border: 5px solid var(--text); background: radial-gradient(circle at 40% 35%, #fff3c4, var(--flash) 45%, #e59a1f); display: grid; place-items: center; cursor: pointer;
  box-shadow: 0 0 0 6px rgba(255,207,90,.15), 0 10px 30px rgba(255,170,40,.25); font: 700 15px var(--font-display); color: #2a1904; letter-spacing: .08em; position: relative; }
.shutter:active { transform: scale(.94); }
.shutter::after { content: ""; position: absolute; inset: -14px; border-radius: 50%; border: 2px solid rgba(255,207,90,.35); animation: pulse 2.2s ease-out infinite; }
@keyframes pulse { from { transform: scale(.85); opacity: 1; } to { transform: scale(1.15); opacity: 0; } }
.side-btn { justify-self: center; display: grid; justify-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); background: none; border: none; cursor: pointer; padding: 6px; }
.side-btn .ic { width: 48px; height: 48px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); display: grid; place-items: center; }
.side-btn svg { width: 22px; height: 22px; }
.quest { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.quest:first-of-type { border-top: 0; }
.quest h3 { font-size: 15px; } .quest p { margin: 0; font-size: 13px; color: var(--muted); grid-column: 1; }
.quest .bar { grid-column: 1 / -1; height: 7px; }
.quest .bar > i { background: var(--ecto); }
.warn { border-color: #6a2a3c; background: linear-gradient(90deg, #2c1424, var(--panel)); }
.sightings { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.sighting { flex: 0 0 auto; width: 76px; text-align: center; font-size: 11px; color: var(--muted); }
.sighting img { width: 64px; height: 64px; display: block; margin: 0 auto 2px; }

/* ---- tab bar ---- */
.tabs { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 520px; z-index: 6; display: grid; grid-template-columns: repeat(4, 1fr);
  background: rgba(17,13,27,.94); backdrop-filter: blur(10px); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabs button { height: var(--tabbar); border: none; background: none; display: grid; justify-items: center; align-content: center; gap: 3px; font-size: 11.5px; font-weight: 700; color: var(--muted); letter-spacing: .05em; position: relative; }
.tabs button svg { width: 24px; height: 24px; }
.tabs button.on { color: var(--ecto); }
.tabs button.on::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--ecto); }
.tabs .dot { position: absolute; top: 10px; right: calc(50% - 20px); width: 9px; height: 9px; border-radius: 50%; background: var(--flash); box-shadow: 0 0 0 2px var(--ink); }

/* ---- monster cards ---- */
.mgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.mcard { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 6px 9px; text-align: center; cursor: pointer; overflow: hidden; }
.mcard::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--rc) 28%, transparent), transparent 65%); pointer-events: none; }
.mcard img { width: 100%; max-width: 96px; aspect-ratio: 1; display: block; margin: 0 auto; position: relative; }
.mcard .nm { font-weight: 700; font-size: 12.5px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; position: relative; }
.mcard .sub { font-size: 11px; color: var(--muted); position: relative; }
.mcard.r-rare { border-color: color-mix(in srgb, var(--r-rare) 60%, var(--line)); }
.mcard.r-epic { border-color: color-mix(in srgb, var(--r-epic) 70%, var(--line)); box-shadow: 0 0 16px -6px var(--r-epic); }
.mcard.r-legendary { border-color: var(--r-legendary); box-shadow: 0 0 22px -6px var(--r-legendary); animation: legendGlow 2.4s ease-in-out infinite; }
@keyframes legendGlow { 50% { box-shadow: 0 0 30px -4px var(--r-legendary); } }
.mcard .badge { position: absolute; top: 6px; right: 6px; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 6px; background: var(--ecto); color: var(--ink); z-index: 1; }
.mcard .vbadge { position: absolute; top: 6px; left: 6px; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 6px; background: var(--violet); color: var(--ink); z-index: 1; }
.dex-row { display: grid; grid-template-columns: 92px repeat(5, minmax(0, 1fr)); gap: 6px; align-items: center; }
.dex-row .cat { font-size: 12px; font-weight: 600; line-height: 1.2; color: var(--muted); }
.dex-row .cat b { display: block; color: var(--text); font-size: 13px; }
.slot { aspect-ratio: 1; border-radius: 10px; background: #0d0a16; border: 1px solid var(--line); display: grid; place-items: center; position: relative; cursor: pointer; padding: 0; }
.slot img { width: 92%; }
.slot.locked { cursor: default; color: #3b3260; font: 700 16px var(--font-display); }
.slot::after { content: ""; position: absolute; bottom: 4px; left: 50%; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--rc); opacity: .9; }
.slot.caught { border-color: color-mix(in srgb, var(--rc) 70%, var(--line)); }

/* ---- sprite stage ---- */
.stage { position: relative; display: grid; place-items: center; }
.sprite { position: relative; display: grid; place-items: center; }
.sprite img { position: relative; z-index: 1; animation: idle 1.8s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes idle { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-4px) scale(1.02, .97); } }
.sprite.hover img { animation: floaty 2.6s ease-in-out infinite; }
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.sprite .aura { position: absolute; inset: -10%; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--rc) 55%, transparent) 0%, transparent 62%); animation: auraPulse 2s ease-in-out infinite; }
@keyframes auraPulse { 50% { transform: scale(1.12); opacity: .75; } }
.sprite .spark { position: absolute; width: 6px; height: 6px; background: var(--rc); z-index: 2; animation: sparkle 2.4s ease-in-out infinite; box-shadow: 0 0 8px var(--rc); }
@keyframes sparkle { 0%, 100% { opacity: 0; transform: translateY(10px) scale(.3); } 50% { opacity: 1; transform: translateY(-14px) scale(1); } }
.sprite.shiny img { filter: drop-shadow(0 0 6px #fff) saturate(1.3); }
.sprite.spectral img { opacity: .9; filter: drop-shadow(0 0 10px #9ff7ff); }
.shadow { width: 60%; height: 12px; border-radius: 50%; background: rgba(0,0,0,.45); margin-top: -10px; }

/* ---- overlays (scan, discovery, battle, results) ---- */
.overlay { position: fixed; inset: 0; z-index: 20; display: flex; justify-content: center; background: rgba(8,6,14,.86); backdrop-filter: blur(4px); animation: fadeIn .2s ease; }
@keyframes fadeIn { from { opacity: 0; } }
.overlay-inner { width: 100%; max-width: 520px; height: 100%; display: flex; flex-direction: column; overflow-y: auto;
  padding-top: max(14px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 14px; }
.overlay-inner > * { flex-shrink: 0; }
.battle .overlay-inner > .arena { flex-shrink: 1; }
.photo-frame { position: relative; border-radius: 18px; overflow: hidden; border: 1px solid #2c4a52; background: #000; aspect-ratio: 1; max-height: 42vh; max-width: 100%; margin: 0 auto; width: 100%; }
.photo-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-frame .vf-sweep { animation-duration: 1.2s; }
.scan-hud { position: absolute; inset: 0; z-index: 3; display: grid; align-content: end; padding: 14px; gap: 6px; font: 600 12px var(--font-body); letter-spacing: .12em; color: var(--ecto); text-shadow: 0 0 6px #000; }
.scan-hud .meter { display: grid; grid-template-columns: 64px 1fr 40px; gap: 8px; align-items: center; }
.scan-hud .meter i { display: block; height: 6px; background: rgba(124,245,211,.18); border-radius: 3px; overflow: hidden; }
.scan-hud .meter i b { display: block; height: 100%; background: var(--ecto); width: 0; transition: width .25s; }
.scanning .photo-frame img { animation: glitch .25s steps(2) infinite; }
@keyframes glitch { 50% { filter: hue-rotate(40deg) contrast(1.3) saturate(1.4); transform: translateX(1px); } }
.cat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cat-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 9px 4px; display: grid; justify-items: center; gap: 2px; font-size: 12px; font-weight: 600; line-height: 1.15; text-align: center; min-height: 66px; }
.cat-btn .e { font-size: 22px; line-height: 1.1; }
.cat-btn.sel, .cat-btn:active { border-color: var(--ecto); background: #163330; }
.cat-btn.hint { border-color: var(--flash); }
.search { width: 100%; border-radius: 12px; border: 1px solid var(--line); background: #0d0a16; padding: 12px 14px; font-size: 16px; }
.ai-box { border: 1px dashed #5b4a8f; border-radius: 12px; padding: 10px 12px; font-size: 13px; color: #cfc6ee; }
.ai-box button { margin: 6px 6px 0 0; }

.discovery { align-items: center; justify-content: center; text-align: center; overflow: hidden; }
.disc-rays { position: absolute; inset: -50%; background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--rc) 30%, transparent) 0deg 10deg, transparent 10deg 24deg); animation: spin 14s linear infinite; opacity: .55; mask: radial-gradient(circle, #000 10%, transparent 55%); -webkit-mask: radial-gradient(circle, #000 10%, transparent 55%); }
@keyframes spin { to { transform: rotate(360deg); } }
.disc-flash { position: fixed; inset: 0; background: #fff; z-index: 40; pointer-events: none; animation: flash .6s ease-out forwards; }
@keyframes flash { from { opacity: 1; } to { opacity: 0; } }
.disc-sprite img { animation: reveal 1.3s cubic-bezier(.2,.9,.2,1.2) both, idle 1.8s 1.3s ease-in-out infinite; }
@keyframes reveal { 0% { transform: scale(.2) translateY(40px); filter: brightness(0) drop-shadow(0 0 0 #fff); } 55% { transform: scale(1.1); filter: brightness(0) drop-shadow(0 0 12px #fff); } 100% { transform: scale(1); filter: none; } }
.rarity-banner { font: 700 13px var(--font-body); letter-spacing: .3em; padding: 6px 16px; border: 2px solid currentColor; border-radius: 8px; display: inline-block; animation: bannerIn .5s .9s both; }
@keyframes bannerIn { from { opacity: 0; transform: scale(1.8); } }
.disc-name { font-size: clamp(26px, 8vw, 36px); line-height: 1.05; animation: bannerIn .5s 1.1s both; }
.new-tag { display: inline-block; background: var(--flash); color: #1b1206; font: 700 12px var(--font-body); letter-spacing: .14em; padding: 4px 10px; border-radius: 6px; animation: bannerIn .4s 1.4s both, wobble 1.6s 1.8s ease-in-out infinite; }
@keyframes wobble { 50% { transform: rotate(-4deg) scale(1.05); } }
.shake { animation: shake .45s ease; }
@keyframes shake { 20% { transform: translate(-6px, 3px); } 40% { transform: translate(5px, -4px); } 60% { transform: translate(-4px, 2px); } 80% { transform: translate(3px, -1px); } }

/* battle */
.battle .overlay-inner { padding-left: 0; padding-right: 0; gap: 0; overflow: hidden; }
.arena { position: relative; flex: 1; min-height: 300px; overflow: hidden; background: linear-gradient(180deg, color-mix(in srgb, var(--fc) 30%, #120d22) 0%, #120d22 58%, #1a1430 58.2%, #0e0b18 100%); }
.arena::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px); pointer-events: none; }
.plat { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.55), rgba(0,0,0,0)); }
.foe { position: absolute; right: 5%; top: 10%; width: 46%; }
.foe .plat { left: 5%; right: 5%; bottom: -4%; height: 18%; }
.foe img { width: 100%; }
.hero { position: absolute; left: 4%; bottom: 4%; width: 40%; }
.hero img.hunter { width: 100%; animation: idle 2s ease-in-out infinite; transform-origin: 50% 100%; }
.hero .plat { left: 0; right: 10%; bottom: -3%; height: 16%; }

<script>
/* SNAPMON — real photo input, on-device image analysis, optional live viewfinder and optional AI lens.
   Photos never leave the device. Pixels are reduced to a colour signature + 64-bit similarity hash, then discarded
   (unless the player opts in to keeping small thumbnails). */
'use strict';

const Photo = (() => {
  function loadFile(file) {
    return new Promise((resolve, reject) => {
      if (!file) return reject(new Error('No photo was selected.'));
      if (file.type && !file.type.startsWith('image/')) return reject(new Error('That file is not an image.'));
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => resolve({ img, url });
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('This photo format could not be read by the browser. Try JPEG or PNG.')); };
      img.src = url;
    });
  }

  function analyze(src) {
    const w = src.videoWidth || src.naturalWidth || src.width, h = src.videoHeight || src.naturalHeight || src.height;
    const c = document.createElement('canvas'); c.width = 64; c.height = 64;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    // centre crop: the object being photographed is usually in the middle
    const side = Math.min(w, h) * 0.8, sx = (w - side) / 2, sy = (h - side) / 2;
    ctx.drawImage(src, sx, sy, side, side, 0, 0, 64, 64);
    const d = ctx.getImageData(0, 0, 64, 64).data;
    const bins = new Array(24).fill(0); let sumS = 0, sumL = 0, n = 0;
    for (let i = 0; i < d.length; i += 4) {
      const r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255;
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, dd = mx - mn;
      const s = dd === 0 ? 0 : dd / (1 - Math.abs(2 * l - 1));
      let hh = 0;
      if (dd) { hh = mx === r ? ((g - b) / dd) % 6 : mx === g ? (b - r) / dd + 2 : (r - g) / dd + 4; hh *= 60; if (hh < 0) hh += 360; }
      if (s > 0.15 && l > 0.1 && l < 0.92) bins[Math.floor(hh / 15) % 24] += s;
      sumS += s; sumL += l; n++;
    }
    let best = 0; for (let i = 1; i < 24; i++) if (bins[i] > bins[best]) best = i;
    const hue = best * 15 + 7, sat = Math.min(1, sumS / n), lit = sumL / n;
    // average hash 8x8
    const c8 = document.createElement('canvas'); c8.width = 8; c8.height = 8;
    const x8 = c8.getContext('2d', { willReadFrequently: true }); x8.drawImage(c, 0, 0, 8, 8);
    const g8 = x8.getImageData(0, 0, 8, 8).data, gray = [];
    for (let i = 0; i < g8.length; i += 4) gray.push(g8[i] * 0.3 + g8[i + 1] * 0.59 + g8[i + 2] * 0.11);
    const avg = gray.reduce((a, b) => a + b, 0) / 64;
    let hash = '';
    for (let i = 0; i < 64; i += 4) hash += ((gray[i] > avg) << 3 | (gray[i + 1] > avg) << 2 | (gray[i + 2] > avg) << 1 | (gray[i + 3] > avg)).toString(16);
    const swatch = `hsl(${hue},${Math.round(Math.max(sat, 0.2) * 100)}%,${Math.round(Math.min(0.7, Math.max(0.3, lit)) * 100)}%)`;
    return { hue, sat: +sat.toFixed(3), lit: +lit.toFixed(3), hash, swatch };
  }

  function thumbnail(src, size = 96) {
    const w = src.videoWidth || src.naturalWidth || src.width, h = src.videoHeight || src.naturalHeight || src.height;
    const c = document.createElement('canvas'); c.width = size; c.height = size;
    const side = Math.min(w, h);
    c.getContext('2d').drawImage(src, (w - side) / 2, (h - side) / 2, side, side, 0, 0, size, size);
    return c.toDataURL('image/jpeg', 0.6);
  }

  /* Live viewfinder (getUserMedia). Only opened on an explicit tap; stream is stopped as soon as the photo is taken or the viewfinder closes. */
  let stream = null;
  const live = {
    supported: () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia),
    async open(video) {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }, audio: false });
      video.srcObject = stream; video.setAttribute('playsinline', ''); video.muted = true;
      await video.play();
    },
    snap(video) {
      const c = document.createElement('canvas'); c.width = video.videoWidth; c.height = video.videoHeight;
      c.getContext('2d').drawImage(video, 0, 0); return c;
    },
    close(video) {
      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = null; if (video) video.srcObject = null;
    },
    attach(video) { if (stream && video) { video.srcObject = stream; video.play().catch(() => {}); } },
    isOpen: () => !!stream,
  };

  /* Optional AI lens: MobileNet (ImageNet classes) running fully in the browser via TensorFlow.js.
     Downloads ~10 MB the first time. Some hosts (e.g. the Claude artifact sandbox) block the model download — then it reports unavailable. */
  const ai = { state: 'off', model: null, error: '' };
  function addScript(src) {
    return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.async = true; s.onload = res; s.onerror = () => rej(new Error('blocked: ' + src)); document.head.appendChild(s); });
  }
  ai.load = async function () {
    if (ai.model) return ai.model;
    if (ai.state === 'loading') return null;
    ai.state = 'loading'; ai.error = '';
    try {
      const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('timed out')), 45000));
      await Promise.race([(async () => {
        if (!window.tf) await addScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js');
        if (!window.mobilenet) await addScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js');
        ai.model = await window.mobilenet.load({ version: 2, alpha: 0.5 });
      })(), timeout]);
      ai.state = 'ready';
    } catch (e) { ai.state = 'failed'; ai.error = String(e.message || e); ai.model = null; }
    return ai.model;
  };
  ai.classify = async function (img) {
    if (!ai.model) return [];
    const preds = await ai.model.classify(img, 5);
    return preds.map(p => ({ label: p.className.split(',')[0], prob: p.probability, cat: matchCategory(p.className.replace(/,/g, ' ')) }));
  };

  return { loadFile, analyze, thumbnail, live, ai };
})();

</script>
<script>
/* SNAPMON — user interface: screens, photo flow, discovery, battle playback, collection, gear, research, settings. */
'use strict';

const ICON = {

/* ---------- toasts ---------- */
function toast(msg, kind = '') {
  const el = document.createElement('div'); el.className = 'toast ' + kind; el.textContent = msg;
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), 3200);
}

/* ---------- helpers for sprites ---------- */
function spriteHTML(dna, { size = 160, rarity = 'common', variant = null, cls = '' } = {}) {
  const tier = RARITY[rarity].tier;
  const sparks = tier >= 3 || variant === 'shiny' ? [0, 1, 2, 3, 4].map(i => `<i class="spark" style="left:${10 + i * 19}%;top:${20 + (i % 3) * 22}%;animation-delay:${i * 0.45}s"></i>`).join('') : '';

    ${tier >= 2 || variant ? '<i class="aura"></i>' : ''}${sparks}<img class="px" alt="" src="${spriteURL(dna, 5)}" style="width:100%"></div>`;
}
const rarityChip = r => `<span class="chip r" style="color:${RARITY[r].color}">${RARITY[r].name.toUpperCase()}</span>`;
const famChip = f => `<span class="chip" style="color:${FAMILIES[f].color}">${FAMILIES[f].glyph} ${FAMILIES[f].name}</span>`;
const varChip = v => v ? `<span class="chip" style="color:var(--violet)">${variantLabel(v)}</span>` : '';
function monsterTitle(m) { return m.nick ? esc(m.nick) : esc(m.name); }
function catLabel(m) { return m.cat === 'other' && m.word ? `“${esc(m.word)}”` : esc(CATEGORY[m.cat].name); }

/* ---------- top bar & tabs ---------- */
function renderTop() {
  regen(S);
  const hs = hunterStats(S), need = xpFor(S.level), hpPct = S.hp / hs.maxHp * 100;
  $('#topbar').innerHTML = `
    <div class="lvl-badge" aria-label="Hunter level ${S.level}"><div><span>LV</span><b>${S.level}</b></div></div>
    <div class="bars">
      <div class="bar-row"><span class="lbl">HP</span><div class="bar hp ${hpPct > 40 ? 'ok' : ''}"><i style="width:${hpPct}%"></i></div><span class="val">${S.hp}/${hs.maxHp}</span></div>
      <div class="bar-row"><span class="lbl">XP</span><div class="bar xp"><i style="width:${S.xp / need * 100}%"></i></div><span class="val">${S.xp}/${need}</span></div>
    </div>
    <div class="top-right">
      <div class="wallet"><span class="c">${S.coins}¢</span><span class="r">${S.rp} RP</span></div>
      <button class="icon-btn" data-act="mute" aria-label="${S.settings.muted ? 'Unmute sound' : 'Mute sound'}">${S.settings.muted ? ICON.mute : ICON.sound}</button>
      <button class="icon-btn" data-act="settings" aria-label="Settings and save data">${ICON.cog}</button>
    </div>`;
}
function claimableQuests() { return activeQuests(S).filter(q => questProgress(S, q) >= q.target).length; }
function renderTabs() {
  const tabs = [['hunt', 'Hunt'], ['dex', 'Monsters'], ['gear', 'Gear'], ['lab', 'Lab']];
  const dot = { lab: claimableQuests() > 0 || RESEARCH.some(r => !S.research[r.id] && S.rp >= r.cost && (!r.req || S.research[r.req])) };
  $('#tabs').innerHTML = tabs.map(([id, label]) => `<button class="${ui.tab === id ? 'on' : ''}" data-act="tab" data-arg="${id}" aria-current="${ui.tab === id}">${ICON[id]}${label}${dot[id] ? '<i class="dot"></i>' : ''}</button>`).join('');
}
function render() {
  renderTop(); renderTabs();
  const el = $('#screen');
  el.innerHTML = ({ hunt: huntScreen, dex: dexScreen, gear: gearScreen, lab: labScreen })[ui.tab]();
  el.classList.remove('screen-enter'); void el.offsetWidth; el.classList.add('screen-enter');
  if (ui.tab === 'hunt' && Photo.live.isOpen()) Photo.live.attach($('#liveVideo'));
  else if (ui.tab !== 'hunt' && Photo.live.isOpen()) { ui.liveWanted = false; Photo.live.close(); }
}

/* ---------- HUNT ---------- */
function huntScreen() {
  const hs = hunterStats(S), low = S.hp < hs.maxHp * 0.35;
  const quests = activeQuests(S);
  const ghost = S.monsters.length ? S.monsters[S.monsters.length - 1].dna : null;
  const live = ui.liveWanted || Photo.live.isOpen();
  return `
  <section class="viewfinder" id="vf">
    ${live ? '<video id="liveVideo" autoplay playsinline muted></video>' : ''}
    ${ghost && !live ? `<img class="vf-ghost px" alt="" src="${spriteURL(ghost, 3)}">` : ''}
    <i class="vf-corner tl"></i><i class="vf-corner tr"></i><i class="vf-corner bl"></i><i class="vf-corner br"></i><i class="vf-sweep"></i>
    ${live ? '' : `<div class="vf-center"><div><h1>Monsters hide <em>in plain sight</em></h1>
      <p>${S.stats.photos === 0 ? 'Photograph any real object near you — a mug, a shoe, a plant — and see what lives inside it.' : 'Snap a new object. Different things attract different creatures.'}</p></div></div>`}
    <div class="vf-hud"><span class="rec">SPIRIT CAM</span><span>${S.stats.photos} SNAPS · ${Object.keys(S.dex).length} SPECIES</span></div>
  </section>
  <div class="shutter-row">
    <label class="side-btn" for="galInput"><span class="ic">${ICON.gallery}</span>Gallery</label>
    ${live ? `<button class="shutter" data-act="liveSnap" aria-label="Take photo">SNAP</button>`
           : `<label class="shutter" for="camInput" role="button" aria-label="Open camera and take a photo">SNAP</label>`}
    ${live ? `<button class="side-btn" data-act="liveClose"><span class="ic">✕</span>Close</button>`
           : Photo.live.supported() ? `<button class="side-btn" data-act="liveOpen"><span class="ic">${ICON.live}</span>Live view</button>` : '<span></span>'}
  </div>
  ${low ? `<div class="card warn row"><div class="grow"><b>You're badly hurt.</b><div class="small muted">Monsters hit hard. Heal up before your next hunt — you also recover slowly over time.</div></div>
    ${S.items.potion ? `<button class="btn small" data-act="quickHeal">Drink potion (${S.items.potion})</button>` : `<button class="btn small" data-act="tab" data-arg="gear">Shop</button>`}</div>` : ''}
  <section class="card">
    <div class="section-title"><h2>Hunter's orders</h2><span class="small muted">${Object.keys(S.questsClaimed).length}/${QUESTS.length} done</span></div>
    ${quests.length ? quests.map(questHTML).join('') : '<p class="muted">Every order is complete. You are a legend of the hunt.</p>'}
  </section>
  ${ui.lastSightings.length ? `<section class="stack"><div class="section-title"><h2>Recent sightings</h2></div>
    <div class="sightings">${ui.lastSightings.map(s => `<div class="sighting"><img class="px" alt="" src="${spriteURL(s.dna, 3)}">${esc(s.name.split(',')[0])}<br><span style="color:${RARITY[s.rarity].color}">${s.outcome}</span></div>`).join('')}</div></section>` : ''}
  <p class="notice">Your photos stay on this phone. SNAPMON reads only colours and a similarity fingerprint from each picture, then throws the image away.</p>`;
}
function questHTML(q) {
  const p = questProgress(S, q), done = p >= q.target;
  const rw = Object.entries(q.reward).map(([k, v]) => rewardLabel(k, v)).join(', ');
  return `<div class="quest"><h3>${esc(q.name)}</h3>${done ? `<button class="btn small primary" data-act="claim" data-arg="${q.id}">Claim</button>` : `<span class="small muted num">${p}/${q.target}</span>`}
    <p>${esc(q.desc)} <span style="color:var(--flash)">· ${esc(rw)}</span></p><div class="bar"><i style="width:${p / q.target * 100}%"></i></div></div>`;

/* ---------- photo flow ---------- */
async function onPhotoFile(file) {
  SFX.shutter();
  try {
    const { img, url } = await Photo.loadFile(file);
    beginIdentify(img, url);
  } catch (e) { toast(e.message, 'bad'); }
}
async function openLive() {
  ui.tab = 'hunt'; ui.liveWanted = true; render();
  try { await Photo.live.open($('#liveVideo')); }
  catch (e) {
    ui.liveWanted = false; Photo.live.close(); render();
    toast(e && e.name === 'NotAllowedError' ? 'Camera permission was refused. The SNAP button still works — it opens your camera app.' : 'Live view is not available here. The SNAP button still opens your phone camera.', 'bad');
  }
}
function closeLive() { ui.liveWanted = false; Photo.live.close($('#liveVideo')); render(); }
function liveSnap() {
  const v = $('#liveVideo'); if (!v || !v.videoWidth) return;
  SFX.shutter();
  const canvas = Photo.live.snap(v);
  ui.liveWanted = false; Photo.live.close(v); render();
  beginIdentify(canvas, canvas.toDataURL('image/jpeg', 0.85));
}

function beginIdentify(img, url) {
  const photo = Photo.analyze(img);
  const thumb = S.settings.keepPhotos ? Photo.thumbnail(img) : null;
  ui.pending = { img, url, photo, thumb, cat: null, word: '', ai: null };
  showIdentify();
  if (S.settings.aiLens) runAI();
}
async function runAI() {
  const p = ui.pending; if (!p) return;
  p.ai = { state: 'loading' }; refreshAI();
  const model = await Photo.ai.load();
  if (ui.pending !== p) return;
  if (!model) { p.ai = { state: 'failed', error: Photo.ai.error }; refreshAI(); return; }
  try { p.ai = { state: 'ready', preds: await Photo.ai.classify(p.img) }; } catch (e) { p.ai = { state: 'failed', error: String(e.message || e) }; }
  refreshAI();
}
function aiHTML() {
  const p = ui.pending; if (!p || !S.settings.aiLens || !p.ai) return '';
  if (p.ai.state === 'loading') return `<div class="ai-box">AI Lens is analysing your photo on this device… (the first run downloads the model)</div>`;
  if (p.ai.state === 'failed') return `<div class="ai-box">AI Lens could not load here, so it can't suggest anything (${esc(p.ai.error)}). Pick the object yourself below — that always works.</div>`;

function spawnFx(kind) {

function anim(el, cls) { if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), 700); }
const STATUS_NAME = { poison: 'Poisoned', burn: 'Burning', stun: 'Stunned', defdown: 'Defense down', atkup: 'Attack up', defup: 'Defense up', immune: 'Immune' };

async function play(events) {
  const B = ui.battle;
  let lastFx = 'slash';
  for (const e of events) {
    if (!ui.battle) return;
    switch (e.t) {
      case 'act': {
        const actor = e.who === 'hero' ? 'You' : B.enemy.name.split(',')[0];
        if (e.who === 'hero') {
          setLog(e.name === 'Attack' ? `You attack with the ${WEAPONS[B.weapon].name}!` : e.name === 'Flee' ? 'You try to run…' : e.fx === 'item' ? `You use ${e.name}.` : e.fx === 'trap' ? 'You hurl a Snap Trap!' : `You unleash ${e.name}!`);
          if (e.fx === 'trap') break;
          if (e.fx && e.fx !== 'item') { anim($('#hero'), 'lunge-r'); lastFx = e.fx; await wait(e.special ? 320 : 180); }
          else await wait(350);
        } else {
          setLog(e.ability ? `${actor} uses ${e.name}!` : `${actor} attacks!`);
          if (e.ultimate) { const o = $('.overlay'); anim(o, 'shake'); }
          anim($('#foe'), 'lunge-l'); await wait(e.ability ? 420 : 260);
        }
        break;
      }
      case 'hit': {
        if (e.who === 'enemy') {
          spawnFx(lastFx); SFX.hit(lastFx); await wait(lastFx === 'orb' ? 300 : 120);
          B.disp.enemy = Math.max(0, B.disp.enemy - e.dmg);
          anim($('#foe img'), 'hitflash');
          floatText('enemy', (e.crit ? 'CRIT ' : '') + e.dmg, e.crit ? 'crit' : '', e.eff > 1 ? '#ffe55c' : e.eff < 1 ? '#a0a0b8' : '#fff');
          if (e.crit) anim($('.overlay'), 'shake');
        } else {
          heroImpact(); SFX.hurt();
          B.disp.hero = Math.max(0, B.disp.hero - e.dmg);
          anim($('#hero img'), 'hitflash');
          floatText('hero', (e.crit ? 'CRIT ' : '') + e.dmg, e.crit ? 'crit' : '', '#ff8a9a');
          if (e.crit) anim($('.overlay'), 'shake');
        }
        refreshBattleBars(); await wait(380); break;
      }
      case 'miss': SFX.miss(); floatText(e.who, 'MISS', '', '#a0a0b8'); setLog(e.who === 'enemy' ? 'Missed!' : 'You dodged it!'); await wait(380); break;
      case 'heal': SFX.heal(); B.disp[e.who] = Math.min(B[e.who].maxHp, B.disp[e.who] + e.amt); floatText(e.who, '+' + e.amt, '', '#7dff9a'); refreshBattleBars(); await wait(380); break;
      case 'status': SFX.status(); floatText(e.who, STATUS_NAME[e.s] || e.s, '', '#d6a2ff'); refreshBattleBars(); await wait(360); break;
      case 'dot': B.disp[e.who] = Math.max(0, B.disp[e.who] - e.dmg); floatText(e.who, e.dmg, '', e.s === 'poison' ? '#c48bff' : '#ffae5c'); setLog(`${e.who === 'hero' ? 'You take' : B.enemy.name.split(',')[0] + ' takes'} ${e.s} damage.`); refreshBattleBars(); await wait(420); break;
      case 'expire': refreshBattleBars(); break;
      case 'text': setLog(e.msg); await wait(e.stun ? 650 : 520); break;
      case 'capture': await captureAnim(e.ok); break;
      case 'end': break;
    }
  }
  B.disp.hero = B.hero.hp; B.disp.enemy = B.enemy.hp; refreshBattleBars();
}
async function captureAnim(ok) {
  const trap = spawnFx('trap'); const foe = $('#foe img');

async function battleAction(kind, arg) {
  const B = ui.battle; if (!B || ui.busy || B.over) return;
  let ev;

  else if (kind === 'special') { if (B.hero.energy < WEAPONS[B.weapon].special.cost) return toast('Not enough energy yet — basic attacks charge it.'); ev = heroStrike(B, S, true); }

  else if (kind === 'flee') ev = attemptFlee(B, S);
  else if (kind === 'item') { const r = useItem(B, S, arg); closeSheet(); if (!r.ok) return toast(r.ev[0] ? r.ev[0].msg : 'You cannot use that right now.'); ev = r.ev; }
  ui.busy = true; refreshActions();

}

function statBars(st) {
  const max = { hp: 260, atk: 60, def: 40, spd: 40 };
  return ['hp', 'atk', 'def', 'spd'].map(k => `<div class="stat"><b>${k.toUpperCase()}</b><div class="bar"><i style="width:${Math.min(100, st[k] / max[k] * 100)}%"></i></div><span>${st[k]}</span></div>`).join('');
}
function abilityDesc(a) {
  const parts = [];
  if (a.self) parts.push(a.effect === 'heal' ? 'Heals 25% of its HP' : a.effect === 'atkup' ? 'Raises its attack' : 'Raises its defense');
  else {
    parts.push(`${Math.round(a.power * 100)}% power${a.hits ? ' × ' + a.hits + ' hits' : ''}`);
    if (a.effect === 'drain') parts.push('heals itself for half the damage');
    else if (a.effect) parts.push(`${Math.round((a.chance || 1) * 100)}% chance to inflict ${STATUS_NAME[a.effect].toLowerCase()}`);
  }
  return parts.join(' · ') + ` · recharge ${a.cd} turns`;
}
function abilityHTML(a) { return `<div class="ability"><b>${esc(a.name)}${a.ultimate ? ' <span style="color:var(--r-legendary)">★ ULTIMATE</span>' : ''}</b><span class="muted">${esc(abilityDesc(a))}</span></div>`; }

      return `<div class="list-item" style="grid-template-columns:auto 1fr"><div class="item-ic"><i class="potion-ic" style="--pc:${it.color}"></i></div>
        <div class="grow"><h3>${esc(it.name)} <span class="muted num">×${S.items[id] || 0}</span></h3><p>${esc(it.desc)}</p>
        <div class="row wrap" style="margin-top:8px"><button class="btn small ${S.coins >= it.price ? 'primary' : 'disabled'}" data-act="buy" data-arg="${id}">Buy · ${it.price}¢</button>
        <button class="btn small ${canAfford(S, it.craft) ? 'ecto' : 'disabled'}" data-act="craft" data-arg="${id}">Craft · ${costHTML(it.craft)}</button></div></div></div>`;
    }).join('')}</div>`;
}

/* ---------- LAB ---------- */
function labScreen() {
  const n = claimableQuests();
  const seg = `<div class="seg">${[['research', 'Research'], ['quests', 'Orders' + (n ? ` (${n})` : '')], ['trophies', 'Trophies']].map(([id, l]) => `<button class="${ui.labTab === id ? 'on' : ''}" data-act="labTab" data-arg="${id}">${l}</button>`).join('')}</div>`;
  if (ui.labTab === 'research') {
    return `${seg}<div class="card row"><div class="grow"><h2 style="font-size:19px">Research Points: <span style="color:var(--ecto)">${S.rp}</span></h2>
      <div class="small muted">Earn RP by discovering new species (+2, more for rare ones), capturing a species for the first time (+3), levelling up, and completing orders.</div></div></div>
      <div class="stack">${RESEARCH.map(r => {
        const own = S.research[r.id], locked = r.req && !S.research[r.req], ok = S.rp >= r.cost && !locked;
        return `<div class="list-item ${own ? 'on' : ''} ${locked ? 'locked' : ''}" style="grid-template-columns:1fr auto"><div class="grow"><h3>${esc(r.name)}</h3><p>${esc(r.desc)}${locked ? ` <span style="color:var(--danger)">Requires ${esc(RESEARCH_BY_ID[r.req].name)}.</span>` : ''}</p></div>
          ${own ? '<span class="chip" style="color:var(--ecto)">DONE</span>' : `<button class="btn small ${ok ? 'ecto' : 'disabled'}" data-act="research" data-arg="${r.id}">${r.cost} RP</button>`}</div>`;
      }).join('')}</div>`;
  }
  if (ui.labTab === 'quests') {
    const done = QUESTS.filter(q => S.questsClaimed[q.id]);
    return `${seg}<section class="card"><div class="section-title"><h2>Active orders</h2></div>${activeQuests(S).map(questHTML).join('') || '<p class="muted">All orders complete!</p>'}</section>
      <section class="card"><div class="section-title"><h2>Completed</h2><span class="small muted">${done.length}/${QUESTS.length}</span></div>
      ${done.length ? done.map(q => `<div class="quest"><h3 class="muted">✓ ${esc(q.name)}</h3><span></span><p>${esc(q.desc)}</p></div>`).join('') : '<p class="muted small">Finished orders appear here.</p>'}</section>`;
  }
  const st = S.stats;
  return `${seg}<div class="stack">${ACHIEVEMENTS.map(a => `<div class="list-item ${S.achievements[a.id] ? 'on' : 'locked'}" style="grid-template-columns:auto 1fr auto"><div class="item-ic" style="color:${S.achievements[a.id] ? 'var(--flash)' : 'var(--line)'}">★</div>
      <div><h3>${esc(a.name)}</h3><p>${esc(a.desc)} · ${Object.entries(a.reward).map(([k, v]) => esc(rewardLabel(k, v))).join(', ')}</p></div>${S.achievements[a.id] ? `<span class="small muted">${fmtDate(S.achievements[a.id])}</span>` : '<span></span>'}</div>`).join('')}</div>
    <section class="card"><div class="section-title"><h2>Hunter's log</h2></div>
      <div class="wstats" style="font-size:13px"><span>Photos <b>${st.photos}</b></span><span>Encounters <b>${st.encounters}</b></span><span>Wins <b>${st.wins}</b></span><span>Captures <b>${st.captures}</b></span><span>Escapes <b>${st.flees}</b></span><span>Knockouts <b>${st.losses}</b></span><span>Object kinds <b>${Object.keys(st.catsPhotographed).length}</b></span></div></section>`;
}

/* ---------- settings ---------- */
function settingsSheet() {
  const ai = Photo.ai;
  openSheet(`<div class="sheet-head"><h2>Settings & save</h2><button class="btn small ghost" data-act="closeSheet">Close</button></div>
    <div class="card" style="padding-block:4px">
      <div class="toggle"><div><b>Sound effects</b><p>Synthesised on your device. Nothing plays until you tap.</p></div><button class="switch ${S.settings.muted ? '' : 'on'}" data-act="mute" aria-label="Toggle sound"></button></div>
      <div class="toggle"><div><b>AI Lens (experimental)</b><p>Suggests what your photo shows using MobileNet running in your browser. Downloads about 10 MB once; works only where the host allows it. ${ai.state === 'ready' ? 'Status: ready.' : ai.state === 'failed' ? 'Status: could not load here (' + esc(ai.error) + ').' : ai.state === 'loading' ? 'Status: loading…' : ''} You always confirm the object yourself.</p></div><button class="switch ${S.settings.aiLens ? 'on' : ''}" data-act="toggleAI" aria-label="Toggle AI lens"></button></div>
      <div class="toggle"><div><b>Keep photo thumbnails</b><p>Off by default. When on, a tiny 96 px copy of the photo is stored with monsters you capture, in this browser only.</p></div><button class="switch ${S.settings.keepPhotos ? 'on' : ''}" data-act="toggleKeep" aria-label="Toggle photo thumbnails"></button></div>
    </div>
    <div class="notice">${storageOK ? 'Progress saves automatically in this browser.' : 'This browser is blocking storage (private mode?), so progress will be lost when you close the page. Use the backup code below.'}</div>
    <div class="card stack"><b>Back up your progress</b><p class="small muted" style="margin:0">Copy this code somewhere safe (notes app, email to yourself). Paste it back below to restore on any device.</p>
      <textarea class="code" id="exportBox" readonly>${exportSave(S)}</textarea><button class="btn" data-act="copyExport">Copy backup code</button></div>
    <div class="card stack"><b>Restore from a backup code</b><textarea class="code" id="importBox" placeholder="Paste a SNAPMON1:… code here"></textarea><button class="btn ecto" data-act="importSave">Restore this backup</button></div>
    <div class="card stack" style="border-color:#6a2a3c"><b>Start over</b><p class="small muted" style="margin:0">Erases your hunter, monsters and encyclopedia from this browser. Type RESET to confirm.</p>
      <div class="row"><input class="search grow" id="resetBox" placeholder="RESET" autocomplete="off"><button class="btn danger" data-act="reset">Erase</button></div></div>
    <p class="small muted">SNAPMON never uploads your photos. There are no accounts, ads or purchases. Camera access is requested only when you tap SNAP or Live view, and the live camera stops the moment you take the shot.</p>`);
}

/* ---------- sheets ---------- */
function openSheet(html) {
  $('#sheet').innerHTML = `<div class="sheet-wrap" data-act="sheetBg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
}
function closeSheet() { $('#sheet').innerHTML = ''; }

/* ---------- actions ---------- */
const actions = {
  tab(id) { ui.tab = id; closeSheet(); render(); window.scrollTo({ top: 0 }); },
  mute() { S.settings.muted = !S.settings.muted; SFX.setMuted(S.settings.muted); persist(); renderTop(); if ($('#sheet').innerHTML) settingsSheet(); },
  settings: settingsSheet, closeSheet,
  sheetBg(_, el, ev) { if (ev.target === el) closeSheet(); },
  liveOpen: openLive, liveClose: closeLive, liveSnap,
  cancelPhoto,
  pickCat(cat) { const p = ui.pending; if (!p) return; scan(cat, cat === 'other' ? (p.word || 'mystery object') : p.word); },
  aiPick(cat, el) { const p = ui.pending; if (!p) return; p.word = el.dataset.word; scan(cat, cat === 'other' ? p.word : ''); },
  closeOverlay() { $('#overlay').innerHTML = ''; render(); },
  fight() { const m = ui.discovered; ui.discovered = null; if (m) startBattle(m); },
  ignore() {
    const m = ui.discovered; ui.discovered = null; $('#overlay').innerHTML = '';
    if (m && ui.lastSightings[0] && ui.lastSightings[0].dna === m.dna) ui.lastSightings[0].outcome = 'slipped away';
    toast(`${m ? m.name.split(',')[0] : 'It'} melts back into the shadows.`); render();
  },
  bAttack: () => battleAction('attack'), bSpecial: () => battleAction('special'), bCapture: () => battleAction('capture'), bFlee: () => battleAction('flee'),
  bItems() { if (!ui.busy) itemsSheet(); }, bInfo: infoSheet, bUse: id => battleAction('item', id),
  claim(id) {
    const r = claimQuest(S, id); if (!r) return;
    SFX.coin(); const lv = r.filter(x => x.levelUp);
    toast('Order complete: ' + r.filter(x => x.k).map(x => rewardLabel(x.k, x.v)).join(', '), 'gold');
    if (lv.length) SFX.levelup();
    checkAchievements(S).forEach(a => toast('Achievement: ' + a.name, 'gold'));
    persist(); render();
  },
  quickHeal() { const r = useItem(null, S, 'potion'); if (r.ok) { SFX.heal(); toast(`Healed ${r.ev[0].amt} HP.`); persist(); render(); } },
  dexView(v) { ui.dexView = v; render(); }, fR(v) { ui.fR = v; render(); }, fF(v) { ui.fF = v; render(); },
  mon: monsterSheet, species: speciesSheet,
  viewNew(id) { $('#overlay').innerHTML = ''; ui.tab = 'dex'; ui.dexView = 'captured'; render(); monsterSheet(id); },
  rename(id) {
    const m = S.monsters.find(x => x.id === id); if (!m) return;
    m.nick = ($('#nickInput').value || '').trim().slice(0, 20) || null; persist(); toast(m.nick ? `Renamed to ${m.nick}.` : 'Nickname removed.'); render(); monsterSheet(id);
  },
  buddy(id) { S.companion = S.companion === id ? null : id; S.hp = Math.min(S.hp, hunterStats(S).maxHp); persist(); render(); monsterSheet(id); },
  release(id, el) {
    if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = 'Tap again to release'; return; }
    const r = releaseMonster(S, id); closeSheet(); persist(); render();
    if (r) toast('Released into the wild. It left behind ' + Object.entries(r).map(([k, v]) => rewardLabel(k, v)).join(', ') + '.');
  },
  gearTab(t) { ui.gearTab = t; render(); }, labTab(t) { ui.labTab = t; render(); },
  equip(id) { if (S.weapons[id] != null) { S.equipped = id; SFX.click(); persist(); render(); } },
  upgrade(id) { if (upgradeWeapon(S, id)) { SFX.levelup(); toast(`${WEAPONS[id].name} upgraded to +${S.weapons[id]}!`, 'gold'); persist(); render(); } },
  unlockW(id) { if (unlockWeapon(S, id)) { SFX.rare(); toast(`Forged the ${WEAPONS[id].name}!`, 'gold'); checkAchievements(S).forEach(a => toast('Achievement: ' + a.name, 'gold')); persist(); render(); } },
  charm(id) { toggleCharm(S, id); persist(); render(); },
  useOut(id) { const r = useItem(null, S, id); if (r.ok) { SFX.heal(); toast(`${ITEMS[id].name} used.`); persist(); render(); } else if (r.ev[0]) toast(r.ev[0].msg); },
  buy(id) { if (buyItem(S, id)) { SFX.coin(); persist(); render(); } },
  craft(id) { if (craftItem(S, id)) { SFX.coin(); toast(`Crafted ${ITEMS[id].name}.`); persist(); render(); } },
  research(id) { if (buyResearch(S, id)) { SFX.levelup(); toast(`Research complete: ${RESEARCH_BY_ID[id].name}`, 'gold'); persist(); render(); } },
  toggleAI() { S.settings.aiLens = !S.settings.aiLens; persist(); if (S.settings.aiLens) Photo.ai.load().then(() => { if ($('#sheet').innerHTML) settingsSheet(); }); settingsSheet(); },
  toggleKeep() { S.settings.keepPhotos = !S.settings.keepPhotos; persist(); settingsSheet(); },
  copyExport() {
    const box = $('#exportBox'); box.value = exportSave(S);
    const fallback = () => { box.focus(); box.select(); toast('Code selected — use your phone’s Copy.'); };
    try { navigator.clipboard.writeText(box.value).then(() => toast('Backup code copied.'), fallback); } catch (e) { fallback(); }
  },
  importSave() {
    try { const s = importSave($('#importBox').value); S = s; saveState(S); SFX.setMuted(S.settings.muted); closeSheet(); render(); toast('Backup restored. Welcome back, hunter.', 'gold'); }
    catch (e) { toast(e.message || 'That code could not be read.', 'bad'); }
  },
  reset() {
    if (($('#resetBox').value || '').trim().toUpperCase() !== 'RESET') return toast('Type RESET in the box first.', 'bad');
    S = freshState(); saveState(S); ui.lastSightings = []; closeSheet(); ui.tab = 'hunt'; render(); toast('Fresh start. Go find your first monster.');
  },
};
document.addEventListener('click', ev => {
  SFX.unlock();
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const fn = actions[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'LABEL') { // labels open the camera via their `for` input; just run side effects
    if (el.dataset.act === 'closeOverlay') { $('#overlay').innerHTML = ''; setTimeout(render, 0); }
    return;
  }
  fn(el.dataset.arg, el, ev);
});
for (const id of ['camInput', 'galInput']) {
  const inp = document.getElementById(id);
  inp.addEventListener('click', () => { SFX.unlock(); });
  inp.addEventListener('change', () => { const f = inp.files && inp.files[0]; inp.value = ''; if (f) onPhotoFile(f); });
}
document.addEventListener('visibilitychange', () => { if (document.hidden) { persist(true); if (Photo.live.isOpen()) closeLive(); } });
window.addEventListener('pagehide', () => persist(true));
setInterval(() => { if (!ui.battle && !document.hidden) { const before = S.hp; regen(S); if (S.hp !== before) { renderTop(); persist(); } } }, 20000);

/* test hooks (used by the automated browser tests) */
window.__snapmon = { get S() { return S; }, set S(v) { S = v; }, ui, actions, setRNG: f => { RNG = f; }, render };

render();
persist(true);

</script>
